# fleetly 开发环境与任务（mise-en-place，模板同 torchwood）
#
#   mise install      安装 [tools] 钉版的全部开发工具
#   mise tasks        列出全部任务
#   mise run <task>   执行任务
#
# 任务统一用 sh 执行：Linux 自带，Windows 需 Git Bash 的 sh 在 PATH。

[tools]
go = "1.26.6"              # go.mod `go 1.26.6`
buf = "1.65.0"             # buf lint / buf generate（生成物零漂移）
protoc = "31.1"            # generate:config（config.pb.go 生成工具锁定）
protoc-gen-go = "1.36.11"  # generate:config；本地生成通道经 tools:protoc-plugins 同版本钉装
golangci-lint = "2.12.2"   # lint:golangci（与 CI 同版本）
node = "24.21.0"           # console 前端（F2.6/ADR-0044）；技术栈钉 node 24 线
pnpm = "12.9.1"            # console 包管理（aqua 后端 = GitHub releases）

[task_config]
shell = "sh -o errexit -c"

# 本地生成通道插件钉装（N0.1 P1-4）：四插件版本与 buf.gen.yaml 的 remote
# 钉版一一对应（protocolbuffers/go v1.36.11 / grpc-go v1.6.0 / gateway
# v2.27.4 / openapiv2 v2.27.3），装进仓内 .tmp-bin（gitignored）。走
# go install + Go 代理——本机 api.github.com 不可达（aqua/mise registry
# 后端装不了），CI 上同任务同样可复现。
[tasks."tools:protoc-plugins"]
description = "钉版安装本地生成通道四插件到 .tmp-bin"
run = '''
mkdir -p .tmp-bin
GOBIN="$PWD/.tmp-bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
GOBIN="$PWD/.tmp-bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
GOBIN="$PWD/.tmp-bin" go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.27.4
GOBIN="$PWD/.tmp-bin" go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.27.3
'''

[tasks."generate:proto"]
description = "buf lint + buf generate（genproto/**，remote 通道）"
run = ["buf lint", "buf generate"]

[tasks."generate:proto:local"]
description = "buf lint + 本地插件通道生成（genproto/**，离线可复现基线通道）"
run = '''
export PATH="$PWD/.tmp-bin:$PATH"
buf lint
buf generate --template buf.gen.local.yaml
'''

[tasks."generate:config"]
description = "config.proto -> config.pb.go"
dir = "internal/config"
run = "protoc -I. --go_out=. --go_opt=paths=source_relative ./config.proto"

# wire v0.7 内嵌 -mod=mod 在 go.work 下非法，生成任务必须 GOWORK=off
# （两仓实证坑，见 docs/design/2026-09-30-tech-stack.md §4.1）。
[tasks.wire]
description = "重生成 internal/assembly/wire_gen.go"
dir = "internal/assembly"
env = { GOWORK = "off" }
run = ["go mod tidy", "go run -mod=mod github.com/google/wire/cmd/wire"]

[tasks."generate:all"]
description = "generate:proto:local + generate:config + wire（基线通道）"
run = [
  { task = "tools:protoc-plugins" },
  { task = "generate:proto:local" },
  { task = "generate:config" },
  { task = "wire" },
]

[tasks."generate:verify"]
description = "基线通道重生成后零漂移断言（genproto/config/wire）"
run = [
  { task = "generate:all" },
  "git diff --exit-code -- genproto internal/config internal/assembly",
]

[tasks."lint:proto"]
description = "buf lint + 对 origin/main 的 breaking 检查"
run = ["buf lint", "buf breaking --against '.git#branch=origin/main'"]

[tasks."lint:go"]
description = "go vet + gofmt 检查"
run = '''
go vet ./... ./genproto/... ./sdk/go/...
test -z "$(gofmt -l . ./genproto ./sdk/go)"
'''

[tasks."lint:golangci"]
description = "golangci-lint 全量门禁（无棘轮豁免，见 .golangci.yml）"
run = "golangci-lint run ./..."

[tasks.lint]
description = "lint:go + lint:golangci + lint:proto"
run = [
  { task = "lint:go" },
  { task = "lint:golangci" },
  { task = "lint:proto" },
]

[tasks."dev:server"]
description = "启动 fleetlyd（go run ./cmd/fleetlyd）"
run = "go run ./cmd/fleetlyd"

[tasks.build]
description = "go build fleetlyd + fleetly 到 ./bin/"
run = '''
VERSION="$(git describe --tags --always)"
COMMIT="$(git rev-parse --short HEAD)"
DATE="$(date +%Y%m%d%H%M%S)"
LDFLAGS="-X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE"
go build -ldflags "$LDFLAGS" -o ./bin/ ./cmd/fleetlyd
go build -ldflags "$LDFLAGS" -o ./bin/ ./cmd/fleetly
'''

[tasks.test]
description = "全量测试：go test -race 三 module"
run = "go test -race ./... ./genproto/... ./sdk/go/..."

[tasks."e2e:dind"]
description = "e2e dind 单节点冒烟（F0.24：真 swarm Runtime + 真 Builder 全链）"
run = "sh e2e/dind-smoke.sh"

[tasks."e2e:h2c"]
description = "e2e dind 受管 traefik 挂项目网 + h2c Route 端到端（N0 修复批 B1）"
run = "sh e2e/dind-h2c-route.sh"

[tasks."e2e:twonode"]
description = "e2e dind 双节点：enroll join + 双节点部署 + 卷钉住（F0.20）"
run = "sh e2e/dind-two-node.sh"

[tasks."e2e:upgrade"]
description = "e2e dind 升级矩阵（P1：HEAD~1→HEAD 零扰动断言，ADR-0015 验收 CI 化）"
run = "sh e2e/dind-upgrade.sh"

[tasks."e2e:backup"]
description = "e2e dind 备份演练（F2.2 四引擎恢复演练 + Platform Backup roundtrip + F2.8 S3 离机腿，ADR-0039/0020/0042 验收必过项）"
run = "sh e2e/dind-backup.sh"

[tasks."e2e:bluegreen"]
description = "e2e dind 蓝绿全链（ADR-0048 P5/P16：零 5xx 切换/旧代存活/L1 零扰动/手动切回/supersede 零残留/双节点 Placement/P16 撞名消歧）"
run = "sh e2e/dind-bluegreen.sh"

# ---- Console（F2.6/ADR-0044：最小只读三页，React+Vite）----
# 产物输出 internal/console/dist（committed 生成物，纪律同 genproto）；
# 漂移门禁 console:verify 与 CI console job 同口径。

[tasks."console:install"]
description = "console 依赖安装（pnpm frozen lockfile）"
dir = "console"
run = "pnpm install --frozen-lockfile"

[tasks."console:gen"]
description = "openapi-typescript 从 genproto swagger 再生成 console/src/api（ADR-0044 悬空 $ref 预处理在内）"
dir = "console"
run = "pnpm gen"

[tasks."console:build"]
description = "console 类型检查 + 构建（产物进 internal/console/dist）"
dir = "console"
run = "pnpm build"

[tasks."console:dev"]
description = "console 开发服（vite，/v1 代理到 localhost:9081）"
dir = "console"
run = "pnpm dev"

[tasks."console:verify"]
description = "console 再生成 + 再构建 + 零漂移断言（src/api 类型 + dist 产物）"
run = [
  { task = "console:install" },
  { task = "console:gen" },
  { task = "console:build" },
  { task = "console:test" },
  "git diff --exit-code -- console/src/api internal/console/dist",
]

[tasks."console:test"]
description = "console 单测（vitest：tar 构建器/路由解析/载荷构造/TanStack Query 消费面）"
dir = "console"
run = "pnpm test"
