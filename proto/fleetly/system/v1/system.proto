syntax = "proto3";

// System 服务：控制面自身状态面（`fleetly status` / `fleetly doctor` 消费）。
// 公开面——安装引导期（Bootstrap Token 尚未生成）无凭证可用；诊断信息不含
// 敏感细节。
package fleetly.system.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/system/v1;systemv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";

// 统一 default 错误响应（运行时错误体即 fleetly.shared.v1.ErrorResponse），
// 文件级声明自动填充到本文件全部 operation。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

service SystemService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_PUBLIC };

  // GetVersion 返回控制面构建信息。
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option (google.api.http) = { get: "/v1/system/version" };
  }

  // GetStatus 返回控制面服务状态。
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (google.api.http) = { get: "/v1/system/status" };
  }

  // GetSchema 返回能力自描述全量文档（Spec 契约 + 事件 payload JSON
  // Schema，Go 类型反射生成——`fleetly schema` 消费；ADR-0026 形状钉扎）。
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse) {
    option (google.api.http) = { get: "/v1/system/schema" };
  }

  // Explain 返回单个资源的自描述（Spec 种类 "app"/"task"/"database" 或
  // 事件名 "deployment.succeeded"——`fleetly explain <资源>` 消费）。
  rpc Explain(ExplainRequest) returns (ExplainResponse) {
    option (google.api.http) = { get: "/v1/system/explain" };
  }
}

// PlatformService 是平台级操作面（`fleetly platform` 消费；与 SystemService
// 的公开诊断面分立——本面全部要凭证）。首个动词族 = Platform Backup
// （ADR-0039 决策 10；升级序前置=F2.3 的消费面，ADR-0015）。
service PlatformService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // TriggerPlatformBackup 立即同步执行一次 Platform Backup（不走节拍锚；
  // 执行时长受平台备份超时上界约束）。restic 缺席/链失败 = 精确失败。
  // 升级序的前置动词（ADR-0015：Platform Backup 前置）。在幂等执法面
  //（ADR-0024；ADR-0039 决策 10）。
  rpc TriggerPlatformBackup(TriggerPlatformBackupRequest) returns (TriggerPlatformBackupResponse) {
    option (google.api.http) = { post: "/v1/platform/backups" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "platform" op: SCOPE_OP_WRITE }
    };
  }
  // ListPlatformBackups 列举本地仓快照（restic snapshots 直读，零状态行
  // ——仓库自身即事实源，ADR-0039 决策 10）；新→旧分页（ADR-0026）。
  rpc ListPlatformBackups(ListPlatformBackupsRequest) returns (ListPlatformBackupsResponse) {
    option (google.api.http) = { get: "/v1/platform/backups" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "platform" op: SCOPE_OP_READ }
    };
  }
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string commit = 2;
  string date = 3;
}

message GetStatusRequest {}

message GetStatusResponse {
  StatusState state = 1;
  string version = 2;
}

// SchemaEntry 是一条可解释资源的自描述（寻址名/家族/摘要/契约体）。
message SchemaEntry {
  // name 是 explain 的寻址名：spec 用领域名词（app/task/database），
  // event 用事件名（deployment.succeeded）。
  string name = 1;
  // kind 是条目家族：spec | event。
  string kind = 2;
  // summary 是一句英文摘要（事件面单源自 eventcode 注册表）。
  string summary = 3;
  // schema_json 是 JSON Schema（draft-07 子集）的 canonical 紧凑 JSON
  // 文本；字段名 snake_case，与 CLI --json（protojson UseProtoNames）同
  // 一拼写面。
  string schema_json = 4;
}

message GetSchemaRequest {}

message GetSchemaResponse {
  // entries 按名字典序（输出确定性是 golden 钉扎的前提）。
  repeated SchemaEntry entries = 1;
}

message ExplainRequest {
  // resource 命名一条自描述条目（空或未知名 → E_INVALID_ARGUMENT /
  // E_NOT_FOUND，报错信息给出清单入口）。
  string resource = 1;
}

message ExplainResponse {
  SchemaEntry entry = 1;
}

enum StatusState {
  STATUS_STATE_UNSPECIFIED = 0;
  STATUS_STATE_HEALTHY = 1;
  STATUS_STATE_DEGRADED = 2;
}

message TriggerPlatformBackupRequest {}

// TriggerPlatformBackupResponse 携带本次执行后本地仓最新快照（整体成败
// 由 RPC 错误面承载；失败仓/外置仓细节进 platform.backup_failed 事件）。
message TriggerPlatformBackupResponse {
  PlatformSnapshot snapshot = 1;
}

message ListPlatformBackupsRequest {
  // after_snapshot_id 游标（上一页末条快照短 id；空 = 首页）。
  string after_snapshot_id = 1;
  int32 limit = 2;
}

message ListPlatformBackupsResponse {
  repeated PlatformSnapshot snapshots = 1;
}

// PlatformSnapshot 是本地仓快照行投影（restic snapshots 直读面）。
message PlatformSnapshot {
  string id = 1;       // restic 短 id
  string time = 2;     // RFC3339
  string hostname = 3; // 快照主机名（控制面节点）
}
