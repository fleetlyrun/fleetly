syntax = "proto3";

// Delivery 上下文（领域模型 §2）：源接入、构建、Revision 冻结与 Deployment
// 生命周期。Deploy 是一站式入口：两源归一化 → AppSpec 校验 → Revision
// 冻结（内容寻址复用）→ admission（ADR-0016）。
package fleetly.delivery.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/delivery/v1;deliveryv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

service DeploymentsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // Deploy 归一化两源（镜像直投 / Compose 受控子集）并受理部署。
  rpc Deploy(DeployRequest) returns (DeployResponse) {
    option (google.api.http) = { post: "/v1/deployments" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse) {
    option (google.api.http) = { get: "/v1/deployments/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_READ }
    };
  }
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse) {
    option (google.api.http) = { get: "/v1/deployments" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_READ }
    };
  }
  rpc CancelDeployment(CancelDeploymentRequest) returns (CancelDeploymentResponse) {
    option (google.api.http) = { post: "/v1/deployments/{id}/cancel" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
  // Rollback 是一等动词（F0.11）：Revision Replay——空目标回上一成功基线。
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/rollback" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
}

service RevisionsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse) {
    option (google.api.http) = { get: "/v1/revisions" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
  // DiffRevisions 输出两条 Revision 的字段级差异（路径字典序）。
  rpc DiffRevisions(DiffRevisionsRequest) returns (DiffRevisionsResponse) {
    option (google.api.http) = { get: "/v1/revisions/diff" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
}

service BuildsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse) {
    option (google.api.http) = { get: "/v1/builds" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_READ }
    };
  }
}

// Deployment 是受监督迁移的行形态（状态机值 kebab-case 与存储一致）。
message Deployment {
  string id = 1;
  string app_id = 2;
  string from_revision = 3;
  string to_revision = 4;
  string state = 5;
  uint64 generation = 6;
  string idempotency_key = 7;
  string commit_sha = 8;
  string superseded_by = 9;
  string error = 10;
  string observe_deadline = 11;
  string created_at = 12;
  string updated_at = 13;
  string finished_at = 14;
}

// DeployRequest 两源（互斥；spec_file 已归一化 AppSpec JSON 随 API 扩展批）。
message DeployRequest {
  string app_id = 1;
  // image 直投形态（如 nginx:1.27）。
  string image = 2;
  // compose_yaml 受控子集形态（白名单执法、受管字段显式拒绝）。
  string compose_yaml = 3;
  string idempotency_key = 4;
  string commit_sha = 5;
  bool supersede = 6;
  // process_name 覆盖直投形态的进程名（默认 web）。
  string process_name = 7;
}

message DeployResponse { Deployment deployment = 1; }
message GetDeploymentResponse { Deployment deployment = 1; }
message CancelDeploymentResponse { Deployment deployment = 1; }
message RollbackResponse { Deployment deployment = 1; }
message GetDeploymentRequest { string id = 1; }
message ListDeploymentsRequest { string app_id = 1; }
message ListDeploymentsResponse { repeated Deployment deployments = 1; }
message CancelDeploymentRequest { string id = 1; }
message RollbackRequest { string app_id = 1; string to_revision = 2; }

message Revision {
  string id = 1;
  string app_id = 2;
  int64 seq = 3;
  string digest = 4;
  string created_at = 5;
}

message ListRevisionsRequest { string app_id = 1; }
message ListRevisionsResponse { repeated Revision revisions = 1; }

message DiffEntry {
  string path = 1;
  string old_value = 2;
  string new_value = 3;
}

message DiffRevisionsRequest {
  string app_id = 1;
  // from/to 是 App 内 Revision 序号（R1..Rn 对外形态）。
  int64 from_seq = 2;
  int64 to_seq = 3;
}
message DiffRevisionsResponse { repeated DiffEntry entries = 1; }

message Build {
  string id = 1;
  string app_id = 2;
  string revision_id = 3;
  string state = 4;
  string digest = 5;
  string error = 6;
  string created_at = 7;
  string finished_at = 8;
}

message ListBuildsRequest { string app_id = 1; }
message ListBuildsResponse { repeated Build builds = 1; }
