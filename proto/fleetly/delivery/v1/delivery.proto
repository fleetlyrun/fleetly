syntax = "proto3";

// Delivery 上下文（领域模型 §2）：源接入、构建、Revision 冻结与 Deployment
// 生命周期。Deploy 是一站式入口：四源归一化（镜像直投 / Compose 受控子集 /
// 上传产物 / 裸 AppSpec）→ AppSpec 校验 → Revision 冻结（内容寻址复用）→
// admission（ADR-0016）。
package fleetly.delivery.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/delivery/v1;deliveryv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";
import "fleetly/spec/v1/spec.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

service DeploymentsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // Deploy 归一化四源（镜像直投 / Compose 受控子集 / 上传产物 / 裸
  // AppSpec）并受理部署。
  rpc Deploy(DeployRequest) returns (DeployResponse) {
    option (google.api.http) = { post: "/v1/deployments" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse) {
    option (google.api.http) = { get: "/v1/deployments/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_READ }
    };
  }
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse) {
    option (google.api.http) = { get: "/v1/deployments" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_READ }
    };
  }
  rpc CancelDeployment(CancelDeploymentRequest) returns (CancelDeploymentResponse) {
    option (google.api.http) = { post: "/v1/deployments/{id}/cancel" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
  // Rollback 是一等动词（F0.11）：Revision Replay——空目标回上一成功基线。
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/rollback" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }

  // RestartProcess 强制重排单个 Process 的载体（ADR-0069，排障动线"进程
  // 卡死 → 就地重启"）：不动镜像不动 Spec、零 lineage（不产生 Revision/
  // Deployment），经 Runtime 重启子面（swarm = ForceUpdate 滚动重排；
  // k3s = pod 驱逐由 Deployment 自愈）逐副本替换。与 ADR-0064 内容寻址
  // Ensure 互补：重发未变更 Spec 零替换，本动词是显式强制面。
  rpc RestartProcess(RestartProcessRequest) returns (RestartProcessResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/processes/{process_name}/restart" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }

  // WaitDeployment 是等待原语（F1.3，架构 §7）：事件流过滤实现——逐状态
  // 快照帧，终态帧后收流。Agent/Console 的"部署-等待-验证"循环不必自写
  // 轮询。WaitRun 随 Run 实体（F1.5/6）落地，不预发空面。
  rpc WaitDeployment(WaitDeploymentRequest) returns (stream WaitDeploymentResponse) {
    option (google.api.http) = { get: "/v1/deployments/{deployment_id}/wait" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_READ }
    };
  }
}

service RevisionsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse) {
    option (google.api.http) = { get: "/v1/revisions" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
  // DiffRevisions 输出两条 Revision 的字段级差异（路径字典序）。
  rpc DiffRevisions(DiffRevisionsRequest) returns (DiffRevisionsResponse) {
    option (google.api.http) = { get: "/v1/revisions/diff" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
  // GetRevision 回读单条 Revision 的冻结 AppSpec 全文（ADR-0071 决策 1
  // 冻结层）：(app_id, seq) 复合寻址，轴与 DiffRevisions 一致。与
  // GetAppSpec 的分立：GetAppSpec 是"最新冻结"（Redeploy 数据源，
  // ADR-0069），本面按号回读任意历史——部署详情"这次部署部署了什么"的
  // 数据源。
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse) {
    option (google.api.http) = { get: "/v1/revisions/{app_id}/{seq}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
  // GetAppWorkloads 按 Revision 只读重放 Workload 投影（ADR-0071 决策 1
  // 投影层："平台会下发什么"的正式答案）。seq 缺省 = 当前生效（最新成功
  // 部署的 to_revision——决策 2），显式 seq 重放历史（当前侧表的近似
  // 语义，决策 4）。渲染与部署投影单源；不透出面（载体原生形态/凭证/
  // 代戳）见决策 5。
  rpc GetAppWorkloads(GetAppWorkloadsRequest) returns (GetAppWorkloadsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app_id}/workloads" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
}

service BuildsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse) {
    option (google.api.http) = { get: "/v1/builds" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_READ }
    };
  }

  // StreamBuildLogs 读构建日志（B4：消费引擎最近缓冲——诚实边界同 F0.25
  // "仅实时+最近缓冲"，持久化检索 N2；follow 随构建推进续流至终态）。
  rpc StreamBuildLogs(StreamBuildLogsRequest) returns (stream StreamBuildLogsResponse) {
    option (google.api.http) = { get: "/v1/builds/logs" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_READ }
    };
  }

  // WaitBuild 是构建等待原语（F1.3，架构 §7）：状态快照帧，终态帧后收流。
  rpc WaitBuild(WaitBuildRequest) returns (stream WaitBuildResponse) {
    option (google.api.http) = { get: "/v1/builds/{build_id}/wait" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_READ }
    };
  }

  // UploadSource（F1.10，ADR-0019 附录 A）是仓内首个 client-streaming 写
  // 面：首帧 meta（project_id），余帧 chunk（tar 字节流），EOF 后内容寻址
  // 落库。gRPC-only：client-streaming 无 HTTP 注解面（先例=ReceiveWebhook
  // 无 HTTP 绑定；REST/Console 形态随 Console 批次另行裁决）。同字节重传
  // 天然幂等：同 digest 返回同一引用（deduplicated=true）。
  rpc UploadSource(stream UploadSourceRequest) returns (UploadSourceResponse) {
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_WRITE }
    };
  }

  // ListUploads 列项目上传产物（after_upload_id + limit 游标，ADR-0026
  // List 惯例）。
  rpc ListUploads(ListUploadsRequest) returns (ListUploadsResponse) {
    option (google.api.http) = { get: "/v1/uploads" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_READ }
    };
  }
}

// HooksService：per-App Git 触发配置 + GitHub push 接收面（F0.13）。配置
// 面走 apps 读写 Scope；接收面是 PUBLIC 档——HMAC 签名即凭证（与
// AcceptInvitation 同款自认证模式）。接收面无 HTTP 绑定：验签必须对原始
// 请求体字节计算（protojson 解码会改变字节形态），REST 入口
// /v1/hooks/<token> 由 gateway 直挂原生 handler 经本服务转发。
service HooksService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // SetGitHook 建/改配置；无 Token 时铸造（明文只在本响应出现一次，
  // 同一串兼作 GitHub webhook secret）。已配置过再 Set 只改配置不换 Token
  //（换 Token 用 RotateHookToken）。
  rpc SetGitHook(SetGitHookRequest) returns (SetGitHookResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/hook" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetGitHook(GetGitHookRequest) returns (GetGitHookResponse) {
    option (google.api.http) = { get: "/v1/apps/{app_id}/hook" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_READ }
    };
  }
  // RotateHookToken 吊销旧 Token 铸新（URL token 与 GitHub webhook secret
  // 同源双换；旧 Token 即刻失效）。
  rpc RotateHookToken(RotateHookTokenRequest) returns (RotateHookTokenResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/hook/rotate" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_WRITE }
    };
  }
  // RefreshGitHook 立即拉取 hook 材料并触发部署（push 通道的一等孪生：
  // 控制面拉取，不依赖 GitHub 侧 webhook 配置——App Templates 第三方模板
  // 仓无法配 webhook 的前提原语）。缺省拉 branch HEAD（commit 锚经
  // ls-remote 现解析，私有仓走同一材料解析面）；commit 非空时钉住该次
  // 同步。admission 与 push 同链（CommitSHA 去重——同 HEAD 重放回
  // deduplicated 既有部署）。
  rpc RefreshGitHook(RefreshGitHookRequest) returns (RefreshGitHookResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/hook/refresh" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_WRITE }
    };
  }
  // ReceiveWebhook 是 GitHub webhook 接收面（PUBLIC；gRPC-only——HTTP 侧由
  // gateway 原生 handler 直挂）。token 取 URL 段、payload 是原始请求体、
  // event/delivery/signature 对应 X-GitHub-Event / X-GitHub-Delivery /
  // X-Hub-Signature-256 头。
  rpc ReceiveWebhook(ReceiveWebhookRequest) returns (ReceiveWebhookResponse) {
    option (grpcapi.v1.method_auth) = { access: ACCESS_LEVEL_PUBLIC };
  }
}

// Deployment 是受监督迁移的行形态（状态机值 kebab-case 与存储一致）。
message Deployment {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 17;
  string app_id = 2;
  string from_revision = 3;
  string to_revision = 4;
  string state = 5;
  uint64 generation = 6;
  string idempotency_key = 7;
  string commit_sha = 8;
  string superseded_by = 9;
  string error = 10;
  string observe_deadline = 11;
  string created_at = 12;
  string updated_at = 13;
  string finished_at = 14;
  // first_boot_task_id 是部署当前锚定的 firstBootJobs 作业 Task（releasing
  // 态 jobs 子相位非空；无作业或已完成为空。ADR-0030）。
  string first_boot_task_id = 15;
  // from_generation 是基线 Generation（最近 succeeded 行的 gen；ADR-0048
  // 双代窗的旧代锚）。0 = 无基线（首次部署/存量行——protojson 零值省略，
  // 与 generation 的首代形态一致）。Console 判"双代窗进行中"= 活跃部署
  // state ∈ releasing/observing 且 from_generation < generation。
  uint64 from_generation = 16;
}

// DeployRequest 四源互斥（image 直投 / compose_yaml 受控子集 / upload_id
// 上传产物 / spec_file 裸 AppSpec，F3.5）。
message DeployRequest {
  // app_id 必填：目标 App 行（行级授权锚）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // image 直投形态（如 nginx:1.27）。
  string image = 2;
  // compose_yaml 受控子集形态（白名单执法、受管字段显式拒绝）。
  string compose_yaml = 3;
  string idempotency_key = 4;
  string commit_sha = 5;
  bool supersede = 6;
  // process_name 覆盖直投/上传形态的进程名（默认 web）。
  string process_name = 7;
  // http_probe/tcp_probe 是直投与上传形态的探针声明（B2：http/tcp 探针的
  // API 声明面，互斥；compose 形态经 healthcheck.http_path/tcp_port 扩展键）。
  string http_probe = 8;
  int32 tcp_probe = 9;
  // upload_id 是上传产物形态（F1.10，ADR-0019 附录 A）：引用 UploadSource
  // 返回的 id，与 image/compose_yaml 互斥；归属项目必须与 App 一致。
  string upload_id = 10;
  // dockerfile 是上传形态的构建文件路径（tar 内相对路径，缺省 Dockerfile）。
  string dockerfile = 11;
  // builder 是上传形态的构建器选择（dockerfile|railpack|static，ADR-0032；
  // 缺省 dockerfile；image/compose 形态携带即拒）。
  string builder = 12;
  // railpack_version 是 railpack 形态的钉版声明（builder=railpack 必填，
  // bare semver，须等于平台钉版）。
  string railpack_version = 13;
  // output_dir 是 static 形态的产物目录（builder=static 可选，缺省 "."）。
  string output_dir = 14;
  // env 是 App 级变量直传（ADR-0043 决策 2）：image/upload 形态的单进程
  // 环境变量；归一化期覆盖 Project 层 SharedVariable（同键）。compose 形态
  // 自带 environment 声明面，携带即拒。
  map<string, string> env = 15;
  // port/protocol 是直投与上传形态的端口声明（F3.5）：Route 后端解析的
  // 期望集供给面——单进程形态此前无 ports 声明通道（static Route 404 的
  // 根因）。protocol 缺省 http（http|h2c|tcp，Route 同词汇）；声明端口时
  // 进程同时挂靠项目 default 网络（Proxy 可达性）。compose/spec_file 形态
  // 自带 ports/networks 声明面，携带即拒。
  int32 port = 16;
  string protocol = 17;
  // spec_file 是裸 AppSpec 部署面（第四源，F3.5）：protojson（snake_case）
  // 的归一化 AppSpec——AppRef 由服务端按 app_id 权威覆写；schema_version
  // 缺省当前版。全部 AppSpec 字段经此成为 API 可写面（校验爆炸半径由
  // 叶子 ValidateApp 单源承载）。与 image/compose_yaml/upload_id 及全部
  // 单进程形态旗标（process_name/probe/port/env/builder 族）互斥。
  string spec_file = 18;
  // override_hook 是 hook 所有权闸门的一次性接管声明（ADR-0072 决策 4）：
  // 配置了 git hook 的 App 携带材料源（image/compose/upload）需显式置位
  // 才被受理（全量接管）；正规路径 = 先删 hook。spec_file 不受本旗标
  // 约束——hook 应用的 spec_file 恒为运行时 overlay（材料半边取冻结侧，
  // 提交件 source 被忽略）。
  bool override_hook = 19;
}

// Admission 是创建型部署受理的判定附注（P10：ADR-0016 语义的响应面显式
// 化——调用方（尤其 Agent）可判定"去重命中/排队第几位"，UI/API/webhook
// 三入口一致）。
message Admission {
  // outcome 四形态：queued（新受理，无合并无抢占）| merged（latest-wins：
  // 既有 queued 请求被本请求合并取代）| superseded（显式 supersede 抢占
  // 在途部署；同批合并的 queued 不另报）| deduplicated（同幂等键或同
  // commit 命中活跃既有部署）。幂等层命中（ADR-0024）逐字节重放原始
  // 响应、不标 deduplicated——幂等层与 admission 去重在响应里天然分立。
  string outcome = 1;
  // position 是本部署在 per-App 串行管线中的位次（1 = 队头/下一执行）；
  // 在途部署在前计位，被合并/被抢占的不计。deduplicated 时是命中既有
  // 部署的位次。
  int32 position = 2;
  // existing_deployment 在 outcome=deduplicated 时携带命中的既有部署引用
  //（与 deployment 字段同值——单独携带供程序化消费，不必比对）。
  string existing_deployment = 3;
}

message DeployResponse {
  Deployment deployment = 1;
  Admission admission = 2;
}
message GetDeploymentResponse { Deployment deployment = 1; }
message CancelDeploymentResponse { Deployment deployment = 1; }
message RollbackResponse {
  Deployment deployment = 1;
  Admission admission = 2;
}
message GetDeploymentRequest { string id = 1; }
message ListDeploymentsRequest {
  string app_id = 1;
  // after_deployment_seq 游标（上一页末条 seq；0 = 首页）。新→旧（seq
  // 创建序；ADR-0026 after_* + limit 惯例）。
  int64 after_deployment_seq = 2;
  int32 limit = 3;
}
message ListDeploymentsResponse { repeated Deployment deployments = 1; }
message CancelDeploymentRequest { string id = 1; }
message RollbackRequest { string app_id = 1; string to_revision = 2; }
// RestartProcessRequest 按进程名定位（App 域内 Workload ID = app_id +
// process_name，projection 单源）；进程必须存在于当前冻结 Spec（未知进程
// 精确拒绝——k3s pod 驱逐对零命中静默，引擎侧先行校验）。
message RestartProcessRequest { string app_id = 1; string process_name = 2; }
// RestartProcessResponse 空体：重启是 runtime-only 动作，无新记录可指。
message RestartProcessResponse {}
message WaitDeploymentRequest { string deployment_id = 1; }
// WaitDeploymentResponse 是状态快照帧；流在终态帧后关闭（终态集见
// Deployment.state 注释）。
message WaitDeploymentResponse { Deployment deployment = 1; }

message Revision {
  string id = 1;
  string app_id = 2;
  int64 seq = 3;
  string digest = 4;
  string created_at = 5;
  // process_strategies 是冻结体全进程的策略目录投影（F3.1 读面裁决：
  // Revision 行本就存 AppSpec 冻结体，本字段把 per-process strategy 从
  // "只能 diff 两侧才可见"升为列表即可见——首部署无 from 侧、replay 同
  // 侧 diff 均为空，diff 面不构成 Console 双代窗叙事的数据源）。全进程
  // 在场（含 rolling——strategy 缺省零值时 protojson 省略 strategy 字段，
  // 消费方按 rolling 解释，与 ProcessSpec.strategy 的缺省语义同款）。
  repeated ProcessStrategy process_strategies = 6;
  // source_kind 是冻结体材料来源投影（ADR-0071 决策 6：逐 Revision
  // provenance，从 source oneof 派生，零迁移——git push 覆盖历史从此
  // 可读）。口径 = "谁提供了构建材料"，非"谁发起的部署"（后者属审计面）。
  SourceKind source_kind = 7;
  // source_text 是受理原文（ADR-0074 决策 7）：compose 源的用户亲笔文件
  // 原样冻结；其他源（image/upload/git/spec_file）为空。不参与 digest
  // （内容寻址以 IR protojson 为锚）；读面按非空渲染 compose 源卡。
  string source_text = 8;
}

// SourceKind 是 Revision 材料来源的分类投影（ADR-0071 决策 6；值域对齐
// spec.v1.Source oneof 三形态）。
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_GIT = 1;
  SOURCE_KIND_IMAGE = 2;
  SOURCE_KIND_UPLOAD = 3;
}

// ProcessStrategy 是 Revision 冻结体的单进程策略摘要（F3.1：双代窗叙事
// 的最小读面——名字 + 策略，不携带 spec 全文；声明序即列表序）。
message ProcessStrategy {
  string process = 1;
  // strategy 缺省零值（UNSPECIFIED）= rolling（spec.v1.DeployStrategy 的
  // 归一化语义；ADR-0048 决策 1）。
  fleetly.spec.v1.DeployStrategy strategy = 2;
}

message ListRevisionsRequest {
  string app_id = 1;
  // after_seq 游标（上一页末条 seq；0 = 首页）。游标轴 = App 内 R1..Rn
  // 单调序号升序（既有响应序不变，events 面同款升序形态；ADR-0026）。
  int64 after_seq = 2;
  int32 limit = 3;
}
message ListRevisionsResponse { repeated Revision revisions = 1; }

message DiffEntry {
  string path = 1;
  string old_value = 2;
  string new_value = 3;
}

message DiffRevisionsRequest {
  // app_id 必填：diff 所在 App（行级授权锚）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // from/to 是 App 内 Revision 序号（R1..Rn 对外形态）。
  int64 from_seq = 2;
  int64 to_seq = 3;
}
message DiffRevisionsResponse { repeated DiffEntry entries = 1; }

// ---- Workload 视图（ADR-0071 投影层） ----

message GetRevisionRequest {
  // app_id 必填：Revision 所在 App（行级授权锚）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // seq 是 App 内 Revision 序号（R1..Rn 对外形态）。
  int64 seq = 2;
}
message GetRevisionResponse {
  Revision revision = 1;
  fleetly.spec.v1.AppSpec spec = 2;
}

message GetAppWorkloadsRequest {
  // app_id 必填：Workload 视图所属 App（行级授权锚）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // seq 缺省 0 = 当前生效（最新成功部署的 to_revision，ADR-0071 决策 2）；
  // 显式 seq = 历史重放（当前侧表近似，决策 4）。无成功部署的缺省寻址
  // → E_NOT_FOUND。
  int64 seq = 2;
}
message GetAppWorkloadsResponse {
  // revision 锚定本次渲染寻址到的 Revision（缺省寻址时 = 当前生效）。
  Revision revision = 1;
  repeated Workload workloads = 2;
}

// Workload 是 Workload 视图的单载体投影（ADR-0071 投影层）：
// capability.Workload 的用户面字段镜像。不进视图的面：Generation（渲染
// 非下发，代戳语义归 ADR-0064 的 Ensure 与观测层）、Materials（凭证永不
// 进视图，ADR-0014）、受管域专用声明（global/skip_materials/host_binds/
// network_refs/publish——用户 Spec 投影白名单外）。
message Workload {
  string id = 1;
  string process = 2;
  // image 是下发镜像引用（from_build 已解析为 digest 形态）。
  string image = 3;
  repeated string command = 4;
  // env 是合成终态的非敏感环境变量（变量三级合成的最终形态）。
  map<string, string> env = 5;
  repeated fleetly.spec.v1.PortSpec ports = 6;
  int64 replicas = 7;
  // healthcheck 是全解析探针（投影期一次解析的终态）。
  WorkloadHealthcheck healthcheck = 8;
  fleetly.spec.v1.ResourcesSpec resources = 9;
  // placement 含卷钉住合并结果（已钉卷的节点进约束集）。
  fleetly.spec.v1.PlacementSpec placement = 10;
  repeated fleetly.spec.v1.VolumeAttachment volumes = 11;
  repeated string networks = 12;
  // egress_networks 是 networks 中声明 egress:none 的子集（空 = 无出站
  // 限制）。
  repeated string egress_networks = 13;
  // addressing 是平台标准 DNS 裸名声明。
  repeated string addressing = 14;
  // restart 是生命周期声明（空 = Provider 缺省；值域 any/never/on-failure
  // 等——CONTEXT.md Restart 词条轴）。
  string restart = 15;
  google.protobuf.Duration stop_grace = 16;
}

// WorkloadHealthcheck 是全解析探针投影：与 spec.v1.HealthcheckSpec 的声明
// 形态分立——oneof 装不下解析结果（http 探针的端口回退链解析后恒显式、
// exec 恒干净 argv）。
message WorkloadHealthcheck {
  string http_path = 1;
  // http_port 是 http 探针的显式端口（投影解析终态；非 http 探针恒 0）。
  int32 http_port = 2;
  int32 tcp_port = 3;
  repeated string exec = 4;
  google.protobuf.Duration interval = 5;
  google.protobuf.Duration timeout = 6;
  google.protobuf.Duration start_period = 7;
  int32 retries = 8;
}

message Build {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 9;
  string app_id = 2;
  string revision_id = 3;
  string state = 4;
  string digest = 5;
  string error = 6;
  string created_at = 7;
  string finished_at = 8;
}

message ListBuildsRequest {
  string app_id = 1;
  // after_build_seq 游标（上一页末条 seq；0 = 首页）。新→旧（seq 创建
  // 序；ADR-0026 after_* + limit 惯例）。
  int64 after_build_seq = 2;
  int32 limit = 3;
}
message ListBuildsResponse { repeated Build builds = 1; }

// StreamBuildLogs（B4）：请求按 build id；follow 续流至终态。
message StreamBuildLogsRequest {
  string build_id = 1;
  bool follow = 2;
}

// StreamBuildLogsResponse 一帧构建日志（time RFC3339）。
message StreamBuildLogsResponse {
  string build_id = 1;
  string time = 2;
  bytes line = 3;
}

message WaitBuildRequest { string build_id = 1; }
// WaitBuildResponse 是状态快照帧；流在终态帧后关闭。
message WaitBuildResponse { Build build = 1; }

// UploadSourceRequest 是上传流的单帧：首帧 meta（且仅一次），余帧 chunk。
// chunk 建议 ≤1MiB（单条消息远小于 gRPC 收包上限 32MiB；总量上限由服务端
// 字节计数执法，见 ADR-0019 附录 A.3）。
message UploadSourceRequest {
  oneof part {
    UploadSourceMeta meta = 1;
    bytes chunk = 2;
  }
}

// UploadSourceMeta 是上传首帧：Upload 是 project 级材料（与 Secret/Config
// 同口径——跨 App 共享，归属校验在 Deploy 受理位）。
message UploadSourceMeta {
  string project_id = 1;
}

// UploadSourceResponse 是上传终态：id 是后续 Deploy 的 upload_id。同字节
// 重传返回同一 id（deduplicated=true）。
message UploadSourceResponse {
  string id = 1;
  string digest = 2;    // sha256 hex（内容寻址）
  int64 size_bytes = 3;
  bool deduplicated = 4;
}

// Upload 是上传产物行投影（ListUploads 读面）。
message Upload {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 6;
  string project_id = 2;
  string digest = 3;
  int64 size_bytes = 4;
  string created_at = 5;
}

message ListUploadsRequest {
  // project_id 必填：List 面的项目锚（行级授权沿此轴，ADR-0035）。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  int64 after_upload_seq = 2;
  int32 limit = 3;
}
message ListUploadsResponse { repeated Upload uploads = 1; }

// GitHook 是 per-App Git 触发配置投影（secret 永不回显——完整明文只在
// 铸造响应出现一次）。
message GitHook {
  string app_id = 1;
  string repo = 2;                  // 仓库 URL（构建检出源）
  string branch = 3;                // 分支过滤（空 = 全部分支；tag 一律不触发）
  string dockerfile = 4;            // 构建文件路径（缺省 Dockerfile）
  repeated string watch_paths = 5;  // 触发路径前缀（空 = 全部变更触发）
  string token_prefix = 6;          // URL token 前缀（泄露识别锚）
  string created_at = 7;
  string updated_at = 8;
}

message SetGitHookRequest {
  // app_id 必填：hook 挂靠的 App 行（行级授权锚）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // repo 必填：https:// 直连仓库 URL（构建检出源）；URL 形态执法
  // （https 白名单/嵌入材料/空白控制字符/私网段）在服务内——本面只钉
  // 在场性。
  string repo = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty (the git URL builds are checked out from)"
      expression: "this.size() > 0"
    }
  ];
  string branch = 3;
  string dockerfile = 4;
  repeated string watch_paths = 5;
}

message SetGitHookResponse {
  GitHook hook = 1;
  // secret 是完整明文（flthook_ 前缀），仅首次配置铸造时返回一次；同一串
  // 用作 GitHub 仓库的 webhook secret。
  string secret = 2;
}

message GetGitHookRequest { string app_id = 1; }
message GetGitHookResponse { GitHook hook = 1; }

message RotateHookTokenRequest { string app_id = 1; }
message RotateHookTokenResponse {
  GitHook hook = 1;
  string secret = 2; // 新明文，仅此一次
}

message RefreshGitHookRequest {
  // app_id 必填：目标 hook 的 App 行（行级授权锚）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // commit 缺省 = branch HEAD 现解析（ls-remote）；非空 = 钉住该 commit
  // 同步（apitest/重放锚）。
  string commit = 2;
}

message RefreshGitHookResponse {
  string deployment_id = 1;
  // commit 是本次拉取锚定的 HEAD（或调用方钉住的 commit）。
  string commit = 2;
  // admission 携带受理判定附注（accepted/deduplicated，与 webhook 面同
  // 口径——同 commit 重放回既有部署引用）。
  Admission admission = 3;
}

message ReceiveWebhookRequest {
  string token = 1;      // URL token 明文
  bytes payload = 2;     // 原始请求体（验签对象）
  string event = 3;      // X-GitHub-Event（ping/push）
  string delivery = 4;   // X-GitHub-Delivery（幂等键派生源，gateway 侧 webhook:<delivery>）
  string signature = 5;  // X-Hub-Signature-256（"sha256=<hex>"）
}

message ReceiveWebhookResponse {
  // status: pong（ping 事件）| accepted | skipped | ignored
  //（非 ping/push 事件）。重投不设独立状态：同 delivery 重投经幂等键
  // 重放首次响应（ADR-0024/Q-21）。
  string status = 1;
  string reason = 2; // skipped 细节（branch/path/skip 标记）
  string deployment_id = 3;
  // admission 在 status=accepted 时携带（push 触发部署的判定附注——
  // 同 commit 重复投递可见 deduplicated + existing_deployment；skipped/
  // ignored/pong 不携带）。
  Admission admission = 4;
}
