syntax = "proto3";

// Delivery 上下文（领域模型 §2）：源接入、构建、Revision 冻结与 Deployment
// 生命周期。Deploy 是一站式入口：两源归一化 → AppSpec 校验 → Revision
// 冻结（内容寻址复用）→ admission（ADR-0016）。
package fleetly.delivery.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/delivery/v1;deliveryv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

service DeploymentsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // Deploy 归一化两源（镜像直投 / Compose 受控子集）并受理部署。
  rpc Deploy(DeployRequest) returns (DeployResponse) {
    option (google.api.http) = { post: "/v1/deployments" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse) {
    option (google.api.http) = { get: "/v1/deployments/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_READ }
    };
  }
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse) {
    option (google.api.http) = { get: "/v1/deployments" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_READ }
    };
  }
  rpc CancelDeployment(CancelDeploymentRequest) returns (CancelDeploymentResponse) {
    option (google.api.http) = { post: "/v1/deployments/{id}/cancel" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
  // Rollback 是一等动词（F0.11）：Revision Replay——空目标回上一成功基线。
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/rollback" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "deployments" op: SCOPE_OP_WRITE }
    };
  }
}

service RevisionsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse) {
    option (google.api.http) = { get: "/v1/revisions" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
  // DiffRevisions 输出两条 Revision 的字段级差异（路径字典序）。
  rpc DiffRevisions(DiffRevisionsRequest) returns (DiffRevisionsResponse) {
    option (google.api.http) = { get: "/v1/revisions/diff" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "revisions" op: SCOPE_OP_READ }
    };
  }
}

service BuildsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse) {
    option (google.api.http) = { get: "/v1/builds" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_READ }
    };
  }

  // StreamBuildLogs 读构建日志（B4：消费引擎最近缓冲——诚实边界同 F0.25
  // "仅实时+最近缓冲"，持久化检索 N2；follow 随构建推进续流至终态）。
  rpc StreamBuildLogs(StreamBuildLogsRequest) returns (stream StreamBuildLogsResponse) {
    option (google.api.http) = { get: "/v1/builds/logs" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "builds" op: SCOPE_OP_READ }
    };
  }
}

// HooksService：per-App Git 触发配置 + GitHub push 接收面（F0.13）。配置
// 面走 apps 读写 Scope；接收面是 PUBLIC 档——HMAC 签名即凭证（与
// AcceptInvitation 同款自认证模式）。接收面无 HTTP 绑定：验签必须对原始
// 请求体字节计算（protojson 解码会改变字节形态），REST 入口
// /v1/hooks/<token> 由 gateway 直挂原生 handler 经本服务转发。
service HooksService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // SetGitHook 建/改配置；无 Token 时铸造（明文只在本响应出现一次，
  // 同一串兼作 GitHub webhook secret）。已配置过再 Set 只改配置不换 Token
  //（换 Token 用 RotateHookToken）。
  rpc SetGitHook(SetGitHookRequest) returns (SetGitHookResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/hook" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetGitHook(GetGitHookRequest) returns (GetGitHookResponse) {
    option (google.api.http) = { get: "/v1/apps/{app_id}/hook" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_READ }
    };
  }
  // RotateHookToken 吊销旧 Token 铸新（URL token 与 GitHub webhook secret
  // 同源双换；旧 Token 即刻失效）。
  rpc RotateHookToken(RotateHookTokenRequest) returns (RotateHookTokenResponse) {
    option (google.api.http) = { post: "/v1/apps/{app_id}/hook/rotate" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_WRITE }
    };
  }
  // ReceiveWebhook 是 GitHub webhook 接收面（PUBLIC；gRPC-only——HTTP 侧由
  // gateway 原生 handler 直挂）。token 取 URL 段、payload 是原始请求体、
  // event/delivery/signature 对应 X-GitHub-Event / X-GitHub-Delivery /
  // X-Hub-Signature-256 头。
  rpc ReceiveWebhook(ReceiveWebhookRequest) returns (ReceiveWebhookResponse) {
    option (grpcapi.v1.method_auth) = { access: ACCESS_LEVEL_PUBLIC };
  }
}

// Deployment 是受监督迁移的行形态（状态机值 kebab-case 与存储一致）。
message Deployment {
  string id = 1;
  string app_id = 2;
  string from_revision = 3;
  string to_revision = 4;
  string state = 5;
  uint64 generation = 6;
  string idempotency_key = 7;
  string commit_sha = 8;
  string superseded_by = 9;
  string error = 10;
  string observe_deadline = 11;
  string created_at = 12;
  string updated_at = 13;
  string finished_at = 14;
}

// DeployRequest 两源（互斥；spec_file 已归一化 AppSpec JSON 随 API 扩展批）。
message DeployRequest {
  string app_id = 1;
  // image 直投形态（如 nginx:1.27）。
  string image = 2;
  // compose_yaml 受控子集形态（白名单执法、受管字段显式拒绝）。
  string compose_yaml = 3;
  string idempotency_key = 4;
  string commit_sha = 5;
  bool supersede = 6;
  // process_name 覆盖直投形态的进程名（默认 web）。
  string process_name = 7;
  // http_probe/tcp_probe 是直投形态的探针声明（B2：http/tcp 探针的 API
  // 声明面，互斥；compose 形态经 healthcheck.http_path/tcp_port 扩展键）。
  string http_probe = 8;
  int32 tcp_probe = 9;
}

message DeployResponse { Deployment deployment = 1; }
message GetDeploymentResponse { Deployment deployment = 1; }
message CancelDeploymentResponse { Deployment deployment = 1; }
message RollbackResponse { Deployment deployment = 1; }
message GetDeploymentRequest { string id = 1; }
message ListDeploymentsRequest { string app_id = 1; }
message ListDeploymentsResponse { repeated Deployment deployments = 1; }
message CancelDeploymentRequest { string id = 1; }
message RollbackRequest { string app_id = 1; string to_revision = 2; }

message Revision {
  string id = 1;
  string app_id = 2;
  int64 seq = 3;
  string digest = 4;
  string created_at = 5;
}

message ListRevisionsRequest { string app_id = 1; }
message ListRevisionsResponse { repeated Revision revisions = 1; }

message DiffEntry {
  string path = 1;
  string old_value = 2;
  string new_value = 3;
}

message DiffRevisionsRequest {
  string app_id = 1;
  // from/to 是 App 内 Revision 序号（R1..Rn 对外形态）。
  int64 from_seq = 2;
  int64 to_seq = 3;
}
message DiffRevisionsResponse { repeated DiffEntry entries = 1; }

message Build {
  string id = 1;
  string app_id = 2;
  string revision_id = 3;
  string state = 4;
  string digest = 5;
  string error = 6;
  string created_at = 7;
  string finished_at = 8;
}

message ListBuildsRequest { string app_id = 1; }
message ListBuildsResponse { repeated Build builds = 1; }

// StreamBuildLogs（B4）：请求按 build id；follow 续流至终态。
message StreamBuildLogsRequest {
  string build_id = 1;
  bool follow = 2;
}

// StreamBuildLogsResponse 一帧构建日志（time RFC3339）。
message StreamBuildLogsResponse {
  string build_id = 1;
  string time = 2;
  bytes line = 3;
}

// GitHook 是 per-App Git 触发配置投影（secret 永不回显——完整明文只在
// 铸造响应出现一次）。
message GitHook {
  string app_id = 1;
  string repo = 2;                  // 仓库 URL（构建检出源）
  string branch = 3;                // 分支过滤（空 = 全部分支；tag 一律不触发）
  string dockerfile = 4;            // 构建文件路径（缺省 Dockerfile）
  repeated string watch_paths = 5;  // 触发路径前缀（空 = 全部变更触发）
  string token_prefix = 6;          // URL token 前缀（泄露识别锚）
  string created_at = 7;
  string updated_at = 8;
}

message SetGitHookRequest {
  string app_id = 1;
  string repo = 2;
  string branch = 3;
  string dockerfile = 4;
  repeated string watch_paths = 5;
}

message SetGitHookResponse {
  GitHook hook = 1;
  // secret 是完整明文（flthook_ 前缀），仅首次配置铸造时返回一次；同一串
  // 用作 GitHub 仓库的 webhook secret。
  string secret = 2;
}

message GetGitHookRequest { string app_id = 1; }
message GetGitHookResponse { GitHook hook = 1; }

message RotateHookTokenRequest { string app_id = 1; }
message RotateHookTokenResponse {
  GitHook hook = 1;
  string secret = 2; // 新明文，仅此一次
}

message ReceiveWebhookRequest {
  string token = 1;      // URL token 明文
  bytes payload = 2;     // 原始请求体（验签对象）
  string event = 3;      // X-GitHub-Event（ping/push）
  string delivery = 4;   // X-GitHub-Delivery（幂等键派生源，gateway 侧 webhook:<delivery>）
  string signature = 5;  // X-Hub-Signature-256（"sha256=<hex>"）
}

message ReceiveWebhookResponse {
  // status: pong（ping 事件）| accepted | skipped | ignored
  //（非 ping/push 事件）。重投不设独立状态：同 delivery 重投经幂等键
  // 重放首次响应（ADR-0024/Q-21）。
  string status = 1;
  string reason = 2; // skipped 细节（branch/path/skip 标记）
  string deployment_id = 3;
}
