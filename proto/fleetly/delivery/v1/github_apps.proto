syntax = "proto3";

// GitHub App 接入材料面（ADR-0073 阶段 B）：私有 Git 仓库的一等接入体。
// 私钥 age 信封只写不读——读面只回指纹；Owner 受理即经 GitHub API 验证
// 并自动解析（请求不携带属主）。双作用域：project_id（Project 级，行级
// 授权）或 global（平台级，平台管理授权，全项目可用）；解析时 Project
// 级遮蔽 Global。
package fleetly.delivery.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/delivery/v1;deliveryv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "grpcapi/v1/policy.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

service GitHubAppsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  // SetGitHubApp 受理即验证：私钥签 JWT 读 installation 对象，校验三元
  // 组并解析属主后落库（错值精确报错，不等到首次构建）；同作用域同属主
  // 重复调用 = 覆盖更新（私钥轮换 = 重放 put）。明文只进受理与验证，
  // 响应与读面只回指纹。
  rpc SetGitHubApp(SetGitHubAppRequest) returns (SetGitHubAppResponse) {
    option (google.api.http) = { post: "/v1/github-apps" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["github_app:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListGitHubApps 按作用域列指纹面（project_id 或 global 二选一必填）。
  rpc ListGitHubApps(ListGitHubAppsRequest) returns (ListGitHubAppsResponse) {
    option (google.api.http) = { get: "/v1/github-apps" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["github_app:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeleteGitHubApp 软删（tombstone；解析面即时失效）。
  rpc DeleteGitHubApp(DeleteGitHubAppRequest) returns (DeleteGitHubAppResponse) {
    option (google.api.http) = { delete: "/v1/github-apps/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["github_app:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListGitHubAppRepos 现铸 token 列 installation 可达仓库（安装健康验证
  // 面；授权随行作用域）。
  rpc ListGitHubAppRepos(ListGitHubAppReposRequest) returns (ListGitHubAppReposResponse) {
    option (google.api.http) = { get: "/v1/github-apps/{id}/repos" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["github_app:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // ---- Manifest 自动建流（ADR-0073 决策 8：跳转 GitHub 创建 App，私钥/
  // App ID 由 GitHub 回传，用户不手抄）——三步：start 签名跳转 URL → 用户
  // 在 GitHub 创建后回调带 code → consume 换凭据并暂存、给安装页 URL →
  // 用户安装后 setup 回调带 installation_id → complete 落行（复用受理即
  // 验证与密封）。手动表单保留为 fallback（GHES/CLI/受限环境）----

  // StartManifestFlow 生成 GitHub manifest 跳转 URL（state = HMAC 签名，
  // 绑作用域 + 15 分钟时效）。未配置公网 console 基址时精确失败（手动表
  // 单兜底）。
  rpc StartManifestFlow(StartManifestFlowRequest) returns (StartManifestFlowResponse) {
    option (google.api.http) = { post: "/v1/github-apps/manifest/start" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["github_app:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ConsumeManifestCode 用一次性 code 换 App 凭据（私钥即收即封、暂存于
  // 流存储，15 分钟时效），返回安装页 URL——installation 在下一步落定。
  rpc ConsumeManifestCode(ConsumeManifestCodeRequest) returns (ConsumeManifestCodeResponse) {
    option (google.api.http) = { post: "/v1/github-apps/manifest/consume" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["github_app:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // CompleteManifestFlow 以 setup 回调的 installation_id 落行（走既有受
  // 理即验证 + 密封 upsert；project_id 回传供冻结锚，须与 start 作用域一
  // 致，谎言即拒）。流一次性：complete 后 nonce 作废。
  rpc CompleteManifestFlow(CompleteManifestFlowRequest) returns (CompleteManifestFlowResponse) {
    option (google.api.http) = { post: "/v1/github-apps/manifest/complete" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["github_app:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

message GitHubApp {
  string id = 1;
  // project_id 空 = 平台级 Global。
  string project_id = 2;
  int64 app_id = 3;
  int64 installation_id = 4;
  // account_login 受理时经 GitHub API 解析（系统填充，请求不携带）。
  string account_login = 5;
  // api_base 空 = 缺省 github.com（GHES 携带完整基址）。
  string api_base = 6;
  // private_key_fingerprint 是私钥指纹（sha256 前 16 hex）——明文永不回显。
  string private_key_fingerprint = 7;
  string created_at = 8;
  string updated_at = 9;
}

message SetGitHubAppRequest {
  oneof scope {
    string project_id = 1;
    bool global = 2;
  }
  // app_id 必填：数字形态的 GitHub App ID（正整数；scope 互斥与 api_base/
  // 私钥 PEM 形态执法在服务内）。
  int64 app_id = 3 [
    (buf.validate.field).cel = {
      id: "num.positive"
      message: "must be the numeric GitHub App ID (positive)"
      expression: "this > 0"
    }
  ];
  // installation_id 必填：数字形态的 installation ID（正整数）。
  int64 installation_id = 4 [
    (buf.validate.field).cel = {
      id: "num.positive"
      message: "must be the numeric installation ID (positive)"
      expression: "this > 0"
    }
  ];
  // private_key_pem 是 App 私钥 PEM 原文（PKCS#1/PKCS#8）——只进受理与
  // 验证，落库前密封，响应不回显。
  string private_key_pem = 5;
  string api_base = 6;
}

message SetGitHubAppResponse {
  GitHubApp app = 1;
}

message ListGitHubAppsRequest {
  oneof scope {
    string project_id = 1;
    bool global = 2;
  }
}

message ListGitHubAppsResponse {
  repeated GitHubApp apps = 1;
}

message DeleteGitHubAppRequest {
  string id = 1;
}

message DeleteGitHubAppResponse {}

message ListGitHubAppReposRequest {
  string id = 1;
}

message ListGitHubAppReposResponse {
  repeated GitHubAppRepo repos = 1;
}

message GitHubAppRepo {
  // full_name 是 "owner/repo" 全名。
  string full_name = 1;
  bool private = 2;
}

message StartManifestFlowRequest {
  oneof scope {
    string project_id = 1;
    bool global = 2;
  }
}

message StartManifestFlowResponse {
  // 2026-10-16 审计整删（ADR-0073 决策 8 勘误：GET 跳转形态从未生效；
  // 号位防复用）：原 1 号位 deprecated redirect_url（服务端恒空）整体删除。
  reserved 1; // redirect_url deprecated 字段整删，号位防复用。
  reserved "redirect_url";
  // action_url 是 github.com 的 manifest 创建页地址；manifest 字段经 HTML
  // form POST 提交（method=post、字段名 manifest、值为 JSON 字符串）。
  string action_url = 3;
  // manifest 是创建参数 JSON 字符串（名字/权限/回跳地址——私钥由 GitHub
  // 生成并经回调回传平台）。调用方渲染隐藏表单自动提交。
  string manifest = 4;
  // state 是签名流态（consume/complete 原样回传；GitHub 在 redirect_url
  // 上原样回显——兼 CSRF）。调用方透明。
  string state = 2;
}

message ConsumeManifestCodeRequest {
  // code 是 GitHub 回调 redirect_url 携带的一次性兑换码（10 分钟有效）。
  string code = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // state 是 start 返回流跳转链里原样带回的签名态（与 start 作用域绑定）。
  string state = 2;
}

message ConsumeManifestCodeResponse {
  // install_url 是该 App 的安装页地址（勾选仓库后 GitHub 回跳 setup_url
  // 并携带 installation_id）。
  string install_url = 1;
  // app_name 是创建时的 App 名（GitHub 表单里用户可改）。
  string app_name = 2;
}

message CompleteManifestFlowRequest {
  string state = 1;
  // installation_id 来自 setup 回调查询参数（正整数；0 = 回调未携带）。
  int64 installation_id = 2 [
    (buf.validate.field).cel = {
      id: "num.positive"
      message: "must be positive (from the setup callback)"
      expression: "this > 0"
    }
  ];
  // project_id 回传 start 时的作用域（冻结锚与作用域一致性校验；global
  // 流留空）。
  string project_id = 3;
}

message CompleteManifestFlowResponse {
  GitHubApp app = 1;
}
