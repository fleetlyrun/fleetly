syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合——不用生成器默认的
// rpcStatus，信封单一事实源在 fleetly.shared.v1.ErrorResponse）。鉴权
// securityDefinitions 随拦截器链鉴权（D21）落地时补声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// SystemService 承载控制面进程级系统信息。T0.3 的契约验证面：同一 proto
// 同时生成 gRPC client（SDK 与 CLI）与 REST 端点（gateway），双面同源。
// T2.17 起扩容 GetSystemStatus（引擎/Traefik/状态层健康汇总——复用 lynx
// CheckHealth 面：逐 checker 如实上报，不聚合出单一布尔，判断权在消费方）。
// T2.18 起扩容集群级观察面：ListNodes（节点观测缓存只读列表——无 app 归
// 属的控制面/集群级诊断，与状态汇总同层）与 GetIngressStatus（入口链三面
// 状态：Traefik 服务实况 + 配置端点健康 + 证书台账对照——探测在服务端
// 执行，CLI 不再直连 docker/读本地 token 文件）。
service SystemService {
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = { get: "/v1/system/ping" };
  }
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse) {
    option (google.api.http) = { get: "/v1/system/status" };
  }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = { get: "/v1/system/nodes" };
  }
  rpc GetIngressStatus(GetIngressStatusRequest) returns (GetIngressStatusResponse) {
    option (google.api.http) = { get: "/v1/system/ingress" };
  }
  // ListBackups 状态备份台账（T2.22，只读）：热备快照的诚实账（kind/路径/
  // sha256/verify_status）。verify_status=failed 的行是红色告警面的一部分
  // ——台账如实保留失败行，消费方据此判断备份可用性。
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option (google.api.http) = { get: "/v1/system/backups" };
  }
  // TriggerBackup 手动触发一次状态备份（T2.22；deploy scope——写面语义，
  // 与升级编排 pre_upgrade 快照共用同一同步入口；响应即落账后的台账行，
  // verify_status=failed 时调用方必须视为备份失败而非请求失败歧义态）。
  rpc TriggerBackup(TriggerBackupRequest) returns (TriggerBackupResponse) {
    option (google.api.http) = {
      post: "/v1/system/backups"
      body: "*"
    };
  }
  // GetJoinGuide join 向导（E1-8，multi-node §2.3/D-MN-13；admin scope
  // ——响应含 join token 材料）。base_domain 为空 → E_MULTI_NODE_REQUIRES_
  // BASE_DOMAIN（409，D-MN-13：多节点未启用显式拒绝）。服务端生成 join
  // 命令、按 worker_ip 的精确防火墙放行规则（只生成不自动应用）、DNS
  // 步骤与完成判据；防火墙规则文本附「--harden-firewall 自动应用维持
  // reserved」口径（平台不静默改用户防火墙）。
  rpc GetJoinGuide(GetJoinGuideRequest) returns (GetJoinGuideResponse) {
    option (google.api.http) = { get: "/v1/system/nodes/join-guide" };
  }
  // RotateJoinToken 轮换 swarm join token（E1-8，D-MN-1：锚定完成后自动
  // rotate 把泄露窗口收敛到分钟级；批量场景 manual 后手动执行）。role
  // 缺省 worker；rotate 后旧 token 立即失效。经底座 swarm 面执行，轮换
  // 记审计（node.join_token_rotated，§5.3——审计不设事件）。
  rpc RotateJoinToken(RotateJoinTokenRequest) returns (RotateJoinTokenResponse) {
    option (google.api.http) = {
      post: "/v1/system/nodes/join-token:rotate"
      body: "*"
    };
  }
}

message PingRequest {}

message PingResponse {
  // 应答服务名（恒 "fleetlyd"）。
  string service = 1 [(buf.validate.field).string.min_len = 1];
  // 服务版本（构建 -ldflags 注入，未注入时为 "dev"）。
  string version = 2 [(buf.validate.field).string.min_len = 1];
}

message GetSystemStatusRequest {}

// ComponentHealth 是单组件健康如实上报（name = lynx 服务名，如
// state.store / state.observer / ingress.traefik）。ok=false 时 error 为
// 检查器返回原文。
message ComponentHealth {
  string name = 1;
  bool ok = 2;
  string error = 3;
}

message GetSystemStatusResponse {
  string service = 1;
  string version = 2;
  repeated ComponentHealth components = 3;
  // 状态备份健康视图（T2.22）：最近一次台账行的投影。从未备份 → 不输出
  //（backup 组件的 ComponentHealth 行会以 ok=false 显式表达不健康）。
  BackupHealth backup = 4;
}

// BackupHealth 是系统状态里备份面的明细视图（组件布尔健康的展开：最近
// 一次备份的时间与校验结论——「绿色成功但实际没备份」的对立面是让
// verify_status 与时间直接可见）。
message BackupHealth {
  // 最近一次备份的台账 ID（= 备份目录名）。
  string last_backup_id = 1;
  // 最近一次备份的触发类别（daily/pre_upgrade/post_deploy/manual）。
  string last_kind = 2;
  // 最近一次备份的台账落账时刻。
  google.protobuf.Timestamp last_backup_at = 3;
  // 回读校验结论（verified/failed）。
  string last_verify_status = 4;
  // 失败原因原文（verified 行为空）。
  string last_error = 5;
}

message ListNodesRequest {}

// NodeView 是节点观测缓存行的只读投影（state-model §2.2：缓存禁止用于
// 决策，展示/诊断专用；节点变更用 docker node 原生命令）。观测数据带
// observed_at/stale——状态诚实契约（architecture §4.2 横切硬指标）；
// nodes 不提供「最后心跳」字段。
message NodeView {
  string swarm_node_id = 1;
  // 平台节点 ID（fleetly.placement.node-id label；未锚定时为空）。
  string platform_id = 2;
  string hostname = 3;
  string state = 4;
  string availability = 5;
  bool is_manager = 6;
  google.protobuf.Timestamp observed_at = 7;
  bool stale = 8;
  map<string, string> labels = 9;
  // 绑定其上的应用 ID 清单（E1-8，multi-node §2.7/D-MN-9：读时 join
  // placements 权威表，无迁移——UI「已钉应用」交叉引用面）。
  repeated string pinned_app_ids = 10;
}

message ListNodesResponse {
  repeated NodeView nodes = 1;
}

message GetJoinGuideRequest {
  // worker 节点的公网 IP（防火墙规则按它生成精确放行文本；空 = 输出
  // 规则模板、IP 位以 <worker-ip> 占位）。
  string worker_ip = 1;
  // manager 可达地址覆盖（advertise 为私网而 worker 跨公网的场景；空 =
  // 取 swarm advertise addr）。
  string manager_addr = 2;
}

// FirewallRule 是一条防火墙放行规则文本（方向 + 端口/协议 + 用途 + 可
// 复制命令；只生成不自动应用——平台不静默改用户防火墙，multi-node §2.3）。
message FirewallRule {
  // 方向词表：worker_to_manager / bidirectional / public_to_all。
  string direction = 1;
  // 端口/协议（如 2377/tcp、7946/tcp+udp、4789/udp、8423/tcp、80,443/tcp）。
  string port = 2;
  // 用途（集群管理 / gossip / overlay VXLAN / Traefik 配置端点 TLS / 应用入口）。
  string purpose = 3;
  // 规则文本（manager 侧或 worker 侧可复制的 iptables 命令/说明）。
  string rule = 4;
  // 规则应用在哪一侧（manager / worker / both）。
  string side = 5;
}

// JoinGuideView 是 join 向导输出（服务端生成，multi-node §2.3）。
message JoinGuideView {
  // 完整 join 命令（docker swarm join --token SWMTKN-… <manager-addr>:2377）。
  string join_command = 1;
  // manager 可达地址（swarm advertise addr 或请求覆盖值）。
  string manager_addr = 2;
  // worker join token（admin scope 的 token 材料；向导后按 join.token_
  // rotate=auto 自动轮换的口径见 D-MN-1）。
  string worker_token = 3;
  // 平台域名（DNS 步骤的主体）。
  string base_domain = 4;
  // manager 侧放行规则（按 worker_ip 生成）。
  repeated FirewallRule manager_firewall_rules = 5;
  // worker 侧放行规则。
  repeated FirewallRule worker_firewall_rules = 6;
  // worker 前置门禁命令（docker version ≥29.8.1 + iptables legacy 判定
  // ——与 install.sh 同判据的命令形态；复制到 worker 执行）。
  repeated string worker_preflight_commands = 7;
  // DNS 步骤（既有应用/平台子域 A 记录追加 worker IP；ctrl.<base> 保持
  // 仅 manager；fleetly domains verify 复核）。
  repeated string dns_steps = 8;
  // 完成判据（向导自动推进面：节点观测拍出现 → 锚定 node.joined →
  // ready + Traefik 任务 running）。
  repeated string completion_checks = 9;
}

message GetJoinGuideResponse {
  JoinGuideView guide = 1;
}

message RotateJoinTokenRequest {
  // 轮换目标 token 的角色：worker（缺省）| manager。
  string role = 1 [(buf.validate.field).string = {
    in: [
      "",
      "worker",
      "manager"
    ]
  }];
}

message RotateJoinTokenResponse {
  // 轮换后的角色与新 token（旧 token 立即失效；admin scope 材料）。
  string role = 1;
  string token = 2;
}

message GetIngressStatusRequest {}

// TraefikView 是入口服务实况投影（Swarm service inspect；不可达时 exists
// = false 且 error 为探测原文）。
message TraefikView {
  bool exists = 1;
  string image = 2;
  int32 static_args = 3;
  string error = 4;
}

// CertLedgerView 是证书台账行投影（domains 表 cert 列对照；app 为显示名，
// 已删除应用回退显示 app id）。
message CertLedgerView {
  string app = 1;
  string domain = 2;
  string cert_sha256 = 3;
  google.protobuf.Timestamp cert_not_after = 4;
}

message GetIngressStatusResponse {
  TraefikView traefik = 1;
  // 控制面配置端点监听地址（ingress.config_addr 配置原值）。
  string config_addr = 2;
  // 下发给 Traefik 的控制面可达 IP（空 = 自动探测）。
  string advertise_ip = 3;
  // ACME challenge 应答器基址（空 = 未接入集中签发）。
  string responder = 4;
  // 配置端点两面探测结果（服务端环回执行）：/healthz 无鉴权状态行；
  // /configs 带 token 鉴权核验（401 = token 缺失/错误，如实报告；200 =
  // 鉴权通过且返回合法 JSON）。不可达 = "unreachable"。
  string healthz = 5;
  string auth = 6;
  // 证书台账（有证书的域名行）。
  repeated CertLedgerView certificates = 7;
  // 证书存储目录（控制面侧）与其中的 app 清单（meta 索引；目录缺失 =
  // 空清单非错误，cert_dir_error 承载读取故障原文）。
  string cert_dir = 8;
  repeated string cert_dir_apps = 9;
  string cert_dir_error = 10;
}

message ListBackupsRequest {}

// BackupView 是状态备份台账行的只读投影（state_backups 表）。path 指向
// 备份目录内的快照文件；manifest.json 与其同目录（含 sha256/密钥指纹/
// schema 版本——恢复核对材料，密钥本体绝不入备份目录）。
message BackupView {
  string id = 1;
  // 触发类别：daily / pre_upgrade / post_deploy / manual（历史行可为
  // hot/cold）。
  string kind = 2;
  // 快照文件路径。
  string path = 3;
  // 快照文件 sha256（hex；回读校验对象）。
  string sha256 = 4;
  int64 size_bytes = 5;
  // 回读校验结论：verified / failed（失败行保留——红色告警面的一部分）。
  string verify_status = 6;
  // 校验失败原因原文（verified 行为空）。
  string error = 7;
  // 台账落账时刻。
  google.protobuf.Timestamp created_at = 8;
}

message ListBackupsResponse {
  repeated BackupView backups = 1;
}

message TriggerBackupRequest {
  // 触发类别（缺省 manual；升级编排传 pre_upgrade）。manual/daily/
  // pre_upgrade/post_deploy 之外取值被请求校验拒绝。
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "",
      "manual",
      "daily",
      "pre_upgrade",
      "post_deploy"
    ]
  }];
}

message TriggerBackupResponse {
  BackupView backup = 1;
}
