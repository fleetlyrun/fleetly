syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// GitKeysService 是平台管理的 git 公钥管理面（T2.19 git push(SSH) 触发入口
// 的认证面）。v0.1 单操作员口径：全局级 key（admin scope 管理，可推所有
// app 仓库）；per-app key 随 v0.2。裁决注记：独立服务（与 TokensService
// 同级的管理面）而非挂在 tokens.proto——token 与 git key 是两类凭据、
// 两张表、两条审计词根，独立文件使 scope 登记与契约演进互不牵连。
//
// SSH 侧只做公钥指纹（SHA256, ssh-keygen -lf 同格式）匹配：公钥本体入库
// 供 list 展示与指纹复算；私钥永不经过平台。
service GitKeysService {
  rpc AddGitKey(AddGitKeyRequest) returns (AddGitKeyResponse) {
    option (google.api.http) = {
      post: "/v1/git/keys"
      body: "*"
    };
  }
  rpc ListGitKeys(ListGitKeysRequest) returns (ListGitKeysResponse) {
    option (google.api.http) = { get: "/v1/git/keys" };
  }
  rpc RemoveGitKey(RemoveGitKeyRequest) returns (RemoveGitKeyResponse) {
    option (google.api.http) = { delete: "/v1/git/keys/{id}" };
  }
}

message AddGitKeyRequest {
  // OpenSSH authorized_keys 单行形态（ssh-ed25519/ssh-rsa/ecdsa-sha2-*）。
  string public_key = 1 [(buf.validate.field).string = { min_len: 1, max_len: 8192 }];
  // 人读备注（如 "operator laptop"）。
  string note = 2 [(buf.validate.field).string.max_len = 200];
}

message AddGitKeyResponse {
  string id = 1;
  // SHA256 指纹（"SHA256:<base64>"，ssh-keygen -lf 同格式）。
  string fingerprint = 2;
  string key_type = 3;
  string note = 4;
  google.protobuf.Timestamp created_at = 5;
}

// GitKeyView 是 git 公钥行的无敏感投影（公钥本体为公开材料可回读；平台
// 从不接触私钥）。
message GitKeyView {
  string id = 1;
  string fingerprint = 2;
  string key_type = 3;
  string note = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListGitKeysRequest {}

message ListGitKeysResponse {
  repeated GitKeyView keys = 1;
}

message RemoveGitKeyRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RemoveGitKeyResponse {
  string id = 1;
}
