syntax = "proto3";

// Spec 是规范化的期望状态中间表示（CONTEXT.md Spec 词条）：运行时中立，
// 不含编排器概念（无载体命名/标记/约束语法/探针方言——映射成编排器原语
// 是 Provider 的事）。三种：AppSpec / TaskSpec / DatabaseSpec，均带
// schemaVersion（读入按 check-strategy：可读旧版+提示，拒绝跳代）。
package fleetly.spec.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/spec/v1;specv1";

import "google/protobuf/duration.proto";

// AppSpec 是长运行可部署单元的期望状态（App = 一个或多个 Process）。
message AppSpec {
  int32 schema_version = 1;
  AppRef app = 2;
  Source source = 3;
  repeated ProcessSpec processes = 4;
  BuildSpec build = 5;
  // first_boot_jobs 是部署期 init job（数据库迁移等）：releasing 前串行
  // 执行，失败即回滚。
  repeated JobSpec first_boot_jobs = 6;
}

// AppRef 是 App 归属锚。
message AppRef {
  string id = 1;
  string project = 2;
}

// Source 是 App 的来源三形态（Git 引用 / 镜像引用 / 上传产物）。
message Source {
  oneof kind {
    GitSource git = 1;
    ImageSource image = 2;
    UploadSource upload = 3;
  }
}

message GitSource {
  // repo 是仓库 URL（部署 Token 形态，Token 不进 URL 路径段日志）。
  string repo = 1;
  // ref 是分支/标签/commit。
  string ref = 2;
}

message ImageSource {
  // ref 是镜像引用（私有仓库凭证经 Secret 解析分发）。
  string ref = 1;
}

message UploadSource {
  string id = 1;
}

// ProcessSpec 是 App 内的进程模板（web/worker…）。
message ProcessSpec {
  string name = 1;
  oneof image_origin {
    // image 是镜像直部署引用。
    string image = 2;
    // from_build 引用同 Spec Build 输出（Ensure 前由平台解析为 digest）。
    string from_build = 3;
  }
  // command 覆盖镜像入口；空 = 镜像默认。
  repeated string command = 4;
  // env 是非敏感环境变量（Project/App 两级合成的归一化结果）。
  map<string, string> env = 5;
  // secret_refs 按名引用 Project Secret（注入时解析，值不进 Spec）。
  repeated string secret_refs = 6;
  // config_refs 按名引用 Project Config 版本化挂载文件。
  repeated string config_refs = 7;
  repeated PortSpec ports = 8;
  HealthcheckSpec healthcheck = 9;
  ResourcesSpec resources = 10;
  int64 replicas = 11;
  PlacementSpec placement = 12;
  repeated VolumeAttachment volumes = 13;
  // networks 是网络附件（Project 网络名或 taskGroup:<name> 跨挂）。
  repeated string networks = 14;
  // strategy 是部署切换策略（ADR-0048 决策 1：rolling 缺省 | blue-green
  // 可选——Process 级，"web 蓝绿 + worker 滚动"的混合是真实需求）。
  // UNSPECIFIED（零值）归一为 rolling：存量 Revision 无该字段重放即
  // rolling，无迁移面。值域住叶子校验（spec.ValidateProcess，词条单源
  // = CONTEXT.md Deployment Strategy）。Database/受管域不适用（结构性
  // 保证，同 ADR）。
  DeployStrategy strategy = 15;}

// DeployStrategy 是部署切换策略（CONTEXT.md Deployment Strategy 词条：
// rolling | blue-green；Avoid 表两词条不引入——渐进分流与代次槽位机制
// 均显式不做，ADR-0048）。blue-green = engine 的编排变体（Runtime 契约
// 不变，ADR-0048）：双代窗期间两代载体并存，新代 L1 全就绪才切换流量。
// UNSPECIFIED（零值）语义归一为 rolling——存量 Revision 无该字段重放即
// rolling，无迁移面。
enum DeployStrategy {
  // 缺省 = rolling（归一面：投影/引擎按 rolling 语义消费）。
  DEPLOY_STRATEGY_UNSPECIFIED = 0;
  // 滚动替换（与既有语义逐字节相同——存量零变化）。
  DEPLOY_STRATEGY_ROLLING = 1;
  // 蓝绿：旧代∪新代双代窗 → 新代 L1 门 → 切换 → 观察窗 → 收口。
  DEPLOY_STRATEGY_BLUE_GREEN = 2;
}

// PortSpec 是进程监听端口声明（Route 投影来源）。
message PortSpec {
  int32 port = 1;
  Protocol protocol = 2;
}

// Protocol 是 Route/端口协议（http/h2c/tcp）。
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_HTTP = 1;
  PROTOCOL_H2C = 2;
  PROTOCOL_TCP = 3;
}

// HealthcheckSpec 是声明式探针（三选一 + 节律）。
message HealthcheckSpec {
  oneof probe {
    string http_path = 1;
    int32 tcp_port = 2;
    ExecProbe exec = 3;
  }
  google.protobuf.Duration interval = 4;
  google.protobuf.Duration timeout = 5;
  google.protobuf.Duration start_period = 6;
  int32 retries = 7;
}

message ExecProbe {
  repeated string command = 1;
}

// ResourcesSpec 是每副本资源上限（v1 仅每 Process 上限）。
message ResourcesSpec {
  // cpu_millis 毫核（1000 = 1 CPU）。
  int64 cpu_millis = 1;
  int64 memory_mb = 2;
}

// PlacementSpec 是调度意图（节点选择约束；平台节点 ID 为锚——映射为
// 编排器约束语法是 Provider 私有）。
message PlacementSpec {
  repeated string node_ids = 1;
}

// VolumeAttachment 是持久存储附件（无显式 Placement 时默认钉住节点）。
message VolumeAttachment {
  string volume_id = 1;
  string target = 2;
  // read_only 是只读挂载（compose 短语法 name:/target:ro；缺省可写）。
  bool read_only = 3;
}

// BuildSpec 是构建声明（dockerfile / railpack 钉版 / static，ADR-0032）。
message BuildSpec {
  // builder 是 Builder Provider 名（dockerfile / railpack / static），与
  // strategy oneof 形态配对（叶子 ValidateBuild 执法）。
  string builder = 1;
  oneof strategy {
    string dockerfile = 2;
    RailpackBuilder railpack = 3;
    StaticBuilder static = 5;
  }
  repeated string cache_from = 4;
}

// RailpackBuilder 必须钉版本（防 plan 漂移，旧 spike 教训；ADR-0032：
// bare semver，须等于平台钉版常量——Build 期执法，错误文本带平台版本）。
message RailpackBuilder {
  string pinned_version = 1;
}

// StaticBuilder 是产物目录包装声明（ADR-0032）：上传上下文的产物子目录
// 整体 COPY 进钉版 Caddy 伺服镜像；无构建步（源码构建是 railpack 的地盘）。
message StaticBuilder {
  // output_dir 是产物目录（context 内相对路径，缺省 "."；拒 .. 与绝对路径）。
  string output_dir = 1;
}

// JobSpec 是部署期一次性作业（first boot jobs，ADR-0007 词汇裁决：词条归
// Task——部署期特例）。C-13 重塑：进程模板共享 ProcessSpec（process 字段，
// 与 TaskSpec 同款嵌套形态）；旧标量字段（image_origin/command/env/
// secret_refs）保留号退役（deprecated，读取面一律走 process——buf breaking
// FILE 档下零消费者字段删除亦红，彻底删除待 breaking 基线策略变更）。
message JobSpec {
  string name = 1;
  oneof image_origin {
    string image = 2 [deprecated = true];
    string from_build = 3 [deprecated = true];
  }
  repeated string command = 4 [deprecated = true];
  map<string, string> env = 5 [deprecated = true];
  repeated string secret_refs = 6 [deprecated = true];
  // ttl 是作业硬超时（超时即失败回滚）。
  google.protobuf.Duration ttl = 7;
  // process 是单进程模板（重塑后的唯一读取面）。
  ProcessSpec process = 8;
}

// TaskSpec 是程序化工作负载的期望状态（ADR-0012：one-shot 与 resident
// 双形态）。
message TaskSpec {
  int32 schema_version = 1;
  TaskRef task = 2;
  // process 是单进程模板（Task 无多进程形态）。
  ProcessSpec process = 3;
  // ttl_seconds 是 Run 生命周期上限（绝对 deadline 落库，ADR-0018；
  // 上限 86400）。
  int64 ttl_seconds = 4;
  // owner_token 是属主 Token（Owner Lease 心跳保温；吊销触发宽限排空）。
  string owner_token = 5;
  // network_group 是 Task Network Group 名（Run 创建时刻挂靠）。
  string network_group = 6;
  // desired_concurrency 是 resident 形态的期望并发 Run 数（one-shot
  // 恒 1）。
  int64 desired_concurrency = 7;
  // form 是双形态声明（"one-shot" | "resident"；空 = 按
  // desired_concurrency 推导：>1 即 resident，否则 one-shot）。
  string form = 8;
}

// TaskRef 是 Task 归属锚。
message TaskRef {
  string id = 1;
  string project = 2;
}

// DatabaseSpec 是托管数据服务的期望状态（模板渲染产物，走同一条 Runtime
// 通道）。
message DatabaseSpec {
  int32 schema_version = 1;
  DatabaseRef database = 2;
  // engine 是模板引擎名（postgres / pgvector / redis / mysql /
  // mongodb…；值域真源 = engine 模板注册表，ADR-0029）。
  string engine = 3;
  string version = 4;
  // credentials_ref 引用 Project Secret（值 = 完整连接 URL，ADR-0029）。
  string credentials_ref = 5;
  ResourcesSpec resources = 6;
  BackupPolicySpec backup_policy = 7;
}

// DatabaseRef 是 Database 归属锚。
message DatabaseRef {
  string id = 1;
  string project = 2;
}

// BackupPolicySpec 是默认备份策略（备份默认开，ADR-0020）。
message BackupPolicySpec {
  // interval 是备份周期（零值 = 引擎默认）。
  google.protobuf.Duration interval = 1;
  // retention 是保留窗口。
  google.protobuf.Duration retention = 2;
}
