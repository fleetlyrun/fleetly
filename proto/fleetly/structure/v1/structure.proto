message Project {
  string id = 1;
  string name = 2;
  string team_id = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message CreateProjectRequest { string name = 1; string team_id = 2; }
message CreateProjectResponse { Project project = 1; }
message GetProjectRequest { string id = 1; }
message GetProjectResponse { Project project = 1; }
message ListProjectsRequest {}
message ListProjectsResponse { repeated Project projects = 1; }
message DeleteProjectRequest { string id = 1; }
message DeleteProjectResponse {}

message App {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string created_at = 4;
}

message CreateAppRequest { string project_id = 1; string name = 2; }
message CreateAppResponse { App app = 1; }
message GetAppRequest { string id = 1; }
message GetAppResponse { App app = 1; }
message ListAppsRequest { string project_id = 1; }
message ListAppsResponse { repeated App apps = 1; }
message DeleteAppRequest { string id = 1; }
message DeleteAppResponse {}

message Secret {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // fingerprint 是值指纹（值永不回显，ADR-0014）。
  string fingerprint = 4;
  string updated_at = 5;
}

message PutSecretRequest {
  string project_id = 1;
  string name = 2;
  // value 只进不回（请求侧明文；响应只回指纹）。
  string value = 3;
}
message PutSecretResponse { Secret secret = 1; }
message ListSecretsRequest { string project_id = 1; }
message ListSecretsResponse { repeated Secret secrets = 1; }
message DeleteSecretRequest { string project_id = 1; string name = 2; }
message DeleteSecretResponse {}

message Config {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int64 version = 4;
  string created_at = 5;
  // content 仅 GetConfig 回读（List 不带——体积面）。
  string content = 6;
}

message PutConfigRequest { string project_id = 1; string name = 2; string content = 3; }
message PutConfigResponse { Config config = 1; }
message GetConfigRequest { string project_id = 1; string name = 2; int64 version = 3; }
message GetConfigResponse { Config config = 1; }
message ListConfigsRequest { string project_id = 1; }
message ListConfigsResponse { repeated Config configs = 1; }

message Volume {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string pinned_node_id = 4;
  string created_at = 5;
}

message CreateVolumeRequest { string project_id = 1; string name = 2; string pinned_node_id = 3; }
message CreateVolumeResponse { Volume volume = 1; }
message ListVolumesRequest { string project_id = 1; }
message ListVolumesResponse { repeated Volume volumes = 1; }

message Network {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // egress_none 是弱隔离声明（swarm v1：出网不阻断，明示）。
  bool egress_none = 4;
  string created_at = 5;
}

message CreateNetworkRequest { string project_id = 1; string name = 2; bool egress_none = 3; }
message CreateNetworkResponse { Network network = 1; }
message ListNetworksRequest { string project_id = 1; }
message ListNetworksResponse { repeated Network networks = 1; }
