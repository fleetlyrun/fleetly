syntax = "proto3";

// Structure 上下文（领域模型 §2）：组织结构——项目/应用骨架与材料
//（Project/App/Secret/Config/Volume/Network）。读写分离的 CRUD 面；
// Route 属 Edge 上下文、Deployment 属 Delivery 上下文（各自 proto 包）。
package fleetly.structure.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/structure/v1;structurev1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// ProjectsService：Project 聚合 CRUD（scope 注解 + authn 拦截器执法；
// 服务缺省档 SERVER——新增方法缺注解即启动红，不静默放行）。
service ProjectsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = { post: "/v1/projects" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = { get: "/v1/projects/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_READ }
    };
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = { get: "/v1/projects" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (google.api.http) = { delete: "/v1/projects/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_ADMIN }
    };
  }
}

service AppsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {
    option (google.api.http) = { post: "/v1/apps" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetApp(GetAppRequest) returns (GetAppResponse) {
    option (google.api.http) = { get: "/v1/apps/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_READ }
    };
  }
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse) {
    option (google.api.http) = { get: "/v1/apps" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse) {
    option (google.api.http) = { delete: "/v1/apps/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_ADMIN }
    };
  }
}

// SecretsService：值永不回显——响应只携带指纹（ADR-0014）。
service SecretsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse) {
    option (google.api.http) = { put: "/v1/secrets" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "secrets" op: SCOPE_OP_WRITE }
    };
  }
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = { get: "/v1/secrets" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "secrets" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = { delete: "/v1/secrets/{project_id}/{name}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "secrets" op: SCOPE_OP_ADMIN }
    };
  }
}

// ConfigsService：版本化挂载文件（可回读）。
service ConfigsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc PutConfig(PutConfigRequest) returns (PutConfigResponse) {
    option (google.api.http) = { put: "/v1/configs" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "configs" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = { get: "/v1/configs/{project_id}/{name}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "configs" op: SCOPE_OP_READ }
    };
  }
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse) {
    option (google.api.http) = { get: "/v1/configs" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "configs" op: SCOPE_OP_READ }
    };
  }
}

// SharedVariablesService：Project 级共享变量（ADR-0043）。值可回显（非
// 敏感契约——敏感值走 Secrets）；归一化期合成进 AppSpec（Project 层在
// 下、App 层 env 覆盖，ADR-0027），改共享变量需重部署才生效——响应携带
// 受影响 App 提示（近似口径）。
service SharedVariablesService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc PutSharedVariable(PutSharedVariableRequest) returns (PutSharedVariableResponse) {
    option (google.api.http) = { put: "/v1/shared-variables" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "shared_variables" op: SCOPE_OP_WRITE }
    };
  }
  rpc ListSharedVariables(ListSharedVariablesRequest) returns (ListSharedVariablesResponse) {
    option (google.api.http) = { get: "/v1/shared-variables" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "shared_variables" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteSharedVariable(DeleteSharedVariableRequest) returns (DeleteSharedVariableResponse) {
    option (google.api.http) = { delete: "/v1/shared-variables/{project_id}/{name}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "shared_variables" op: SCOPE_OP_ADMIN }
    };
  }
}

service VolumesService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse) {
    option (google.api.http) = { post: "/v1/volumes" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "volumes" op: SCOPE_OP_WRITE }
    };
  }
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option (google.api.http) = { get: "/v1/volumes" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "volumes" op: SCOPE_OP_READ }
    };
  }
}

// DatabasesService：托管数据服务聚合面（ADR-0029）。凭证值永不回显——
// 响应只携带 Secret 名与去密码连接面（host/port）；App 经 secret_refs
// 引用 credentials_ref 取完整连接 URL。
service DatabasesService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse) {
    option (google.api.http) = { post: "/v1/databases" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "databases" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetDatabase(GetDatabaseRequest) returns (GetDatabaseResponse) {
    option (google.api.http) = { get: "/v1/databases/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "databases" op: SCOPE_OP_READ }
    };
  }
  // ListDatabases 新→旧分页（after_database_id 游标 = ULID 创建序，
  // ADR-0026 惯例）。
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse) {
    option (google.api.http) = { get: "/v1/databases" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "databases" op: SCOPE_OP_READ }
    };
  }
  // DeleteDatabase 收口删除（ADR-0029 决策 8）：拆载体 → tombstone 一
  // 事务（事件 + 审计）；数据卷与凭证 Secret 不随删（Project 级材料，
  // 备份保留义）。
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse) {
    option (google.api.http) = { delete: "/v1/databases/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "databases" op: SCOPE_OP_ADMIN }
    };
  }
  // TriggerBackup 手动触发（ADR-0039）：立即铸一行 pending 台账并 Kick
  // 备份环；完成事实由 database.backup_succeeded/backup_failed 事件与
  // ListBackups 观测（触发不等执行）。
  rpc TriggerBackup(TriggerBackupRequest) returns (TriggerBackupResponse) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/backups" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "databases" op: SCOPE_OP_WRITE }
    };
  }
  // ListBackups 新→旧分页（ADR-0026 after_* + limit）。
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option (google.api.http) = { get: "/v1/databases/{database_id}/backups" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "databases" op: SCOPE_OP_READ }
    };
  }
  // VerifyBackup 重算对象摘要比对回执（ADR-0039 决策 8）。
  rpc VerifyBackup(VerifyBackupRequest) returns (VerifyBackupResponse) {
    option (google.api.http) = { post: "/v1/backups/{backup_id}/verify" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "databases" op: SCOPE_OP_READ }
    };
  }
}

// NetworksService：Network 聚合面 + 跨 Project peer 声明面（ADR-0013
// 附录 A：成员③显式跨 Project 引用——双向声明、接收方批准、撤销即时
// 隔离）。peer 动词 scope 复用 networks 资源（授权面等价于"管理网络"）。
service NetworksService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse) {
    option (google.api.http) = { post: "/v1/networks" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_WRITE }
    };
  }
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse) {
    option (google.api.http) = { get: "/v1/networks" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_READ }
    };
  }
  // RebuildNetwork 是网络重建维护动词（ADR-0046）：平台中介地删除并按
  // ensureNetworks 同源形态复建载体网络（Attachable=true，标签同源）——
  // 平台归属载体逐个 detach/re-attach，编排全程与部署 Ensure/受管
  // reconciler 串行化。存在平台无法归属的附着即 E_CONFLICT 拒绝并列出。
  // 在幂等执法面（Idempotency-Key 头，ADR-0024）；变更冻结期拒绝。
  rpc RebuildNetwork(RebuildNetworkRequest) returns (RebuildNetworkResponse) {
    option (google.api.http) = { post: "/v1/networks/rebuild" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_WRITE }
    };
  }
  // DeclareNetworkPeer 是挂靠方声明（落 pending 行）：peer 项目请求挂靠
  // 目标网络。在幂等执法面（Idempotency-Key 头，ADR-0024）。
  rpc DeclareNetworkPeer(DeclareNetworkPeerRequest) returns (DeclareNetworkPeerResponse) {
    option (google.api.http) = { post: "/v1/networks/peers" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_WRITE }
    };
  }
  // ApproveNetworkPeer 是接收方批准（pending → approved）：网络归属方
  // 同意挂靠。批准前引用不可投影（strict 投影 fail-closed）。
  rpc ApproveNetworkPeer(ApproveNetworkPeerRequest) returns (ApproveNetworkPeerResponse) {
    option (google.api.http) = { post: "/v1/networks/peers/{id}/approve" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_WRITE }
    };
  }
  // RevokeNetworkPeer 撤销（任一侧；幂等）：即时隔离——引擎对受影响
  // App 以 isolate 模式重收敛剥离附件（断存量，ADR-0013 附录 A.4）。
  rpc RevokeNetworkPeer(RevokeNetworkPeerRequest) returns (RevokeNetworkPeerResponse) {
    option (google.api.http) = { post: "/v1/networks/peers/{id}/revoke" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetNetworkPeer(GetNetworkPeerRequest) returns (GetNetworkPeerResponse) {
    option (google.api.http) = { get: "/v1/networks/peers/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_READ }
    };
  }
  // ListNetworkPeers 新→旧分页（游标 = ULID 创建序；network_id /
  // peer_project_id 过滤可选——接收方与挂靠方两侧视图同面）。
  rpc ListNetworkPeers(ListNetworkPeersRequest) returns (ListNetworkPeersResponse) {
    option (google.api.http) = { get: "/v1/networks/peers" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "networks" op: SCOPE_OP_READ }
    };
  }
}

message Project {
  string id = 1;
  string name = 2;
  string team_id = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message CreateProjectRequest { string name = 1; string team_id = 2; }
message CreateProjectResponse { Project project = 1; }
message GetProjectRequest { string id = 1; }
message GetProjectResponse { Project project = 1; }
message ListProjectsRequest {
  // after_project_id 游标（上一页末条 id；空 = 首页）。游标轴 = ULID
  // 创建序升序（既有响应序不变；ADR-0026 after_* + limit 惯例）。
  string after_project_id = 1;
  int32 limit = 2;
}
message ListProjectsResponse { repeated Project projects = 1; }
message DeleteProjectRequest { string id = 1; }
message DeleteProjectResponse {}

message App {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string created_at = 4;
}

message CreateAppRequest { string project_id = 1; string name = 2; }
message CreateAppResponse { App app = 1; }
message GetAppRequest { string id = 1; }
message GetAppResponse { App app = 1; }
message ListAppsRequest {
  string project_id = 1;
  // after_app_id 游标（上一页末条 id；空 = 首页）。游标轴 = ULID 创建序
  // 升序（既有响应序不变；ADR-0026 after_* + limit 惯例）。
  string after_app_id = 2;
  int32 limit = 3;
}
message ListAppsResponse { repeated App apps = 1; }
message DeleteAppRequest { string id = 1; }
message DeleteAppResponse {}

message Secret {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // fingerprint 是值指纹（值永不回显，ADR-0014）。
  string fingerprint = 4;
  string updated_at = 5;
}

message PutSecretRequest {
  string project_id = 1;
  string name = 2;
  // value 只进不回（请求侧明文；响应只回指纹）。
  string value = 3;
}
message PutSecretResponse { Secret secret = 1; }
message ListSecretsRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（既有排序轴不变；分页只动行集，每行仍是最新指纹面）。
  string after_name = 2;
  int32 limit = 3;
}
message ListSecretsResponse { repeated Secret secrets = 1; }
message DeleteSecretRequest { string project_id = 1; string name = 2; }
message DeleteSecretResponse {}

message Config {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int64 version = 4;
  string created_at = 5;
  // content 仅 GetConfig 回读（List 不带——体积面）。
  string content = 6;
}

message PutConfigRequest { string project_id = 1; string name = 2; string content = 3; }
message PutConfigResponse { Config config = 1; }
message GetConfigRequest { string project_id = 1; string name = 2; int64 version = 3; }
message GetConfigResponse { Config config = 1; }
message ListConfigsRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（既有排序轴不变；分页只动行集，每行仍是该 name 最新版）。
  string after_name = 2;
  int32 limit = 3;
}
message ListConfigsResponse { repeated Config configs = 1; }

// SharedVariable 是 Project 级共享变量（ADR-0043）：值明文回显——非敏感
// 契约与 env 同源（敏感值走 Secrets）；归一化期作为 Project 层合成进
// AppSpec（App 层 env 覆盖）。
message SharedVariable {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string value = 4;
  string updated_at = 5;
}

message PutSharedVariableRequest {
  string project_id = 1;
  // name 是 env 键形态（[A-Za-z_][A-Za-z0-9_]*，≤64 字符）。
  string name = 2;
  string value = 3;
}
// affected_apps 是受影响 App 提示（近似口径，ADR-0043 决策 4）：项目内
// 已有 Revision 且最新冻结 env 会因本次变更而不同的 App——重部署取新值；
// 不触发任何自动重部署。
message PutSharedVariableResponse {
  SharedVariable variable = 1;
  repeated string affected_apps = 2;
}
message ListSharedVariablesRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（ADR-0026 after_* + limit 惯例）。
  string after_name = 2;
  int32 limit = 3;
}
message ListSharedVariablesResponse { repeated SharedVariable variables = 1; }
message DeleteSharedVariableRequest { string project_id = 1; string name = 2; }
message DeleteSharedVariableResponse { repeated string affected_apps = 1; }

message Volume {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string pinned_node_id = 4;
  string created_at = 5;
}

message CreateVolumeRequest { string project_id = 1; string name = 2; string pinned_node_id = 3; }
message CreateVolumeResponse { Volume volume = 1; }
message ListVolumesRequest { string project_id = 1; }
message ListVolumesResponse { repeated Volume volumes = 1; }

// Database 是托管有状态服务行（ADR-0029：模板参数创建即不可变，无
// Revision/Deployment 面）。
message Database {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string engine = 4;
  // version 是模板钉版短名（版本矩阵随 F2，本批每引擎单一钉版）。
  string version = 5;
  // credentials_ref 是凭证 Secret 名（值 = 完整连接 URL，永不回显；App
  // 经 process secret_refs 文件注入直用）。
  string credentials_ref = 6;
  // host 是网内 DNS 名（db-<id>，仅项目网内可解析——诚实连接面）。
  string host = 7;
  // port 是模板服务端口。
  int32 port = 8;
  // status: pending | running | degraded | stopped（收敛环推进）。
  string status = 9;
  string created_at = 10;
  string updated_at = 11;
  // last_backup_at 是最近一次成功 Backup 的完成时刻（'' = 从未成功；
  // 定时调度锚，ADR-0039）。
  string last_backup_at = 12;
  // restore_from_backup 在场 = 恢复挂起（备份环执行中；ADR-0039）。
  string restore_from_backup = 13;
  // restore_error 是最近一次恢复失败的事实（半恢复态重试不可幂等——
  // 诚实留给用户重建）。
  string restore_error = 14;
}

message CreateDatabaseRequest {
  string project_id = 1;
  string name = 2;
  // engine 值域 = 模板注册表（postgres / pgvector / redis，ADR-0029）。
  string engine = 3;
  // restore_from_backup 是可选恢复源（ADR-0039）：成功备份行 id；在场 =
  // 新库挂起恢复（备份环执行：流式注入或卷预置）。engine 仍必填且须与
  // 源备份引擎一致（跨引擎恢复拒绝）。
  string restore_from_backup = 4;
}
message CreateDatabaseResponse { Database database = 1; }
message GetDatabaseRequest { string id = 1; }
message GetDatabaseResponse { Database database = 1; }
message ListDatabasesRequest {
  string project_id = 1;
  // after_database_id 游标（上一页末条 id；空 = 首页）。
  string after_database_id = 2;
  int32 limit = 3;
}
message ListDatabasesResponse { repeated Database databases = 1; }
message DeleteDatabaseRequest { string id = 1; }
message DeleteDatabaseResponse {}

// Backup 是一次备份的台账行（ADR-0039）：成功行携带 ObjectStore 回执
// （object_key/digest/size = verify 锚）；credential 值永不出现。
message Backup {
  string id = 1;
  string project_id = 2;
  string database_id = 3;
  string engine = 4;
  string object_key = 5;
  string digest = 6;
  int64 size_bytes = 7;
  // status: pending | running | succeeded | failed。
  string status = 8;
  string error = 9;
  string started_at = 10;
  string finished_at = 11;
  string created_at = 12;
}
message TriggerBackupRequest { string database_id = 1; }
message TriggerBackupResponse { Backup backup = 1; }
message ListBackupsRequest {
  string database_id = 1;
  // after_backup_id 游标（上一页末条 id；空 = 首页）。
  string after_backup_id = 2;
  int32 limit = 3;
}
message ListBackupsResponse { repeated Backup backups = 1; }
// VerifyBackup 重算对象 sha256 比对 Put 回执（ADR-0039 决策 8：静态完整
// 性——腐损/截断可检出；可恢复性由恢复演练承担）。
message VerifyBackupRequest { string backup_id = 1; }
message VerifyBackupResponse {
  bool ok = 1;
  string digest = 2;
  string error = 3;
}

message Network {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // egress_none 是弱隔离声明（swarm v1：出网不阻断，明示）。
  bool egress_none = 4;
  string created_at = 5;
}

message CreateNetworkRequest { string project_id = 1; string name = 2; bool egress_none = 3; }
message CreateNetworkResponse { Network network = 1; }
message ListNetworksRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（既有排序轴不变；ADR-0026 after_* + limit 惯例）。
  string after_name = 2;
  int32 limit = 3;
}
message ListNetworksResponse { repeated Network networks = 1; }

// RebuildNetworkResponse 携带网络引用与本次执行的载体计数（幂等重跑的
// 快速路径两者为 0——已 attachable 且标签在位即零扰动返回）。
message RebuildNetworkRequest { string project_id = 1; string name = 2; }
message RebuildNetworkResponse {
  Network network = 1;
  // detached/reattached 是本次被摘除又加回的附着载体数。
  int32 detached = 2;
  int32 reattached = 3;
}

// NetworkPeer 是一条跨 Project 挂靠声明（ADR-0013 附录 A.1）：挂靠方
// 项目 declare（pending）→ 接收方 approve（approved）→ 任一侧 revoke
//（revoked；重新挂靠走新声明行）。network_* 是接收方（网络归属方）读
// 投影；peer_project_id 是挂靠方（声明方）项目。
message NetworkPeer {
  string id = 1;
  string network_id = 2;
  string network_name = 3;
  string network_project_id = 4;
  string peer_project_id = 5;
  // state: pending | approved | revoked（kebab，与 Task/Schedule 状态值
  // 拼写冻结同款）。
  string state = 6;
  string created_at = 7;
  string updated_at = 8;
  string approved_at = 9;
}

message DeclareNetworkPeerRequest {
  // network_id 是目标网络行（接收方 Project 的活跃网络）。
  string network_id = 1;
  // peer_project_id 是挂靠方项目（声明方）。
  string peer_project_id = 2;
}
message DeclareNetworkPeerResponse { NetworkPeer peer = 1; }
message ApproveNetworkPeerRequest { string id = 1; }
message ApproveNetworkPeerResponse { NetworkPeer peer = 1; }
message RevokeNetworkPeerRequest { string id = 1; }
message RevokeNetworkPeerResponse { NetworkPeer peer = 1; }
message GetNetworkPeerRequest { string id = 1; }
message GetNetworkPeerResponse { NetworkPeer peer = 1; }
message ListNetworkPeersRequest {
  // network_id 过滤（接收方视图：谁挂在我的网上）；peer_project_id 过滤
  //（挂靠方视图：我挂在哪里）；两者都空 = 全部。
  string network_id = 1;
  string peer_project_id = 2;
  // after_peer_id 游标（上一页末条 id；空 = 首页）。
  string after_peer_id = 3;
  int32 limit = 4;
}
message ListNetworkPeersResponse { repeated NetworkPeer peers = 1; }
