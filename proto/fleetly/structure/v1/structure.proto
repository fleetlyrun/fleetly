syntax = "proto3";

// Structure 上下文（领域模型 §2）：组织结构——项目/应用骨架与材料
//（Project/App/Secret/Config/Volume/Network）。读写分离的 CRUD 面；
// Route 属 Edge 上下文、Deployment 属 Delivery 上下文（各自 proto 包）。
package fleetly.structure.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/structure/v1;structurev1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// ProjectsService：Project 聚合 CRUD（scope 注解 + authn 拦截器执法；
// 服务缺省档 SERVER——新增方法缺注解即启动红，不静默放行）。
service ProjectsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = { post: "/v1/projects" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = { get: "/v1/projects/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_READ }
    };
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = { get: "/v1/projects" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (google.api.http) = { delete: "/v1/projects/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "projects" op: SCOPE_OP_ADMIN }
    };
  }
}

service AppsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {
    option (google.api.http) = { post: "/v1/apps" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_WRITE }
    };
  }
  rpc GetApp(GetAppRequest) returns (GetAppResponse) {
    option (google.api.http) = { get: "/v1/apps/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_READ }
    };
  }
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse) {
    option (google.api.http) = { get: "/v1/apps" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse) {
    option (google.api.http) = { delete: "/v1/apps/{id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "apps" op: SCOPE_OP_ADMIN }
    };
  }
}

// SecretsService：值永不回显——响应只携带指纹（ADR-0014）。
service SecretsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse) {
    option (google.api.http) = { put: "/v1/secrets" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "secrets" op: SCOPE_OP_WRITE }
    };
  }
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = { get: "/v1/secrets" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "secrets" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = { delete: "/v1/secrets/{project_id}/{name}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "secrets" op: SCOPE_OP_ADMIN }
    };
  }
}

