syntax = "proto3";

// Structure 上下文（领域模型 §2）：组织结构——项目/应用骨架与材料
//（Project/App/Secret/Config/Volume/Network）。读写分离的 CRUD 面；
// Route 属 Proxy 上下文、Deployment 属 Delivery 上下文（各自 proto 包）。
package fleetly.structure.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/structure/v1;structurev1";

import "buf/validate/validate.proto";
import "fleetly/spec/v1/spec.proto";
// delivery.Confirmation（B1 确认票面）——DeleteApp 携带确认票的契约引用；
// 单源定义在 delivery（铸票动词 PreviewDeploy/PreviewTeardown 所在域），
// 本包零复制。
import "fleetly/delivery/v1/delivery.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/policy.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// ProjectsService：Project 聚合 CRUD（scope 注解 + authn 拦截器执法；
// 服务缺省档 SERVER——新增方法缺注解即启动红，不静默放行）。
service ProjectsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = { post: "/v1/projects" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["projects:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = { get: "/v1/projects/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["projects:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ResolveProject 按 name 解析项目行（ADR-0092：name 在边界解析，id 在
  // 内核——调用方 team 作用域内唯一，歧义/不存在 fail-closed）。
  rpc ResolveProject(ResolveProjectRequest) returns (ResolveProjectResponse) {
    option (google.api.http) = { get: "/v1/resolve/project/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["projects:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = { get: "/v1/projects" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["projects:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (google.api.http) = { delete: "/v1/projects/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["projects:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

service AppsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {
    option (google.api.http) = { post: "/v1/apps" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["apps:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetApp(GetAppRequest) returns (GetAppResponse) {
    option (google.api.http) = { get: "/v1/apps/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["apps:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ResolveApp 按 (project id|name, app name) 解析应用行（name 在边界
  // 解析，ADR-0092；project 段同律先解析）。
  rpc ResolveApp(ResolveAppRequest) returns (ResolveAppResponse) {
    option (google.api.http) = { get: "/v1/resolve/app/{project}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["apps:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // GetAppSpec 回读 App 当前冻结 Spec（最新 Revision 的 protojson 规范
  // 序列化反解；只读面——写路径仅 Deploy）。Variables 编辑面 / Used-by
  // 反查 / Volume 挂载反查的数据源（IA v3 二期②）。
  rpc GetAppSpec(GetAppSpecRequest) returns (GetAppSpecResponse) {
    option (google.api.http) = { get: "/v1/apps/{id}/spec" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["apps:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse) {
    option (google.api.http) = { get: "/v1/apps" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["apps:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse) {
    option (google.api.http) = { delete: "/v1/apps/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["apps:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// SecretsService：值永不回显——响应只携带指纹（ADR-0014）。
service SecretsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse) {
    option (google.api.http) = { put: "/v1/secrets" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["secrets:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = { get: "/v1/secrets" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["secrets:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = { delete: "/v1/secrets/{project_id}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["secrets:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// ConfigsService：版本化挂载文件（可回读）。
service ConfigsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc PutConfig(PutConfigRequest) returns (PutConfigResponse) {
    option (google.api.http) = { put: "/v1/configs" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["configs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = { get: "/v1/configs/{project_id}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["configs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse) {
    option (google.api.http) = { get: "/v1/configs" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["configs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// SharedVariablesService：Project 级共享变量（ADR-0043）。值可回显（非
// 敏感契约——敏感值走 Secrets）；归一化期合成进 AppSpec（Project 层在
// 下、App 层 env 覆盖，ADR-0027），改共享变量需重部署才生效——响应携带
// 受影响 App 提示（近似口径）。
service SharedVariablesService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc PutSharedVariable(PutSharedVariableRequest) returns (PutSharedVariableResponse) {
    option (google.api.http) = { put: "/v1/shared-variables" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["shared_variables:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListSharedVariables(ListSharedVariablesRequest) returns (ListSharedVariablesResponse) {
    option (google.api.http) = { get: "/v1/shared-variables" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["shared_variables:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc DeleteSharedVariable(DeleteSharedVariableRequest) returns (DeleteSharedVariableResponse) {
    option (google.api.http) = { delete: "/v1/shared-variables/{project_id}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["shared_variables:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// AppVariable 面（ADR-0072 变量三级合成顶层）：App 级平台变量——git 应用
// 的 env 之家（push 合并与 overlay 都过冻结咽喉，store 值每次重合成）。
// 改变量不触发自动重部署；重部署（Redeploy/Deploy/push）取新值。
service AppVariablesService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc PutAppVariable(PutAppVariableRequest) returns (PutAppVariableResponse) {
    option (google.api.http) = { put: "/v1/app-variables" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["app_variables:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListAppVariables(ListAppVariablesRequest) returns (ListAppVariablesResponse) {
    option (google.api.http) = { get: "/v1/app-variables" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["app_variables:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc DeleteAppVariable(DeleteAppVariableRequest) returns (DeleteAppVariableResponse) {
    option (google.api.http) = { delete: "/v1/app-variables/{app_id}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["app_variables:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

service VolumesService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse) {
    option (google.api.http) = { post: "/v1/volumes" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["volumes:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option (google.api.http) = { get: "/v1/volumes" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["volumes:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeleteVolume 删除未挂载卷（IA v3 二期⑤b）：受理位前置引用预检——项目
  // 内活跃 App 冻结 Spec 的卷附件（volume_id 装平台卷名，引擎同锚）或同名
  // Database 挂靠卷任一命中即 E_CONFLICT。删除 = 平台行 tombstone；底层
  // 编排器卷不随删（swarm 命名卷残留是文档化文化、k3s PVC 卡 ns 排空——
  // 数据兜底永不级联，调用方披露）。
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse) {
    option (google.api.http) = { delete: "/v1/volumes/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["volumes:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewPurgeVolume 是 Purge 的只读预演（B7，ADR-0094 决策 5 / design
  // §2.4）：purge 清单（卷名/载体键/pinned 节点/关联库或独立卷）+ 容量
  // 行（Runtime live 可得则携带）+ 「数据不可恢复」披露 + 铸 wide 档确认
  // 票（mint 族：唯一副作用是一枚 600s 单用途票）。scope 钉 volumes:admin
  // ——镜像 PurgeVolume：预演动词不得低于被预演动词的权限门槛。
  rpc PreviewPurgeVolume(PreviewPurgeVolumeRequest) returns (PreviewPurgeVolumeResponse) {
    option (google.api.http) = { post: "/v1/volumes/{id}/preview-purge" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["volumes:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PurgeVolume 一次性数据销毁动作（B7，ADR-0094 决策 5 升级正典③：容量
  // 回收动机——ULID 卷键已消除同名复用撞库，删卷步真动机是回收磁盘）：
  // 受理引用预检（同 DeleteVolume）→ Runtime 物理卷删除（swarm = docker
  // volume rm by 载体键；k3s = PVC delete）→ 行清（tombstone，DeleteVolume
  // 语义延伸）一事务（事件 + 审计）。ACTION 桶；wide 档确认（无票且无
  // skip 即拒 E_CONFIRMATION_REQUIRED；票经 PreviewPurgeVolume 铸）。
  rpc PurgeVolume(PurgeVolumeRequest) returns (PurgeVolumeResponse) {
    option (google.api.http) = { post: "/v1/volumes/{id}/purge" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["volumes:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// DatabasesService：托管数据服务聚合面（ADR-0029）。凭证值永不回显——
// 响应只携带 Secret 名与去密码连接面（host/port）；App 经 secret_refs
// 引用 credentials_ref 取完整连接 URL。
service DatabasesService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse) {
    option (google.api.http) = { post: "/v1/databases" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetDatabase(GetDatabaseRequest) returns (GetDatabaseResponse) {
    option (google.api.http) = { get: "/v1/databases/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ResolveDatabase 按 (project id|name, database name) 解析数据库行
  // （name 在边界解析，ADR-0092）。
  rpc ResolveDatabase(ResolveDatabaseRequest) returns (ResolveDatabaseResponse) {
    option (google.api.http) = { get: "/v1/resolve/database/{project}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListDatabases 新→旧分页（after_database_seq 游标 = seq 创建序，
  // ADR-0026 惯例）。
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse) {
    option (google.api.http) = { get: "/v1/databases" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeleteDatabase 收口删除（ADR-0029 决策 8）：拆载体 → tombstone 一
  // 事务（事件 + 审计）；数据卷与凭证 Secret 不随删（Project 级材料，
  // 备份保留义）。
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse) {
    option (google.api.http) = { delete: "/v1/databases/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // TriggerBackup 手动触发（ADR-0039）：立即铸一行 pending 台账并 Kick
  // 备份环；完成事实由 backup.succeeded/backup.failed 事件与
  // ListBackups 观测（触发不等执行）。
  rpc TriggerBackup(TriggerBackupRequest) returns (TriggerBackupResponse) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/backups" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListBackups 新→旧分页（ADR-0026 after_* + limit）。
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option (google.api.http) = { get: "/v1/databases/{database_id}/backups" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // VerifyBackup 重算对象摘要比对回执（ADR-0039 决策 8）。
  rpc VerifyBackup(VerifyBackupRequest) returns (VerifyBackupResponse) {
    option (google.api.http) = { post: "/v1/backups/{backup_id}/verify" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DownloadBackup 流式下载备份对象（Verify 同源存储读面；分块字节经
  // gateway 帧化，消费端重组——IA v3 二期⑤）。仅 succeeded 台账行可下载。
  rpc DownloadBackup(DownloadBackupRequest) returns (stream DownloadBackupResponse) {
    option (google.api.http) = { get: "/v1/databases/{database_id}/backups/{backup_id}/download" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // BrowseDatabase 铸造数据浏览器按需会话（F3.6，ADR-0051）：静态 scope 是
  // 最低门（只读档）；read_write=true 或无只读执法的方言（mysql）在服务内
  // 动态要求 databases:write。响应 URL 含一次性 Launcher Ticket（120s 单
  // 用途）——兑换入口即 URL 本身。会话硬 TTL 30min、空闲 10min 回收。
  rpc BrowseDatabase(BrowseDatabaseRequest) returns (BrowseDatabaseResponse) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/browse" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // RotateDatabasePassword 轮换数据库凭证（IA v3 二期⑤b）：方言级数据面
  // 改密（postgres/mysql/mongo 经一次性工具容器以旧凭证认证执行；redis
  // 声明式——requirepass 在平台合成材料内，Secret 重写 + 载体重下发生效）
  // + 凭证 Secret database:<name> 原子重写 + 收敛环重下发。级联语义：
  // 引用该库的 App 持旧值直到重新部署——调用方（Console 确认页/CLI 回执）
  // 必须披露。要求库在服；新连接串只进 Secret（与创建同口径，永不回显）。
  rpc RotateDatabasePassword(RotateDatabasePasswordRequest) returns (RotateDatabasePasswordResponse) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/rotate-password" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // UpdateDatabase 变更期望态（B2d，ADR-0095 决策 5/8：settings/resources
  // 双车道——engine/version 创建即不可变，请求含之即拒并指引升级路径）。
  // 分流语义：dynamic 旋钮同步热应用先行（工具容器执行；失败 =
  // E_SETTINGS_APPLY_FAILED 行不动）→ 成功才落行；static 旋钮与 resources
  // 落行 + 收敛环受监督滚动（async）。混合变更一次受理、两车道各自注记
  // （响应 dynamic_applied/static_applied）。在 ConfirmableVerbs 强制集
  // （预览 = PreviewUpdateDatabase；确认档 standard）；冻结期拒绝；
  // status != running 拒（E_CONFLICT——滚动进行中/未就绪，红队 A6）。
  rpc UpdateDatabase(UpdateDatabaseRequest) returns (UpdateDatabaseResponse) {
    option (google.api.http) = { patch: "/v1/databases/{database_id}" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewUpdateDatabase 是 Update 的只读预演（B2d，ADR-0089/0095 决策 9）：
  // settings/resources diff + 车道判定（dynamic/static 键集）+ 滚动后果
  // （dynamic 全集 = zero_touch；含 static = replace）+ 铸 Confirm Ticket
  //（mint 族：唯一副作用是一枚 600s 单用途票）。与 Update 同一受理校验
  //（ValidateSettings/资源范围/不可变轴）。
  rpc PreviewUpdateDatabase(PreviewUpdateDatabaseRequest) returns (PreviewUpdateDatabaseResponse) {
    option (google.api.http) = { post: "/v1/databases/preview-update" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// DataEnginesService：Engine Catalog——跨家族引擎/版本/旋钮自描述面
// （ADR-0094 决策 4 / ADR-0095 决策 10；GET /v1/data-engines）。目录是
// 投影非存储：服务端从模板注册表现场装配（零缓存零漂移），Console/CLI
// 引擎取值唯一面。三家族全装配（database/pubsub/bucketstore，B2c/B4b/B5）。
//
// scope 裁定（B2c 探明回注 ADR-0094 决策 4 的「认证即读」）：authz 面
// （authn.policyview）只承认 PUBLIC-anonymous 与 SERVER-single-scope 两
// 规范形态——「已认证、免资源 scope」第三形态不可表达，按决策 4 降级
// `databases:read`（回注由编排者随批做）。
service DataEnginesService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc ListDataEngines(ListDataEnginesRequest) returns (ListDataEnginesResponse) {
    option (google.api.http) = { get: "/v1/data-engines" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["databases:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// PubSubsService：PubSub 家族托管服务聚合面（ADR-0096 决策 1/8，B4b 首个
// 新家族）。与 DatabasesService 同构（kind 词差异）：凭证值永不回显——
// 响应只携带 Secret 名（pubsub:<name>）与去密码连接面（host/port）；App 经
// pubsub_refs 注入 FLEETLY_PUB_* 或 secret_refs 文件注入取连接材料方言串。
// Browse 面不设（ADR-0051 注册表外语官既有拒；nats 无轻量 web 工具，挂账）。
service PubSubsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc CreatePubSub(CreatePubSubRequest) returns (CreatePubSubResponse) {
    option (google.api.http) = { post: "/v1/pubsubs" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetPubSub(GetPubSubRequest) returns (GetPubSubResponse) {
    option (google.api.http) = { get: "/v1/pubsubs/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ResolvePubSub 按 (project id|name, pubsub name) 解析行（ADR-0092）。
  rpc ResolvePubSub(ResolvePubSubRequest) returns (ResolvePubSubResponse) {
    option (google.api.http) = { get: "/v1/resolve/pubsub/{project}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListPubSubs 新→旧分页（after_pubsub_seq 游标 = seq 创建序）。
  rpc ListPubSubs(ListPubSubsRequest) returns (ListPubSubsResponse) {
    option (google.api.http) = { get: "/v1/pubsubs" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeletePubSub 收口删除：拆载体 → tombstone 一事务（事件 + 审计）；
  // 数据卷与凭证 Secret 不随删（Project 级材料，备份保留义）。
  rpc DeletePubSub(DeletePubSubRequest) returns (DeletePubSubResponse) {
    option (google.api.http) = { delete: "/v1/pubsubs/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // UpdatePubSub 变更期望态（settings/resources；engine/version 不可变）。
  // 本族首批旋钮全 static：落行 + 收敛环受监督滚动（async）。冻结期拒绝；
  // status != running 拒（E_CONFLICT）。B4c 起入 ConfirmableVerbs 强制集
  // （预览 = PreviewUpdatePubSub；确认档 standard——三家族 Update 同构，
  // design §3.3）。
  rpc UpdatePubSub(UpdatePubSubRequest) returns (UpdatePubSubResponse) {
    option (google.api.http) = { patch: "/v1/pubsubs/{pubsub_id}" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewUpdatePubSub 是 UpdatePubSub 的只读预演（B4c，ADR-0089/0095 决策
  // 9 三家族同构）：settings/resources diff + 车道判定 + 滚动后果（本族首批
  // 旋钮全 static——任何变更恒 replace）+ 铸 Confirm Ticket（mint 族：唯一
  // 副作用是一枚 600s 单用途票）。与 Update 同一受理校验。
  rpc PreviewUpdatePubSub(PreviewUpdatePubSubRequest) returns (PreviewUpdatePubSubResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/preview-update" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // RotatePubSubPassword 轮换凭证（声明式：平台合成用户住 nats-server.conf
  // ——Secret 重写 + 收敛环重下发生效）。级联语义：引用该实例的 App 持旧值
  // 直到重新部署——调用方必须披露。要求实例在服；新连接材料只进 Secret。
  rpc RotatePubSubPassword(RotatePubSubPasswordRequest) returns (RotatePubSubPasswordResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/{pubsub_id}/rotate-password" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // TriggerPubSubBackup 手动触发逐流备份（ADR-0096 决策 6 object_set：
  // 每流一成员，manifest 最后写；memory storage 流受理拒）。触发不等执行。
  rpc TriggerPubSubBackup(TriggerPubSubBackupRequest) returns (TriggerPubSubBackupResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/{pubsub_id}/backups" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListPubSubBackups 新→旧分页（台账行共用 Backup 消息——主体轴在
  // subject_id 字段承载实例行 id，kind 承载类型词面）。
  rpc ListPubSubBackups(ListPubSubBackupsRequest) returns (ListPubSubBackupsResponse) {
    option (google.api.http) = { get: "/v1/pubsubs/{pubsub_id}/backups" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // VerifyPubSubBackup manifest 驱动逐成员重算摘要比对回执。
  rpc VerifyPubSubBackup(VerifyPubSubBackupRequest) returns (VerifyPubSubBackupResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/{pubsub_id}/backups/{backup_id}/verify" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DownloadPubSubBackup 流式下载备份对象集（成员序拼接；仅 succeeded）。
  rpc DownloadPubSubBackup(DownloadPubSubBackupRequest) returns (stream DownloadPubSubBackupResponse) {
    option (google.api.http) = { get: "/v1/pubsubs/{pubsub_id}/backups/{backup_id}/download" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // —— 子资源管理面（B8，ADR-0096 决策 10 / design §4.7：声明行 + admin
  // 工具容器收敛；RPC 归属 pubsub 家族——engine 决定可用性：kafka 协议族
  // → Topic、nats → Stream，另一引擎受理拒〔E_INVALID_ARGUMENT〕）。全部
  // 请求携带父实例锚 pubsub_id（冻结/授权的归属解析锚——KindPubSub 单源）。

  // CreateTopic 落 Topic 声明行（kafka 协议族引擎；副本因子恒 1——单 broker
  // 事实，目录 note 标注）。收敛段对照实况 ensure：缺席创建/失配变更；行落
  // pending，ready/error 由收敛段推进。per 实例配额 topics 100。
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/{pubsub_id}/topics" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetTopic(GetTopicRequest) returns (GetTopicResponse) {
    option (google.api.http) = { get: "/v1/pubsubs/{pubsub_id}/topics/{topic_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListTopics 旧→新分页（after_topic_seq 游标 = seq 创建序——子资源面行序
  // 取创建序，与家族面新→旧相反：对账/审计语境下创建序更自然）。
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse) {
    option (google.api.http) = { get: "/v1/pubsubs/{pubsub_id}/topics" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // UpdateTopic 变更期望态（可变面：partitions〔可增不可减——方言层校验〕/
  // retention_ms）。行即期望态、收敛段接棒（无载体滚动——子资源面与载体
  // 面分立）。入 ConfirmableVerbs（确认档 standard；票经
  // PreviewUpdateTopic）。
  rpc UpdateTopic(UpdateTopicRequest) returns (UpdateTopicResponse) {
    option (google.api.http) = { patch: "/v1/pubsubs/{pubsub_id}/topics/{topic_id}" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewUpdateTopic 是 UpdateTopic 的只读预演（diff + 铸票；mint 族——
  // 唯一副作用是一枚 600s 单用途票）。
  rpc PreviewUpdateTopic(PreviewUpdateTopicRequest) returns (PreviewUpdateTopicResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/topics/preview-update" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeleteTopic 删除 Topic = 声明式 GC：行 tombstone → 收敛段删实况——
  // **Topic 删除即数据删除**（kafka 分区日志随之清除，不可恢复）。wide 档
  // 确认（ADR-0086：宽后果面）：票经 PreviewDeleteTopic（删除披露行——
  // live 可得的数据量列出，kafka CLI 无 per-topic 数据量面则如实披露）。
  rpc DeleteTopic(DeleteTopicRequest) returns (DeleteTopicResponse) {
    option (google.api.http) = { delete: "/v1/pubsubs/{pubsub_id}/topics/{topic_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewDeleteTopic 是 DeleteTopic 的删除披露行（实况探测 + 铸票）。
  rpc PreviewDeleteTopic(PreviewDeleteTopicRequest) returns (PreviewDeleteTopicResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/topics/preview-delete" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // CreateStream 落 Stream 声明行（nats 引擎；JetStream 流）。可变面
  // subjects/max_stream_size；retention/storage 创建后不可变（nats CLI 无
  // update 旗标——live 定案）。per 实例配额 streams 100。memory storage
  // 流不可快照（备份面既有拒律如实继承）。
  rpc CreateStream(CreateStreamRequest) returns (CreateStreamResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/{pubsub_id}/streams" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetStream(GetStreamRequest) returns (GetStreamResponse) {
    option (google.api.http) = { get: "/v1/pubsubs/{pubsub_id}/streams/{stream_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListStreams 旧→新分页（after_stream_seq 游标）。
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse) {
    option (google.api.http) = { get: "/v1/pubsubs/{pubsub_id}/streams" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // UpdateStream 变更可变面（subjects/max_stream_size——不可变轴 retention/
  // storage 携带即拒）。入 ConfirmableVerbs（确认档 standard）。
  rpc UpdateStream(UpdateStreamRequest) returns (UpdateStreamResponse) {
    option (google.api.http) = { patch: "/v1/pubsubs/{pubsub_id}/streams/{stream_id}" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewUpdateStream 是 UpdateStream 的只读预演（diff + 铸票）。
  rpc PreviewUpdateStream(PreviewUpdateStreamRequest) returns (PreviewUpdateStreamResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/streams/preview-update" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeleteStream 删除 Stream = 声明式 GC：**Stream 删除即数据删除**（流内
  // 消息随之清除，不可恢复）。wide 档确认：票经 PreviewDeleteStream（删除
  // 披露行列出流内消息数与字节量——nats state 面实测可得）。
  rpc DeleteStream(DeleteStreamRequest) returns (DeleteStreamResponse) {
    option (google.api.http) = { delete: "/v1/pubsubs/{pubsub_id}/streams/{stream_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewDeleteStream 是 DeleteStream 的删除披露行（实况数据量 + 铸票）。
  rpc PreviewDeleteStream(PreviewDeleteStreamRequest) returns (PreviewDeleteStreamResponse) {
    option (google.api.http) = { post: "/v1/pubsubs/streams/preview-delete" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["pubsubs:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// BucketStoresService：Bucket Store 家族托管服务聚合面（ADR-0096 决策 1/8，
// B5 第二新家族）。与 PubSubsService 同构（kind 词差异）：凭证值永不回显
// ——响应只携带 Secret 名（bucketstore:<name>）与去凭证连接面（host/port）；
// App 经 bucketstore_refs 注入 FLEETLY_BKT_* 或 secret_refs 文件注入取 k=v
// 连接材料方言串（endpoint/access_key/secret_key）。**无备份动词族**：silo
// 转储挂账（design §4.5 L4 表），目录 capabilities.backup=false 如实披露——
// TriggerBackup/ListBackups/Verify/Download 不设面、Create 无
// restore_from_backup（能力位裁剪，不以拒绝文案占位）。Browse 面不设
// （ADR-0051 注册表外语官既有拒；轻量 S3 web 工具挂账）。
service BucketStoresService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc CreateBucketStore(CreateBucketStoreRequest) returns (CreateBucketStoreResponse) {
    option (google.api.http) = { post: "/v1/bucket-stores" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetBucketStore(GetBucketStoreRequest) returns (GetBucketStoreResponse) {
    option (google.api.http) = { get: "/v1/bucket-stores/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ResolveBucketStore 按 (project id|name, bucket store name) 解析行（ADR-0092）。
  rpc ResolveBucketStore(ResolveBucketStoreRequest) returns (ResolveBucketStoreResponse) {
    option (google.api.http) = { get: "/v1/resolve/bucket-store/{project}/{name}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListBucketStores 新→旧分页（after_bucket_store_seq 游标 = seq 创建序）。
  rpc ListBucketStores(ListBucketStoresRequest) returns (ListBucketStoresResponse) {
    option (google.api.http) = { get: "/v1/bucket-stores" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeleteBucketStore 收口删除：拆载体 → tombstone 一事务（事件 + 审计）；
  // 数据卷与凭证 Secret 不随删（Project 级材料）。
  rpc DeleteBucketStore(DeleteBucketStoreRequest) returns (DeleteBucketStoreResponse) {
    option (google.api.http) = { delete: "/v1/bucket-stores/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // UpdateBucketStore 变更期望态（resources；settings 面在 silo v1 零旋钮下
  // 恒空集——engine/version 不可变）。落行 + 收敛环受监督滚动（async）。
  // 冻结期拒绝；status != running 拒（E_CONFLICT）。入 ConfirmableVerbs
  // 强制集（预览 = PreviewUpdateBucketStore；确认档 standard——三家族 Update
  // 同构，design §3.3）。
  rpc UpdateBucketStore(UpdateBucketStoreRequest) returns (UpdateBucketStoreResponse) {
    option (google.api.http) = { patch: "/v1/bucket-stores/{bucket_store_id}" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewUpdateBucketStore 是 UpdateBucketStore 的只读预演（ADR-0089/0095
  // 决策 9 三家族同构）：resources diff + 滚动后果（任何变更恒 replace）+
  // 铸 Confirm Ticket（mint 族：唯一副作用是一枚 600s 单用途票）。
  rpc PreviewUpdateBucketStore(PreviewUpdateBucketStoreRequest) returns (PreviewUpdateBucketStoreResponse) {
    option (google.api.http) = { post: "/v1/bucket-stores/preview-update" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // RotateBucketStorePassword 轮换凭证（声明式：root secret key 住启动 env
  // ——Secret 重写 + 收敛环以新 SK 重投影 = Generation 推进 = stop-first
  // 滚动生效）。级联语义：引用该实例的 App 持旧值直到重新部署——调用方
  // 必须披露。要求实例在服；新连接材料只进 Secret。
  rpc RotateBucketStorePassword(RotateBucketStorePasswordRequest) returns (RotateBucketStorePasswordResponse) {
    option (google.api.http) = { post: "/v1/bucket-stores/{bucket_store_id}/rotate-password" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // —— Bucket 子资源管理面（B8，ADR-0096 决策 10 / design §4.7）：Bucket
  // 属 bucketstore 家族（CLI 组名避撞律：实体组 `buckets` 已被 Bucket Store
  // 占用，子资源动词组取单数 `bucket`）。silo 引擎 admin 面 = 镜像自带
  // mcli（quota set/info live 定案在册——quota 无挂账）。per 实例配额
  // buckets 50。全部请求携带父实例锚 bucket_store_id。

  // CreateBucket 落 Bucket 声明行（silo 引擎；S3 桶名值域 3-63 字符
  // [a-z0-9.-]）。收敛段对照实况 ensure（mcli mb / quota set）。
  rpc CreateBucket(CreateBucketRequest) returns (CreateBucketResponse) {
    option (google.api.http) = { post: "/v1/bucket-stores/{bucket_store_id}/buckets" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetBucket(GetBucketRequest) returns (GetBucketResponse) {
    option (google.api.http) = { get: "/v1/bucket-stores/{bucket_store_id}/buckets/{bucket_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListBuckets 旧→新分页（after_bucket_seq 游标 = seq 创建序）。
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse) {
    option (google.api.http) = { get: "/v1/bucket-stores/{bucket_store_id}/buckets" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // UpdateBucket 变更可变面（quota_bytes——可选 hard quota，nil = 无配额）。
  // 入 ConfirmableVerbs（确认档 standard）。
  rpc UpdateBucket(UpdateBucketRequest) returns (UpdateBucketResponse) {
    option (google.api.http) = { patch: "/v1/bucket-stores/{bucket_store_id}/buckets/{bucket_id}" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewUpdateBucket 是 UpdateBucket 的只读预演（diff + 铸票）。
  rpc PreviewUpdateBucket(PreviewUpdateBucketRequest) returns (PreviewUpdateBucketResponse) {
    option (google.api.http) = { post: "/v1/bucket-stores/buckets/preview-update" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeleteBucket 删除 Bucket = 声明式 GC：**删除即对象数据删除**（mcli rb
  // --force 连带对象，不可恢复）。wide 档确认：票经 PreviewDeleteBucket
  // （删除披露行列出桶内对象量与字节量——mcli du 实测可得）。
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse) {
    option (google.api.http) = { delete: "/v1/bucket-stores/{bucket_store_id}/buckets/{bucket_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // PreviewDeleteBucket 是 DeleteBucket 的删除披露行（实况数据量 + 铸票）。
  rpc PreviewDeleteBucket(PreviewDeleteBucketRequest) returns (PreviewDeleteBucketResponse) {
    option (google.api.http) = { post: "/v1/bucket-stores/buckets/preview-delete" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["bucketstores:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// NetworksService：Network 聚合面 + 跨 Project peer 声明面（ADR-0013
// 附录 A：成员③显式跨 Project 引用——双向声明、接收方批准、撤销即时
// 隔离）。peer 动词 scope 复用 networks 资源（授权面等价于"管理网络"）。
service NetworksService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse) {
    option (google.api.http) = { post: "/v1/networks" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse) {
    option (google.api.http) = { get: "/v1/networks" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // RebuildNetwork 是网络重建维护动词（ADR-0046）：平台中介地删除并按
  // ensureNetworks 同源形态复建载体网络（Attachable=true，标签同源）——
  // 平台归属载体逐个 detach/re-attach，编排全程与部署 Ensure/受管
  // reconciler 串行化。存在平台无法归属的附着即 E_CONFLICT 拒绝并列出。
  // 在幂等执法面（Idempotency-Key 头，ADR-0024）；变更冻结期拒绝。
  rpc RebuildNetwork(RebuildNetworkRequest) returns (RebuildNetworkResponse) {
    option (google.api.http) = { post: "/v1/networks/rebuild" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // DeclareNetworkPeer 是挂靠方声明（落 pending 行）：peer 项目请求挂靠
  // 目标网络。在幂等执法面（Idempotency-Key 头，ADR-0024）。
  rpc DeclareNetworkPeer(DeclareNetworkPeerRequest) returns (DeclareNetworkPeerResponse) {
    option (google.api.http) = { post: "/v1/networks/peers" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ApproveNetworkPeer 是接收方批准（pending → approved）：网络归属方
  // 同意挂靠。批准前引用不可投影（strict 投影 fail-closed）。
  rpc ApproveNetworkPeer(ApproveNetworkPeerRequest) returns (ApproveNetworkPeerResponse) {
    option (google.api.http) = { post: "/v1/networks/peers/{id}/approve" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // RevokeNetworkPeer 撤销（任一侧；幂等）：即时隔离——引擎对受影响
  // App 以 isolate 模式重收敛剥离附件（断存量，ADR-0013 附录 A.4）。
  rpc RevokeNetworkPeer(RevokeNetworkPeerRequest) returns (RevokeNetworkPeerResponse) {
    option (google.api.http) = { post: "/v1/networks/peers/{id}/revoke" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc GetNetworkPeer(GetNetworkPeerRequest) returns (GetNetworkPeerResponse) {
    option (google.api.http) = { get: "/v1/networks/peers/{id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListNetworkPeers 新→旧分页（游标 = seq 创建序；network_id /
  // peer_project_id 过滤可选——接收方与挂靠方两侧视图同面）。
  rpc ListNetworkPeers(ListNetworkPeersRequest) returns (ListNetworkPeersResponse) {
    option (google.api.http) = { get: "/v1/networks/peers" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["networks:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

message Project {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 6;
  string name = 2;
  string team_id = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message CreateProjectRequest {
  // name 的形态约束（required + dns 标签）走 protovalidate CEL 注解：
  // shape 规则以空值短路（`size() == 0 || ...`）保证坏输入恰好一条违规。
  // 正则字面与长度界（63）是 entityid.NamePatternSource / MaxNameLen 的
  // 镜像（proto 无法引用 Go 常量），字节一致由 entityid 包的 descriptor
  // 对齐测试执法。
  string name = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      // 括号显式写清 && 与 || 的结合（CEL 中 && 优先级高于 ||）。
      expression: "this.size() == 0 || (this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63)"
    }
  ];
  string team_id = 2;
}
message CreateProjectResponse { Project project = 1; }
message GetProjectRequest { string id = 1; }
// ResolveProjectRequest：name 在调用方 team 作用域内解析（ADR-0092）。
message ResolveProjectRequest { string name = 1; }
message ResolveProjectResponse { Project project = 1; }
message GetProjectResponse { Project project = 1; }
message ListProjectsRequest {
  // after_project_seq 游标（上一页末条 seq；0 = 首页）。游标轴 = seq
  // 创建序升序（既有响应序不变；ADR-0026 after_* + limit 惯例）。
  int64 after_project_seq = 1;
  int32 limit = 2;
}
message ListProjectsResponse { repeated Project projects = 1; }
message DeleteProjectRequest { string id = 1; }
message DeleteProjectResponse {}

message App {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 5;
  string project_id = 2;
  string name = 3;
  string created_at = 4;
}

message CreateAppRequest {
  // project_id 必填：App 的父 Project（受理位父存活/配额校验的锚）。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 dns 标签（小写字母数字与连字符，首尾字母数字，≤63 字符，
  // ADR-0070 决策 4）——可读 id base 与派生名安全的前提。正则字面与长度
  // 界是 entityid.NamePatternSource / MaxNameLen 的镜像（proto 无法引用
  // Go 常量），字节一致由 entityid 包的 descriptor 对齐测试执法；空值
  // 同报形状（本字段无 required 规则，空名不接受）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      expression: "this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63"
    }
  ];
}
message CreateAppResponse { App app = 1; }
message GetAppRequest { string id = 1; }
// ResolveAppRequest：project 收 id|name（name 走 team 作用域），app 按
// 项目内名解析（ADR-0092）。
message ResolveAppRequest { string project = 1; string name = 2; }
message ResolveAppResponse { App app = 1; }
message GetAppResponse { App app = 1; }
message DownloadBackupRequest {
  string database_id = 1;
  string backup_id = 2;
}

message DownloadBackupResponse {
  bytes data = 1;
}

message GetAppSpecRequest { string id = 1; }
message GetAppSpecResponse {
  // spec 是最新 Revision 冻结的 AppSpec（spec.proto 唯一运行时边界的
  // 只读回读；未部署过 = E_NOT_FOUND）。
  fleetly.spec.v1.AppSpec spec = 1;
  // revision_seq/revision_digest 锚定本 Spec 出自哪条 Revision（ADR-0071
  // 决策 1：最新冻结的诚实锚——与"当前生效"（最新成功部署的
  // to_revision，delivery 域 GetAppWorkloads 缺省寻址）分野的输入）。
  int64 revision_seq = 2;
  string revision_digest = 3;
}
message ListAppsRequest {
  // project_id 必填：List 面的项目锚（行级授权沿此轴，ADR-0035）。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // after_app_seq 游标（上一页末条 seq（0 = 首页）。游标轴 = seq 创建序
  // 升序（既有响应序不变；ADR-0026 after_* + limit 惯例）。
  int64 after_app_seq = 2;
  int32 limit = 3;
}
message ListAppsResponse { repeated App apps = 1; }
message DeleteAppRequest {
  // id 必填：目标 App 行。
  string id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // confirmation 是拆除确认票（B1 强制集成员，delete 族）：PreviewTeardown
  // 铸票 → 带票拆除的两调用流闭环；票面绑定 = app 行版本 + hook 行 digest
  // + route 行 ID 集摘要（设计稿 §1.2/§1.4）。DeleteApp 在
  // ConfirmableVerbs 强制集：无票且无 skip 即拒 E_CONFIRMATION_REQUIRED
  //（W2b 立法）。
  optional fleetly.delivery.v1.Confirmation confirmation = 2;
}
message DeleteAppResponse {}

message Secret {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // fingerprint 是值指纹（值永不回显，ADR-0014）。
  string fingerprint = 4;
  string updated_at = 5;
}

message PutSecretRequest {
  // project_id 必填：Secret 归属 Project。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 Secret 名：字符集白名单 [A-Za-z0-9][A-Za-z0-9:._-]{0,63} 且
  // 不含 ".."——引用名原样成为容器内 /run/secrets/<名> 文件目标与 swarm
  // 载体名成分，拒路径逃逸。正则字面是 spec.SecretNamePattern 的镜像
  //（proto 无法引用 Go 常量），字节一致由 spec 包的 descriptor 对齐测试
  // 执法。平台保留前缀（database:<name>，ADR-0029 决策 6）由服务内检查
  // 以 E_CONFLICT 拒绝。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "string.secret_name"
      message: "secret names must match \"[A-Za-z0-9][A-Za-z0-9:._-]{0,63}\", start with a letter or digit, and must not contain \"..\" (secret names become /run/secrets/<name> paths)"
      expression: "this.size() == 0 || (this.matches('^[A-Za-z0-9][A-Za-z0-9:._-]{0,63}$') && !this.contains('..'))"
    }
  ];
  // value 只进不回（请求侧明文；响应只回指纹）。
  string value = 3;
}
message PutSecretResponse { Secret secret = 1; }
message ListSecretsRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（既有排序轴不变；分页只动行集，每行仍是最新指纹面）。
  string after_name = 2;
  int32 limit = 3;
}
message ListSecretsResponse { repeated Secret secrets = 1; }
message DeleteSecretRequest { string project_id = 1; string name = 2; }
message DeleteSecretResponse {}

message Config {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int64 version = 4;
  string created_at = 5;
  // content 仅 GetConfig 回读（List 不带——体积面）。
  string content = 6;
}

message PutConfigRequest {
  // project_id 必填：Config 归属 Project。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 必填：项目内配置名（同名 put 是新版本）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // content 是配置内容，单值上限 262144 字节（bytes().size() 数字节，
  // 非 UTF-8 码点）。
  string content = 3 [
    (buf.validate.field).cel = {
      id: "string.max_bytes"
      message: "exceeds the 262144-byte per-config limit"
      expression: "bytes(this).size() <= 262144"
    }
  ];
}
message PutConfigResponse { Config config = 1; }
message GetConfigRequest { string project_id = 1; string name = 2; int64 version = 3; }
message GetConfigResponse { Config config = 1; }
message ListConfigsRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（既有排序轴不变；分页只动行集，每行仍是该 name 最新版）。
  string after_name = 2;
  int32 limit = 3;
}
message ListConfigsResponse { repeated Config configs = 1; }

// SharedVariable 是 Project 级共享变量（ADR-0043）：值明文回显——非敏感
// 契约与 env 同源（敏感值走 Secrets）；归一化期作为 Project 层合成进
// AppSpec（App 层 env 覆盖）。
message SharedVariable {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string value = 4;
  string updated_at = 5;
}

message PutSharedVariableRequest {
  // project_id 必填：变量归属 Project。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 env 键形态（[A-Za-z_][A-Za-z0-9_]*，≤64 字符，ADR-0043 决策
  // 2）——变量名直接成为容器 env 键。正则字面是 spec.EnvNamePattern 的
  // 镜像（proto 无法引用 Go 常量），字节一致由 spec 包的 descriptor 对齐
  // 测试执法。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "string.env_name"
      message: "variable names must match \"[A-Za-z_][A-Za-z0-9_]{0,63}\" (variable names become environment keys)"
      expression: "this.size() == 0 || this.matches('^[A-Za-z_][A-Za-z0-9_]{0,63}$')"
    }
  ];
  // value 是变量值，单值上限 16384 字节（env 是进程环境面不是文件面；
  // bytes().size() 数字节）。
  string value = 3 [
    (buf.validate.field).cel = {
      id: "string.max_bytes"
      message: "exceeds the 16384-byte per-variable limit"
      expression: "bytes(this).size() <= 16384"
    }
  ];
}
// affected_apps 是受影响 App 提示（近似口径，ADR-0043 决策 4）：项目内
// 已有 Revision 且最新冻结 env 会因本次变更而不同的 App——重部署取新值；
// 不触发任何自动重部署。
message PutSharedVariableResponse {
  SharedVariable variable = 1;
  repeated string affected_apps = 2;
}
message ListSharedVariablesRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（ADR-0026 after_* + limit 惯例）。
  string after_name = 2;
  int32 limit = 3;
}
message ListSharedVariablesResponse { repeated SharedVariable variables = 1; }
message DeleteSharedVariableRequest {
  // project_id 必填：变量归属 Project。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 必填：目标变量键。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DeleteSharedVariableResponse { repeated string affected_apps = 1; }

message AppVariable {
  string id = 1;
  string app_id = 2;
  string name = 3;
  string value = 4;
  string updated_at = 5;
}
message PutAppVariableRequest {
  // app_id 必填：变量归属 App。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 env 键形态（[A-Za-z_][A-Za-z0-9_]*，≤64 字符——与共享变量
  // 同一白名单：变量名直接成为容器 env 键，ADR-0072）。正则字面是
  // spec.EnvNamePattern 的镜像（proto 无法引用 Go 常量），字节一致由
  // spec 包的 descriptor 对齐测试执法。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "string.env_name"
      message: "variable names must match \"[A-Za-z_][A-Za-z0-9_]{0,63}\" (variable names become environment keys)"
      expression: "this.size() == 0 || this.matches('^[A-Za-z_][A-Za-z0-9_]{0,63}$')"
    }
  ];
  // value 是变量值，单值上限 16384 字节（与共享变量同档；
  // bytes().size() 数字节）。
  string value = 3 [
    (buf.validate.field).cel = {
      id: "string.max_bytes"
      message: "exceeds the 16384-byte per-variable limit"
      expression: "bytes(this).size() <= 16384"
    }
  ];
}
// PutAppVariableResponse 不携带 affected_apps 提示：受影响者恒为 App
// 本身（重部署取新值——响应注释即提示）。
message PutAppVariableResponse { AppVariable variable = 1; }
message ListAppVariablesRequest {
  // app_id 必填：List 面的 App 锚（行级授权沿此轴，ADR-0035）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = App 内 name
  // 字典序升序（ADR-0026 after_* + limit 惯例）。
  string after_name = 2;
  int32 limit = 3;
}
message ListAppVariablesResponse { repeated AppVariable variables = 1; }
message DeleteAppVariableRequest {
  // app_id 必填：变量归属 App。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 必填：目标变量键。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DeleteAppVariableResponse {}

message Volume {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string pinned_node_id = 4;
  string created_at = 5;
}

message CreateVolumeRequest {
  // project_id 必填：Volume 的父 Project（受理位父存活校验的锚）。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 dns 标签（小写字母数字与连字符，首尾字母数字，≤63 字符，
  // ADR-0070 决策 4）——平台卷名与派生名安全的前提。正则字面与长度界
  // 是 entityid.NamePatternSource / MaxNameLen 的镜像，字节一致由
  // entityid 包的 descriptor 对齐测试执法；空值同报形状（本字段无
  // required 规则，空名不接受）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      expression: "this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63"
    }
  ];
  string pinned_node_id = 3;
}
message CreateVolumeResponse { Volume volume = 1; }
message ListVolumesRequest { string project_id = 1; }
message ListVolumesResponse { repeated Volume volumes = 1; }
message DeleteVolumeRequest {
  // id 必填：目标 Volume 行。
  string id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DeleteVolumeResponse {}

// —— volumes purge（B7，ADR-0094 决策 5 / design §2.4 升级正典③）——

// PreviewPurgeVolumeRequest：id 必填（目标 Volume 行）。
message PreviewPurgeVolumeRequest {
  string id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
// PreviewPurgeVolumeResponse 是 purge 清单 + 容量行 + wide 披露 + 铸票。
message PreviewPurgeVolumeResponse {
  // name / carrier_key / pinned_node_id 是 purge 清单三锚：卷名（用户定位
  // 键）、载体键（= 卷行 id，ADR-0097；运行侧物理卷按它寻址）、pinned
  // 节点（物理卷所在节点——docker 卷 node-local 事实）。
  string name = 1;
  string carrier_key = 2;
  string pinned_node_id = 3;
  // database_id / database_name 在场 = 该卷是同名 Database 的挂靠数据卷
  //（删除库后的旧数据卷——升级正典③的典型形态）；缺席 = 独立卷。
  string database_id = 4;
  string database_name = 5;
  // usage_bytes / usage_known 是容量行：Runtime live 回报物理卷当前占用
  //（字节）时携带（usage_known=true）；Runtime 无法回报容量时
  // usage_known=false、usage_bytes 无意义——披露面降级为卷名+载体键+节点
  //（ADR-0092 容量披露探明裁定：两在册 Runtime 均可回报）。
  int64 usage_bytes = 6;
  bool usage_known = 7;
  // ticket / ticket_expires_in 是 wide 档 Confirm Ticket（600s 单用途；
  // 兑换动词 PurgeVolume）。RequestDigest 绑 purge 清单本体（卷行 id+名+
  // 载体键+pinned 节点+容量行）——预览后世界漂移即 MISMATCH。
  string ticket = 8;
  int32 ticket_expires_in = 9;
}
// PurgeVolumeRequest：id 必填 + 强制确认票（wide 档——一次性数据销毁
// 动作；票经 PreviewPurgeVolume 铸或 skip 直发）。
message PurgeVolumeRequest {
  string id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  optional fleetly.delivery.v1.Confirmation confirmation = 2;
}
// PurgeVolumeResponse 回显 purge 事实（行已 tombstone、物理载体已删）。
message PurgeVolumeResponse {
  // name / carrier_key 是已销毁卷的清单回显（审计对账面）。
  string name = 1;
  string carrier_key = 2;
  // purged_bytes / usage_known 是回收量回执（预览容量行的同源口径；
  // usage_known=false = Runtime 未回报）。
  int64 purged_bytes = 3;
  bool usage_known = 4;
}

// Database 是托管有状态服务行（ADR-0029：模板参数创建即不可变，无
// Revision/Deployment 面；engine/version 创建即不可变——settings/resources
// 经 Update 可变是 ADR-0095 决策 8 的修订，Update 随 B2d）。
message Database {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 15;
  string project_id = 2;
  string name = 3;
  string engine = 4;
  // version 是用户面 major 短名（ADR-0094 决策 1/3：创建时选定、存续期
  // 不可变；行值直读——B2c 起退役「服务端模板动态取」双源）。
  string version = 5;
  // credentials_ref 是凭证 Secret 名（值 = 完整连接 URL，永不回显；App
  // 经 process secret_refs 文件注入直用）。
  string credentials_ref = 6;
  // host 是网内 DNS 名（db-<id>，仅项目网内可解析——诚实连接面）。
  string host = 7;
  // port 是模板服务端口。
  int32 port = 8;
  // status: pending | running | degraded | stopped（收敛环推进）。
  string status = 9;
  string created_at = 10;
  string updated_at = 11;
  // last_backup_at 是最近一次成功 Backup 的完成时刻（'' = 从未成功；
  // 定时调度锚，ADR-0039）。
  string last_backup_at = 12;
  // restore_from_backup 是恢复源备份行 id（历史事实：创建时选定，成功/
  // 失败都不清位；在途判定读 restore_state，ADR-0039 决策 6 修订）。
  string restore_from_backup = 13;
  // restore_error 是最近一次恢复失败的事实（失败终态留痕；恢复失败后
  // 平台不再自动重试——诚实留给用户重建）。
  string restore_error = 14;
  // settings 是已受理的白名单旋钮子集回显（ADR-0095 决策 1：键 = 引擎
  // 原生词；schema 见 Engine Catalog 的 knobs；空 = 无旋钮）。
  map<string, string> settings = 16;
  // resources 是载体资源面回显（ADR-0095 决策 7：缺省 nil = 无限制 =
  // 现状；static 语义）。
  DatabaseResources resources = 17;
  // restore_state 是恢复显式状态（ADR-0039 决策 6 修订）：'' = 无恢复；
  // pending/running = 在途；succeeded/failed = 终态（failed 不再重试）。
  string restore_state = 18;
}

// DatabaseResources 是 Database 的载体资源面（ADR-0095 决策 7 / design
// §5）：可选——缺席字段 = 无限制；两者都缺席 = 消息 nil 语义等价。
// 上限：cpu_millis ≤ 64000（64 vCPU）、memory_mb ≤ 262144（256 GiB）——
// 受理位范围校验的自定合理界（单库载体占满控制面的形态拒绝优于静默）。
message DatabaseResources {
  // cpu_millis 是 CPU 限额（毫核，正整数；swarm Limits / k3s requests+
  // limits 既有翻译面）。
  int32 cpu_millis = 1;
  // memory_mb 是内存限额（MiB，正整数）。
  int32 memory_mb = 2;
}

message CreateDatabaseRequest {
  // project_id 必填：Database 的父 Project（受理位父存活/配额/网络校验
  // 的锚）。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 dns 标签（小写字母数字与连字符，首尾字母数字，≤63 字符，
  // ADR-0070 决策 4）——db-<id> 网内 DNS 名与凭证 Secret 名派生的前提。
  // 正则字面与长度界是 entityid.NamePatternSource / MaxNameLen 的镜像，
  // 字节一致由 entityid 包的 descriptor 对齐测试执法；空值同报形状
  //（本字段无 required 规则，空名不接受）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      expression: "this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63"
    }
  ];
  // engine 必填且值域 = 模板注册表（postgres / pgvector / redis，
  // ADR-0029）——值域外由服务内注册表检查拒绝并列出合法值。
  string engine = 3 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // restore_from_backup 是可选恢复源（ADR-0039）：成功备份行 id；在场 =
  // 新库挂起恢复（备份环执行：流式注入或卷预置）。engine 仍必填且须与
  // 源备份引擎一致（跨引擎恢复拒绝）；版本轴由受理位 RestoreCompat 裁
  //（ADR-0094 决策 5：同版本放行、只升不降、pgvector 分轴）。
  string restore_from_backup = 4;
  // version 是可选版本短名（ADR-0094 决策 3：空 = 引擎 Default；值域 =
  // 服务内注册表检查——未知/弃用拒并列合法值与弃用说明；弃用版对带
  // restore 的同版本重建放行〔灾备义〕）。创建后不可变（换值 = 升级
  // 路径，决策 5）。
  string version = 5;
  // settings 是可选旋钮初值（ADR-0095 决策 1：白名单外键/类型/范围/enum
  // 外值由受理位 ValidateSettings 精确拒绝；schema 自 Engine Catalog）。
  map<string, string> settings = 6;
  // resources 是可选载体资源面（ADR-0095 决策 7：缺省 nil = 无限制）。
  DatabaseResources resources = 7;
}
message CreateDatabaseResponse {
  Database database = 1;
  // restore_version_note 在场 = 恢复源备份行未记录引擎版本（migration
  // 00039 前的旧行）——同引擎放行但兼容性未验证，降级风险自负（红队
  // A10；受理文案标注面）。
  string restore_version_note = 2;
}
message GetDatabaseRequest { string id = 1; }
// ResolveDatabaseRequest：project 收 id|name，database 按项目内名解析。
message ResolveDatabaseRequest { string project = 1; string name = 2; }
message ResolveDatabaseResponse { Database database = 1; }
message GetDatabaseResponse { Database database = 1; }
message ListDatabasesRequest {
  // project_id 必填：List 面的项目锚（行级授权沿此轴，ADR-0035）。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // after_database_seq 游标（上一页末条 seq（0 = 首页）。
  int64 after_database_seq = 2;
  int32 limit = 3;
}
message ListDatabasesResponse { repeated Database databases = 1; }
message DeleteDatabaseRequest {
  // id 必填：目标 Database 行。
  string id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DeleteDatabaseResponse {}

// Backup 是一次备份的台账行（ADR-0039；主体中性：database/pubsub/
// bucketstore 共用）：成功行携带 ObjectStore 回执（object_key/digest/size
// = verify 锚）；credential 值永不出现。
message Backup {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 13;
  string project_id = 2;
  // subject_id 是备份主体实例行 id（kind 区分 database/pubsub/
  // bucketstore；实例 id 全局唯一）。
  string subject_id = 3;
  // kind 是备份主体类型词面（database | pubsub | bucketstore）。
  string kind = 15;
  string engine = 4;
  // engine_version 是铸造时刻源库行上的版本短名（ADR-0094 决策 5：
  // RestoreCompat 的源版本锚；'' = 旧行「版本未记录」——恢复受理同引擎
  // 放行但标注降级风险自负）。
  string engine_version = 14;
  string object_key = 5;
  string digest = 6;
  int64 size_bytes = 7;
  // status: pending | running | succeeded | failed。
  string status = 8;
  string error = 9;
  string started_at = 10;
  string finished_at = 11;
  string created_at = 12;
}
message TriggerBackupRequest {
  // database_id 必填：备份目标 Database 行。
  string database_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message TriggerBackupResponse { Backup backup = 1; }
message ListBackupsRequest {
  // database_id 必填：备份台账的 Database 锚。
  string database_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // after_backup_seq 游标（上一页末条 seq（0 = 首页）。
  int64 after_backup_seq = 2;
  int32 limit = 3;
}
message ListBackupsResponse { repeated Backup backups = 1; }
// VerifyBackup 重算对象 sha256 比对 Put 回执（ADR-0039 决策 8：静态完整
// 性——腐损/截断可检出；可恢复性由恢复演练承担）。
message VerifyBackupRequest {
  // backup_id 必填：待验证的 Backup 台账行。
  string backup_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message VerifyBackupResponse {
  bool ok = 1;
  string digest = 2;
  string error = 3;
}

// BrowseDatabase 铸造数据浏览器会话（ADR-0051）。read_write 缺省 false =
// 只读档；true 解锁写（动态要求 databases:write——静态注解只能表达最低门）。
message BrowseDatabaseRequest {
  // database_id 必填：浏览目标 Database 行。
  string database_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  bool read_write = 2;
}
message BrowseDatabaseResponse {
  string session_id = 1;
  // url 是会话入口（含一次性票据 query）；ticket/expires_in 另行透出供
  // 脚本化消费。票据兑换即烧，过期重开新会话。
  string url = 2;
  string ticket = 3;
  int32 expires_in = 4;
  // browser 是承接工具名（pgweb/redis-commander/adminer/mongoku——引擎
  // 方言映射的单源在 dbbrowser 注册表）。
  string browser = 5;
  bool read_only = 6;
  // enforcement 是只读执法层级（诚实分层，ADR-0051 决策 6）：session =
  // 服务端会话执法（PG 家族）；tool = 工具 HTTP API 层门（redis/mongo）；
  // none = 无方言（mysql——read_write 才可开）。
  BrowseReadOnlyEnforcement enforcement = 7;
}
// BrowseReadOnlyEnforcement 是只读执法层级值域（ADR-0051 决策 6）。
enum BrowseReadOnlyEnforcement {
  BROWSE_READ_ONLY_ENFORCEMENT_UNSPECIFIED = 0;
  BROWSE_READ_ONLY_ENFORCEMENT_SESSION = 1;
  BROWSE_READ_ONLY_ENFORCEMENT_TOOL = 2;
  BROWSE_READ_ONLY_ENFORCEMENT_NONE = 3;
}

// RotateDatabasePassword 轮换凭证（IA v3 二期⑤b）。新连接串只进 Secret
//（与创建同口径，永不回显）；响应是轮换后的 Database 行（status 载体
// 重下发的观测面）。
message RotateDatabasePasswordRequest {
  // database_id 必填：轮换目标 Database 行。
  string database_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message RotateDatabasePasswordResponse { Database database = 1; }

// —— UpdateDatabase 双车道（B2d，ADR-0095 决策 5/8/9；design §3.3）——

// UpdateDatabaseRequest 是期望态变更载荷（声明式全量替换语义）。settings
// 缺席 = 旋钮面不变；在场 = values 全量替换期望态（values 空 = 清空全部
// 旋钮——包装消息承载在场语义：proto3 map 的缺席与空在线上不可区分，裸
// map 无法表达「清空」）。resources 缺席 = 资源面不变；在场 = 全量替换
// （字段 0 = 该轴无限制）。confirmation 是强制确认票（ConfirmableVerbs
// 成员：无票且无 skip 即拒 E_CONFIRMATION_REQUIRED；票经
// PreviewUpdateDatabase 铸）。
message UpdateDatabaseRequest {
  // database_id 必填：变更目标 Database 行。
  string database_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // settings 是旋钮期望态（全量替换；键 = 引擎原生词，值域经
  // ValidateSettings 单源执法——含未变键的全量重放幂等）。
  DatabaseSettingsUpdate settings = 2;
  // resources 是载体资源面（全量替换；static 语义 = 受监督滚动生效）。
  DatabaseResources resources = 3;
  // confirmation 是强制确认票（B2d 入 ConfirmableVerbs：预览铸票或
  // skip 直发；票绑定 update 载荷摘要）。
  optional fleetly.delivery.v1.Confirmation confirmation = 4;
  // engine / version 不可变锚（ADR-0095 决策 8 / ADR-0029 决策 1 修订）：
  // 创建即定型，Update 不接受换引擎/换版本——携带非空值即拒
  // E_INVALID_ARGUMENT 并指引升级路径（同版本带 restore 的同名重建或
  // 升级正典 runbook）。字段在座是为把「不可变」做成可执法的机器契约
  //（protovalidate 之外的显式受理检查），不是可变更面。
  string engine = 5;
  string version = 6;
}
// DatabaseSettingsUpdate 是 settings 期望态的全量替换载体（UpdateDatabase
// 的在场语义承载：消息在场 = values 即新期望态全集，values 空 = 清空全部
// 旋钮；消息缺席 = 旋钮面不变）。
message DatabaseSettingsUpdate {
  map<string, string> values = 1;
}
// UpdateDatabaseResponse 回显变更后 Database 行 + 两车道执行注记（键集
// 排序稳定；受理位事务后组装——注记是执行事实不是行字段）。
message UpdateDatabaseResponse {
  Database database = 1;
  // dynamic_applied 是本拍同步热应用成功的 dynamic 键集（引擎已生效并
  // 自持久；空 = 无 dynamic 变更或未变重放的零扰动 no-op）。
  repeated string dynamic_applied = 2;
  // static_applied 是落行并触发受监督滚动的 static 键集（async 收敛——
  // 滚动重启发；空 = 无 static 变更）。
  repeated string static_applied = 3;
}

// PreviewUpdateDatabaseRequest 内嵌同一 Update 载荷（与 PreviewDeploy 同
// 形：直接字段不含 confirmation——豁免族的形状语义由 confirmguard 钉死）。
// update 缺席由受理面兜底拒 E_INVALID_ARGUMENT（PreviewDeploy 先例：
// protovalidate 对未设消息字段跳过规则，CEL 必填在此空转，故不挂注解）。
message PreviewUpdateDatabaseRequest {
  UpdateDatabaseRequest update = 1;
}
// PreviewUpdateDatabaseResponse 是只读预演 + 铸票。
message PreviewUpdateDatabaseResponse {
  // settings_changes 是旋钮级 diff（变更键集；未变键不进场——声明式
  // 重放零扰动的预演面）。from/to 空串 = 原缺席/本次移除。
  repeated DatabaseSettingChange settings_changes = 1;
  // resources_from / resources_to 是资源面 diff（缺席消息 = 无限制）。
  DatabaseResources resources_from = 2;
  DatabaseResources resources_to = 3;
  // dynamic_keys / static_keys 是变更键的车道判定（dynamic = 同步热应用；
  // static = 受监督滚动）。
  repeated string dynamic_keys = 4;
  repeated string static_keys = 5;
  // rollout 是滚动后果判定（ADR-0095 决策 9：dynamic 全集 =
  // zero_touch——容器不重启；含 static = replace——受监督滚动重启发）。
  string rollout = 6;
  // ticket / ticket_expires_in 是 Confirm Ticket（600s 单用途；兑换动词
  // UpdateDatabase）。
  string ticket = 7;
  int32 ticket_expires_in = 8;
}
// DatabaseSettingChange 是单旋钮 diff 行。
message DatabaseSettingChange {
  string key = 1;
  string from = 2;
  string to = 3;
  // class 是该旋钮的车道分级（static | dynamic——Engine Catalog knobs 的
  // class 词面同源）。
  string class = 4;
}

// —— PubSub 家族消息族（B4b，ADR-0096 决策 1/8：DatabasesService 同构，
// kind 词差异）——

// PubSub 是聚合行回显（凭证值永不出现；host = pub-<id> 网内 DNS 名）。
message PubSub {
  string id = 1;
  int64 seq = 15;
  string project_id = 2;
  string name = 3;
  string engine = 4;
  string version = 5;
  // credentials_ref 是凭证 Secret 名（pubsub:<name>；值 = 连接材料方言
  // 串，永不回显）。
  string credentials_ref = 6;
  string host = 7;
  int32 port = 8;
  // status: pending | running | degraded | stopped。
  string status = 9;
  string created_at = 10;
  string updated_at = 11;
  string last_backup_at = 12;
  // restore_from_backup 是恢复源备份行 id（历史事实：成功/失败都不清位；
  // 在途判定读 restore_state）。
  string restore_from_backup = 13;
  // restore_error 是最近一次恢复失败的事实（失败终态留痕，不再重试）。
  string restore_error = 14;
  map<string, string> settings = 16;
  DatabaseResources resources = 17;
  // restore_state 是恢复显式状态：'' = 无恢复；pending/running = 在途；
  // succeeded/failed = 终态（failed 不再重试；ADR-0039 决策 6 修订）。
  string restore_state = 18;
}

message CreatePubSubRequest {
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 dns 标签（entityid.NamePatternSource 镜像）——pub-<id> DNS 名
  // 与凭证 Secret 名派生的前提。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      expression: "this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63"
    }
  ];
  // engine 必填且值域 = pubsubtemplate 注册表（nats；kafka/redpanda 随 B6）。
  string engine = 3 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // restore_from_backup 是可选恢复源（成功备份行 id；逐流恢复 = 目标
  // 在服后全流循环注入）。
  string restore_from_backup = 4;
  string version = 5;
  map<string, string> settings = 6;
  DatabaseResources resources = 7;
}
message CreatePubSubResponse {
  PubSub pubsub = 1;
  string restore_version_note = 2;
}
message GetPubSubRequest { string id = 1; }
message ResolvePubSubRequest { string project = 1; string name = 2; }
message ResolvePubSubResponse { PubSub pubsub = 1; }
message GetPubSubResponse { PubSub pubsub = 1; }
message ListPubSubsRequest {
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  int64 after_pubsub_seq = 2;
  int32 limit = 3;
}
message ListPubSubsResponse { repeated PubSub pubsubs = 1; }
message DeletePubSubRequest {
  string id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DeletePubSubResponse {}

message TriggerPubSubBackupRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message TriggerPubSubBackupResponse { Backup backup = 1; }
message ListPubSubBackupsRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  int64 after_backup_seq = 2;
  int32 limit = 3;
}
message ListPubSubBackupsResponse { repeated Backup backups = 1; }
message VerifyPubSubBackupRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string backup_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message VerifyPubSubBackupResponse {
  bool ok = 1;
  string digest = 2;
  string error = 3;
}
message DownloadPubSubBackupRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string backup_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
// DownloadPubSubBackupResponse 与 DownloadBackupResponse 同形（裸字节流
// 分块；多成员按 manifest 成员序拼接）。
message DownloadPubSubBackupResponse {
  bytes data = 1;
}

message RotatePubSubPasswordRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message RotatePubSubPasswordResponse { PubSub pubsub = 1; }

// UpdatePubSubRequest 是期望态变更载荷（UpdateDatabaseRequest 同构；本族
// 首批旋钮全 static——无 dynamic 车道。B4c 起入 ConfirmableVerbs 强制集：
// confirmation 是强制确认票，票经 PreviewUpdatePubSub 铸——翻 B4b 的单
// 车道取舍为三家族同构〔design §3.3 确认闭环〕）。
message UpdatePubSubRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  DatabaseSettingsUpdate settings = 2;
  DatabaseResources resources = 3;
  // engine / version 不可变锚（携带非空值即拒 E_INVALID_ARGUMENT）。
  string engine = 4;
  string version = 5;
  // confirmation 是强制确认票（B4c 入 ConfirmableVerbs：预览铸票或 skip
  // 直发；票绑定 update 载荷摘要——UpdateDatabase 同律）。
  optional fleetly.delivery.v1.Confirmation confirmation = 6;
}
message UpdatePubSubResponse {
  PubSub pubsub = 1;
  repeated string static_applied = 2;
  // dynamic_applied 是本拍同步热应用成功的 dynamic 键集（B6a kafka 起本族
  // dynamic 车道在册——UpdateDatabaseResponse.dynamic_applied 同形：kafka
  // 经 kafka-configs.sh 热应用住 KRaft 元数据）。
  repeated string dynamic_applied = 3;
}

// PreviewUpdatePubSubRequest 内嵌同一 Update 载荷（PreviewUpdateDatabase
// 同形：直接字段不含 confirmation——豁免族的形状语义由 confirmguard 钉死）。
// update 缺席由受理面兜底拒 E_INVALID_ARGUMENT。
message PreviewUpdatePubSubRequest {
  UpdatePubSubRequest update = 1;
}
// PreviewUpdatePubSubResponse 是只读预演 + 铸票（PreviewUpdateDatabaseResponse
// 同形；本族首批旋钮全 static——dynamic_keys 恒空、rollout 恒 replace）。
message PreviewUpdatePubSubResponse {
  // settings_changes 是旋钮级 diff（变更键集；复用 DatabaseSettingChange
  // ——族间 diff 行同形，键 = 引擎原生词）。
  repeated DatabaseSettingChange settings_changes = 1;
  DatabaseResources resources_from = 2;
  DatabaseResources resources_to = 3;
  repeated string dynamic_keys = 4;
  repeated string static_keys = 5;
  string rollout = 6;
  // ticket / ticket_expires_in 是 Confirm Ticket（600s 单用途；兑换动词
  // UpdatePubSub）。
  string ticket = 7;
  int32 ticket_expires_in = 8;
}

// —— Bucket Store 家族消息族（B5，ADR-0096 决策 1/8：PubSubsService 同构，
// kind 词差异；无备份字段族——silo 转储挂账）——

// BucketStore 是聚合行回显（凭证值永不出现；host = bkt-<id> 网内 DNS 名、
// port = S3 API 口）。
message BucketStore {
  string id = 1;
  int64 seq = 15;
  string project_id = 2;
  string name = 3;
  string engine = 4;
  string version = 5;
  // credentials_ref 是凭证 Secret 名（bucketstore:<name>；值 = endpoint/
  // access_key/secret_key k=v 方言串，永不回显）。
  string credentials_ref = 6;
  string host = 7;
  int32 port = 8;
  // status: pending | running | degraded | stopped。
  string status = 9;
  string created_at = 10;
  string updated_at = 11;
  map<string, string> settings = 16;
  DatabaseResources resources = 17;
}

message CreateBucketStoreRequest {
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 dns 标签（entityid.NamePatternSource 镜像）——bkt-<id> DNS 名
  // 与凭证 Secret 名派生的前提。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      expression: "this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63"
    }
  ];
  // engine 必填且值域 = bucketstoretemplate 注册表（silo）。
  string engine = 3 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string version = 4;
  map<string, string> settings = 5;
  DatabaseResources resources = 6;
}
message CreateBucketStoreResponse { BucketStore bucket_store = 1; }
message GetBucketStoreRequest { string id = 1; }
message ResolveBucketStoreRequest { string project = 1; string name = 2; }
message ResolveBucketStoreResponse { BucketStore bucket_store = 1; }
message GetBucketStoreResponse { BucketStore bucket_store = 1; }
message ListBucketStoresRequest {
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  int64 after_bucket_store_seq = 2;
  int32 limit = 3;
}
message ListBucketStoresResponse { repeated BucketStore bucket_stores = 1; }
message DeleteBucketStoreRequest {
  string id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DeleteBucketStoreResponse {}

message RotateBucketStorePasswordRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message RotateBucketStorePasswordResponse { BucketStore bucket_store = 1; }

// UpdateBucketStoreRequest 是期望态变更载荷（UpdatePubSubRequest 同构；
// silo v1 零旋钮——settings 面恒空集，resources 是唯一可变轴。入
// ConfirmableVerbs 强制集：confirmation 是强制确认票，票经
// PreviewUpdateBucketStore 铸）。
message UpdateBucketStoreRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  DatabaseSettingsUpdate settings = 2;
  DatabaseResources resources = 3;
  // engine / version 不可变锚（携带非空值即拒 E_INVALID_ARGUMENT）。
  string engine = 4;
  string version = 5;
  // confirmation 是强制确认票（预览铸票或 skip 直发；票绑定 update 载荷
  // 摘要——UpdateDatabase 同律）。
  optional fleetly.delivery.v1.Confirmation confirmation = 6;
}
message UpdateBucketStoreResponse {
  BucketStore bucket_store = 1;
  repeated string static_applied = 2;
}

// PreviewUpdateBucketStoreRequest 内嵌同一 Update 载荷（PreviewUpdatePubSub
// 同形：直接字段不含 confirmation——豁免族的形状语义由 confirmguard 钉死）。
message PreviewUpdateBucketStoreRequest {
  UpdateBucketStoreRequest update = 1;
}
// PreviewUpdateBucketStoreResponse 是只读预演 + 铸票（PreviewUpdatePubSub
// 同形；零旋钮族 settings_changes/dynamic_keys/static_keys 恒空、rollout
// 随资源变更 replace）。
message PreviewUpdateBucketStoreResponse {
  repeated DatabaseSettingChange settings_changes = 1;
  DatabaseResources resources_from = 2;
  DatabaseResources resources_to = 3;
  repeated string dynamic_keys = 4;
  repeated string static_keys = 5;
  string rollout = 6;
  // ticket / ticket_expires_in 是 Confirm Ticket（600s 单用途；兑换动词
  // UpdateBucketStore）。
  string ticket = 7;
  int32 ticket_expires_in = 8;
}

// —— 子资源管理面消息族（B8，ADR-0096 决策 10 / design §4.7：Topic〔kafka
// 协议族〕/Stream〔nats〕属 PubSubsService；Bucket〔silo〕属
// BucketStoresService。声明行 + admin 工具容器收敛——status 三值
// pending|ready|error 由收敛段推进，error 文案在 status_error） ——

// SubResourceChange 是子资源 Update 预演的 diff 行（键 = 引擎原生配置词）。
message SubResourceChange {
  string key = 1;
  string from = 2;
  string to = 3;
}

// Topic 是 kafka 协议族 pubsub 实例内的托管 Topic 声明行（副本因子恒 1——
// 单 broker 事实；目录 note 标注）。
message Topic {
  string id = 1;
  int64 seq = 2;
  string project_id = 3;
  string pubsub_id = 4;
  string name = 5;
  // partitions 期望分区数（引擎约束：只增不减——Update 受理在方言层拒减）。
  int32 partitions = 6;
  // retention_ms 期望 retention.ms（0 = 不管理 = 引擎缺省；负值非法）。
  int64 retention_ms = 7;
  string status = 8;
  string status_error = 9;
  string created_at = 10;
  string updated_at = 11;
}

message CreateTopicRequest {
  // pubsub_id 是父实例锚（冻结/授权归属解析；engine 决定 Topic 面可用性
  // ——kafka 协议族外受理拒）。
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 kafka 主题名值域（[A-Za-z0-9._-]，≤249——受理位镜像方言层校验）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // partitions 缺省 1（受理位钳 1..10000——工具容器面有界）。
  int32 partitions = 3;
  // retention_ms 0 = 不管理（引擎缺省）；>0 时收敛段对照 live 配置 ensure。
  int64 retention_ms = 4;
}
message CreateTopicResponse { Topic topic = 1; }
message GetTopicRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string topic_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message GetTopicResponse { Topic topic = 1; }
message ListTopicsRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  int64 after_topic_seq = 2;
  int32 limit = 3;
}
message ListTopicsResponse { repeated Topic topics = 1; }

message UpdateTopicRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string topic_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // partitions 缺席 = 不变；在场 = 新期望（可增不可减——方言层校验拒）。
  optional int32 partitions = 3;
  // retention_ms 缺席 = 不变；在场 0 = 转不管理。
  optional int64 retention_ms = 4;
  // confirmation 是强制确认票（ConfirmableVerbs：预览铸票或 skip 直发；票
  // 绑 (topic_id + 新期望态) 摘要——digest 前缀 topic=）。
  optional fleetly.delivery.v1.Confirmation confirmation = 5;
}
message UpdateTopicResponse {
  Topic topic = 1;
  // converged_note 披露收敛语义（子资源面无载体滚动——admin 工具容器段
  // 接棒；空 = 无变更）。
  string converged_note = 2;
}
message PreviewUpdateTopicRequest { UpdateTopicRequest update = 1; }
// PreviewUpdateTopicResponse 是只读预演 + 铸票（mint 族；兑换动词
// UpdateTopic——确认档 standard）。
message PreviewUpdateTopicResponse {
  repeated SubResourceChange changes = 1;
  string ticket = 2;
  int32 ticket_expires_in = 3;
}

message DeleteTopicRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string topic_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // confirmation 是强制确认票（wide 档：Topic 删除即数据删除——票经
  // PreviewDeleteTopic 铸，绑删除披露摘要）。
  optional fleetly.delivery.v1.Confirmation confirmation = 3;
}
message DeleteTopicResponse {}
message PreviewDeleteTopicRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string topic_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
// PreviewDeleteTopicResponse 是删除披露行 + 铸票（wide 档；兑换动词
// DeleteTopic）。kafka CLI 无 per-topic 数据量面——data_bytes/data_messages
// 恒 0，disclosure 如实披露不可恢复性。
message PreviewDeleteTopicResponse {
  Topic topic = 1;
  int64 data_bytes = 2;
  int64 data_messages = 3;
  // disclosure 是删除后果文案（Consequences 先行——ADR-0086 wide 档）。
  string disclosure = 4;
  string ticket = 5;
  int32 ticket_expires_in = 6;
}

// Stream 是 nats pubsub 实例内的托管 JetStream Stream 声明行。
message Stream {
  string id = 1;
  int64 seq = 2;
  string project_id = 3;
  string pubsub_id = 4;
  string name = 5;
  repeated string subjects = 6;
  // retention: limits | interest | workqueue（创建后不可变）。
  string retention = 7;
  // storage: file | memory（创建后不可变；memory 流不可快照——备份面拒律
  // 继承）。
  string storage = 8;
  // max_stream_size 期望字节上限（0 = 无上限；可变面）。
  int64 max_stream_size = 9;
  string status = 10;
  string status_error = 11;
  string created_at = 12;
  string updated_at = 13;
}

message CreateStreamRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 nats 流名值域（[A-Za-z0-9_-.>]，≤256——受理位镜像方言层校验）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  repeated string subjects = 3;
  // retention 缺省 limits（limits | interest | workqueue）。
  string retention = 4;
  // storage 缺省 file（file | memory）。
  string storage = 5;
  // max_stream_size 0 = 无上限。
  int64 max_stream_size = 6;
}
message CreateStreamResponse { Stream stream = 1; }
message GetStreamRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string stream_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message GetStreamResponse { Stream stream = 1; }
message ListStreamsRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  int64 after_stream_seq = 2;
  int32 limit = 3;
}
message ListStreamsResponse { repeated Stream streams = 1; }

message UpdateStreamRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string stream_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // subjects 是全量替换语义（读行合并后整集下发；repeated 缺席与空集在
  // proto3 不可分——客户端须在变更 subjects 时携带全集，不变更时缺席）。
  repeated string subjects = 3;
  // max_stream_size 缺席 = 不变；在场 0 = 撤上限。
  optional int64 max_stream_size = 4;
  // confirmation 是强制确认票（digest 前缀 stream=）。
  optional fleetly.delivery.v1.Confirmation confirmation = 5;
}
message UpdateStreamResponse {
  Stream stream = 1;
  string converged_note = 2;
}
message PreviewUpdateStreamRequest { UpdateStreamRequest update = 1; }
// PreviewUpdateStreamResponse 是只读预演 + 铸票（兑换动词 UpdateStream）。
message PreviewUpdateStreamResponse {
  repeated SubResourceChange changes = 1;
  string ticket = 2;
  int32 ticket_expires_in = 3;
}

message DeleteStreamRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string stream_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // confirmation 是强制确认票（wide 档：Stream 删除即数据删除）。
  optional fleetly.delivery.v1.Confirmation confirmation = 3;
}
message DeleteStreamResponse {}
message PreviewDeleteStreamRequest {
  string pubsub_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string stream_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
// PreviewDeleteStreamResponse 是删除披露行 + 铸票（nats state 面——
// data_messages/data_bytes 实测可得）。
message PreviewDeleteStreamResponse {
  Stream stream = 1;
  int64 data_bytes = 2;
  int64 data_messages = 3;
  string disclosure = 4;
  string ticket = 5;
  int32 ticket_expires_in = 6;
}

// Bucket 是 bucket store 实例内的托管 Bucket 声明行（CLI 避撞律：子资源
// 动词组取单数 `bucket`——实体组 `buckets` 已被 Bucket Store 占用）。
message Bucket {
  string id = 1;
  int64 seq = 2;
  string project_id = 3;
  string bucket_store_id = 4;
  string name = 5;
  // quota_bytes 期望 hard quota（0 = 无配额；mcli quota set --size 实测在册
  // ——无挂账）。
  int64 quota_bytes = 6;
  string status = 7;
  string status_error = 8;
  string created_at = 9;
  string updated_at = 10;
}

message CreateBucketRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 S3 桶名值域（3-63 字符 [a-z0-9.-]——受理位镜像方言层校验）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // quota_bytes 0 = 无配额。
  int64 quota_bytes = 3;
}
message CreateBucketResponse { Bucket bucket = 1; }
message GetBucketRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string bucket_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message GetBucketResponse { Bucket bucket = 1; }
message ListBucketsRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  int64 after_bucket_seq = 2;
  int32 limit = 3;
}
message ListBucketsResponse { repeated Bucket buckets = 1; }

message UpdateBucketRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string bucket_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // quota_bytes 缺席 = 不变；在场 0 = 撤配额。
  optional int64 quota_bytes = 3;
  // confirmation 是强制确认票（digest 前缀 bucket=）。
  optional fleetly.delivery.v1.Confirmation confirmation = 4;
}
message UpdateBucketResponse {
  Bucket bucket = 1;
  string converged_note = 2;
}
message PreviewUpdateBucketRequest { UpdateBucketRequest update = 1; }
// PreviewUpdateBucketResponse 是只读预演 + 铸票（兑换动词 UpdateBucket）。
message PreviewUpdateBucketResponse {
  repeated SubResourceChange changes = 1;
  string ticket = 2;
  int32 ticket_expires_in = 3;
}

message DeleteBucketRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string bucket_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // confirmation 是强制确认票（wide 档：删除连带对象数据）。
  optional fleetly.delivery.v1.Confirmation confirmation = 3;
}
message DeleteBucketResponse {}
message PreviewDeleteBucketRequest {
  string bucket_store_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  string bucket_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
// PreviewDeleteBucketResponse 是删除披露行 + 铸票（mcli du 数据量实测可得）。
message PreviewDeleteBucketResponse {
  Bucket bucket = 1;
  int64 data_bytes = 2;
  int64 data_objects = 3;
  string disclosure = 4;
  string ticket = 5;
  int32 ticket_expires_in = 6;
}

// —— Engine Catalog（DataEnginesService，ADR-0094 决策 4 / ADR-0095
// 决策 10；design §2.3）——目录是注册表投影非存储，服务端现场装配。 ——

message ListDataEnginesRequest {}
message ListDataEnginesResponse {
  // engines 按家族再按引擎名排序稳定（database → pubsub → bucketstore）。
  repeated EngineCatalog engines = 1;
}

// EngineCatalog 是单引擎的自描述行：引擎/版本矩阵（含默认与弃用）/旋钮
// schema/端口/能力/许可披露。Console/CLI 创建表单与版本下拉的唯一取值面
// （硬编码引擎常量退役，ADR-0094 决策 4）。
message EngineCatalog {
  // kind 是数据服务类型词面（database | pubsub | bucketstore）。
  string kind = 1;
  string engine = 2;
  // dialect 是方言自名（database 家族 = engine 名；协议族兼容互示自
  // pubsub 家族起分叉——engine 名 = 实现名，不造合成名，ADR-0093）。
  string dialect = 3;
  // versions 是在册版本矩阵（旧→新声明序）。
  repeated EngineVersionInfo versions = 4;
  // knobs 是旋钮白名单 schema（表单驱动，ADR-0095 决策 10）。
  repeated EngineKnob knobs = 5;
  int32 port = 6;
  EngineCapabilities capabilities = 7;
  // license_note 是许可披露（空 = 无披露义务；redpanda BSL 类自 pubsub
  // 家族起出现，托管合规裁定归运营方）。
  string license_note = 8;
  // note 是子资源/运维标注（空 = 无标注；B8 起在册——kafka 协议族披露
  // 「Topic 副本恒 1」的单 broker 事实，创建表单与目录面露出）。
  string note = 9;
}

// EngineVersionInfo 是在册版本条目的目录投影（ADR-0094 决策 1 三层解耦的
// 用户面层：id 是 major 短名；tag/digest 是平台层不出目录）。
message EngineVersionInfo {
  // id 是用户面 major 短名（CreateDatabaseRequest.version 值域；pgvector
  // 复合短名如 0.8-pg18）。
  string id = 1;
  // default 标记缺省版本（每引擎恰一真）。
  bool default = 2;
  // deprecated 标记弃用（拒全新建、存量续跑、同版本带 restore 的重建
  // 放行——灾备义，ADR-0094 决策 6）。
  bool deprecated = 3;
  // note 是弃用理由/移除窗口（建议 = 转弃用起两个发布周期）。
  string note = 4;
}

// EngineKnob 是旋钮 schema 的目录投影（ADR-0095 决策 1/3：键 = 引擎原生
// 词，不发明中间名；kind→控件映射、category 分组、class 徽标 instant/
// rolling 由 Console 消费）。字段名避让 proto 词法（enum→enum_values、
// default→default_value）。
message EngineKnob {
  string key = 1;
  // kind: bool | int | enum | duration | size。
  string kind = 2;
  // min/max 是范围界（字符串承载，受理位按 kind 解析；空 = 无界）。
  string min = 3;
  string max = 4;
  // enum_values 是 kind=enum 的合法值集。
  repeated string enum_values = 5;
  // default_value 是引擎原生缺省（回显面；渲染不因缺省补行）。
  string default_value = 6;
  // class: static（重启类=rolling）| dynamic（运行时类=instant）。
  string class = 7;
  // category 是表单分组词（persistence/memory/connections…）。
  string category = 8;
}

// EngineCapabilities 是能力自描述（受理面与 UI 消费的诚实缺省——未开面
// 恒 false，不虚报）。
message EngineCapabilities {
  // backup：转储/恢复渲染面在册。
  bool backup = 1;
  // migrate：跨引擎统一转储契约（design §4.5，随后续批次）。
  bool migrate = 2;
  // browse：数据浏览器方言映射在册（ADR-0051）。
  bool browse = 3;
  // restore_compat：同引擎跨版本恢复受理（ADR-0094 决策 5 版本轴规则）。
  bool restore_compat = 4;
}

message Network {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // egress_none 是弱隔离声明（swarm v1：出网不阻断，明示）。
  bool egress_none = 4;
  string created_at = 5;
}

message CreateNetworkRequest {
  // project_id 必填：Network 的父 Project（受理位父存活校验的锚）。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 是 dns 标签（小写字母数字与连字符，首尾字母数字，≤63 字符，
  // ADR-0070 决策 4）——编排器网络名与受管挂靠面安全的前提。正则字面
  // 与长度界是 entityid.NamePatternSource / MaxNameLen 的镜像，字节一致
  // 由 entityid 包的 descriptor 对齐测试执法；空值同报形状（本字段无
  // required 规则，空名不接受）。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      expression: "this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63"
    }
  ];
  // egress_none 是弱隔离声明（swarm v1：出网不阻断，明示）。
  bool egress_none = 3;
}
message CreateNetworkResponse { Network network = 1; }
message ListNetworksRequest {
  string project_id = 1;
  // after_name 游标（上一页末条 name；空 = 首页）。游标轴 = 项目内 name
  // 字典序升序（既有排序轴不变；ADR-0026 after_* + limit 惯例）。
  string after_name = 2;
  int32 limit = 3;
}
message ListNetworksResponse { repeated Network networks = 1; }

// RebuildNetworkResponse 携带网络引用与本次执行的载体计数（幂等重跑的
// 快速路径两者为 0——已 attachable 且标签在位即零扰动返回）。
message RebuildNetworkRequest {
  // project_id 必填：重建目标网络的归属 Project。
  string project_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // name 必填：项目内目标网络名。
  string name = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message RebuildNetworkResponse {
  Network network = 1;
  // detached/reattached 是本次被摘除又加回的附着载体数。
  int32 detached = 2;
  int32 reattached = 3;
}

// NetworkPeer 是一条跨 Project 挂靠声明（ADR-0013 附录 A.1）：挂靠方
// 项目 declare（pending）→ 接收方 approve（approved）→ 任一侧 revoke
//（revoked；重新挂靠走新声明行）。network_* 是接收方（网络归属方）读
// 投影；peer_project_id 是挂靠方（声明方）项目。
message NetworkPeer {
  string id = 1;
  // seq 是创建序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 10;
  string network_id = 2;
  string network_name = 3;
  string network_project_id = 4;
  string peer_project_id = 5;
  // state: pending | approved | revoked（kebab，与 Task/Schedule 状态值
  // 拼写冻结同款）。
  string state = 6;
  string created_at = 7;
  string updated_at = 8;
  string approved_at = 9;
}

message DeclareNetworkPeerRequest {
  // network_id 必填：目标网络行（接收方 Project 的活跃网络）。
  string network_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // peer_project_id 必填：挂靠方项目（声明方）。同项目挂靠由服务内交叉
  // 检查拒绝（项目内挂靠走 project-local 网络名）。
  string peer_project_id = 2 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DeclareNetworkPeerResponse { NetworkPeer peer = 1; }
message ApproveNetworkPeerRequest { string id = 1; }
message ApproveNetworkPeerResponse { NetworkPeer peer = 1; }
message RevokeNetworkPeerRequest { string id = 1; }
message RevokeNetworkPeerResponse { NetworkPeer peer = 1; }
message GetNetworkPeerRequest { string id = 1; }
message GetNetworkPeerResponse { NetworkPeer peer = 1; }
message ListNetworkPeersRequest {
  // network_id 过滤（接收方视图：谁挂在我的网上）；peer_project_id 过滤
  //（挂靠方视图：我挂在哪里）；两者都空 = 全部。
  string network_id = 1;
  string peer_project_id = 2;
  // after_peer_seq 游标（上一页末条 seq（0 = 首页）。
  int64 after_peer_seq = 3;
  int32 limit = 4;
}
message ListNetworkPeersResponse { repeated NetworkPeer peers = 1; }
