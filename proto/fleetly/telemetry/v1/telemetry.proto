syntax = "proto3";

// Telemetry 上下文（领域模型 §2）：Event 流与日志查询面（日志/指标采集
// 侧由 Logging/Metrics Capability 承载，本面是查询入口）。
package fleetly.telemetry.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/telemetry/v1;telemetryv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/policy.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// EventsService：Outbox 读路径（F0.23 列表；F1.2 订阅面——gRPC 流 + SSE
//（票据换键）+ 断档 410 + 快照重同步基准；保留窗与断档口径见 ADR-0026）。
service EventsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = { get: "/v1/events" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["events:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // StreamEvents 是订阅面（gRPC server-streaming；Console/Agent 的等待原语
  // 数据源）。follow=false 只重放保留窗随后收流；follow=true 持续跟随直至
  // 客户端取消。after_seq 落在保留窗外 → E_EVENTS_GONE（410，重同步）。
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse) {
    option (google.api.http) = { get: "/v1/events/stream" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["events:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // GetEventStatus 是断档判定与快照重同步的基准面：earliest_seq 定保留窗
  // 起点（after_seq < earliest 即断档），last_seq 定重同步后的新游标。
  rpc GetEventStatus(GetEventStatusRequest) returns (GetEventStatusResponse) {
    option (google.api.http) = { get: "/v1/events/status" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["events:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // IssueEventTicket 为 SSE 订阅路径换一次性短时票据（ADR-0026：浏览器
  // EventSource 不能设自定义头——Bearer 换秒级 TTL 单用途票据，SSE 以
  // query 参数携带；限订阅路径，泄漏面受控）。
  rpc IssueEventTicket(IssueEventTicketRequest) returns (IssueEventTicketResponse) {
    option (google.api.http) = { post: "/v1/events/ticket" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["events:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// LogsService：日志查询双径入口（ADR-0040）：无 text = Runtime 实时路径
//（follow/since/tail，集群面）；text = 持久化检索路径（VictoriaLogs
// 保留窗 + 全文过滤）。Logging 面停用时检索路径精确失败。
service LogsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse) {
    option (google.api.http) = { get: "/v1/logs" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["logs:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// MetricsService：指标查询面（ADR-0041）。
//   - QueryMetrics 是平台管理员诊断面：原始 PromQL 直通，仅平台管理员可
//     调用（存储是平台单租户，服务端无法对用户表达式做行级约束）；
//   - QueryScopedMetrics 是租户图表面：服务端按 scope + metric 白名单构造
//     固定 PromQL，调用方无法指定表达式；行级授权在本 handler。
//
// Metrics 面停用时两者均精确失败。
service MetricsService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  // QueryMetrics 原样透传 PromQL（平台管理员诊断；member 调用 E_FORBIDDEN）。
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse) {
    option (google.api.http) = { get: "/v1/metrics" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["metrics:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // QueryScopedMetrics 按 App/Database 作用域查固定指标模板。
  // 授权：metrics:read + app/database 所在 Project 的行级 Team 比对。
  rpc QueryScopedMetrics(QueryScopedMetricsRequest) returns (QueryScopedMetricsResponse) {
    option (google.api.http) = { get: "/v1/metrics/scoped" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["metrics:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// AlertingService：阈值告警规则 + 通知通道（ADR-0041 决策 3/4）。通道是
// 平台级配置（channels 资源）；规则按 App 归属行级授权（alerts 资源）。
service AlertingService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  // CreateNotificationChannel 登记一条通知通道（webhook/telegram；配置
  // age 信封入库——URL/token 只写不读）。
  rpc CreateNotificationChannel(CreateNotificationChannelRequest) returns (CreateNotificationChannelResponse) {
    option (google.api.http) = { post: "/v1/channels" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["channels:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // TestNotificationChannel 即时发一条测试载荷（通道验收锚；配置错误
  // 原样上抛）。
  rpc TestNotificationChannel(TestNotificationChannelRequest) returns (TestNotificationChannelResponse) {
    option (google.api.http) = { post: "/v1/channels/{channel_id}/test" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["channels:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse) {
    option (google.api.http) = { get: "/v1/channels" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["channels:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc DeleteNotificationChannel(DeleteNotificationChannelRequest) returns (DeleteNotificationChannelResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["channels:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // CreateAlertRule 登记一条 per-App 阈值规则（评估在采集遍内原生完成）。
  rpc CreateAlertRule(CreateAlertRuleRequest) returns (CreateAlertRuleResponse) {
    option (google.api.http) = { post: "/v1/alerts/rules" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["alerts:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse) {
    option (google.api.http) = { get: "/v1/alerts/rules" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["alerts:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse) {
    option (google.api.http) = { delete: "/v1/alerts/rules/{rule_id}" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["alerts:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListAlertStates 是现行告警状态面（含系统内置规则行）。
  rpc ListAlertStates(ListAlertStatesRequest) returns (ListAlertStatesResponse) {
    option (google.api.http) = { get: "/v1/alerts" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["alerts:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// Event 是 Outbox 行形态（单调 seq；payload 是 JSON 字节文本）。
message Event {
  int64 seq = 1;
  string name = 2;
  string aggregate = 3;
  string aggregate_id = 4;
  string payload = 5;
  string created_at = 6;
}

message ListEventsRequest {
  // after_seq 是游标（返回 seq 之后的事件，升序）。
  int64 after_seq = 1;
  int32 limit = 2;
}
message ListEventsResponse {
  repeated Event events = 1;
  int64 last_seq = 2;
}

message StreamEventsRequest {
  // after_seq 是游标（0 = 从保留窗最早开始；落在保留窗外 → 410）。
  int64 after_seq = 1;
  // follow 持续跟随新事件（直至取消）；false = 重放保留窗后收流。
  bool follow = 2;
}

message StreamEventsResponse {
  // event 是本帧事件（与 ListEvents 同一 Event 形态）。
  Event event = 1;
}

message GetEventStatusRequest {}

message GetEventStatusResponse {
  // earliest_seq 是保留窗内最早事件 seq（断档判定锚：0 = 空表/全在窗内）。
  int64 earliest_seq = 1;
  // last_seq 是当前最大 seq（快照重同步基准：重读列表后以它为新游标）。
  int64 last_seq = 2;
}

message IssueEventTicketRequest {}

message IssueEventTicketResponse {
  // ticket 是一次性短时票据（秒级 TTL、单用途、限 SSE 订阅路径）。
  string ticket = 1;
  // expires_in 是票据存活秒数。
  int32 expires_in = 2;
}

message StreamLogsRequest {
  string app_id = 1;
  string process = 2;
  // tail_lines 尾部行数（0 = 全量最近缓冲）；follow 持续跟随。
  int64 tail_lines = 3;
  bool follow = 4;
  // since/until 是时间窗（RFC3339；空 = 不限）。实时路径（无 text）窗口
  // 作用于最近缓冲；text 检索路径窗口作用于保留窗（ADR-0040 双径）。
  string since = 5;
  string until = 6;
  // text 是文本过滤（ADR-0040 检索路径）：非空时经持久化日志存储全保留窗
  // 匹配；与 follow 组合 = 实时尾随检索（≥5s 批汇延迟）。
  string text = 7;
  // database_id 是 Database 域寻址（ADR-0029 域分立）：库载体日志通路，
  // 与 app_id/run_id 三轴互斥（IA v3 T8——Service 层 NamespaceRef 本有
  // Database 域，本字段补 API 入口）。
  string database_id = 8;
  // run_id 是 Run 域寻址（ADR-0025 决策 4 词汇分立）：单 Run 载体日志，
  // 与 app_id/database_id 三轴互斥；归属 Task 经行链解析（NamespaceRef
  // .Task 轴，拒塞 .App——同款词汇纪律）。
  string run_id = 9;
  // processes 是多进程过滤（app 轴专用；ADR-0060 用户裁决，Console 日志
  // 工作台多选承载）：与单值 process 并集去重后收敛为 Workload ID 集
  // （投影公式 engine.WorkloadID，空 = 本 App 全部 Workload）；database/
  // run 轴拒收（载体单 Workload）。gateway 传形 = 重复键
  // （processes=a&processes=b）——逗号形不分裂（REST 多进程测试钉此语义）。
  repeated string processes = 10;
  // containers 是多实例过滤（ADR-0067 实例锚定日志）：载体归因标识直锚
  // （swarm = task ID，k3s = pod 名——StreamLogsResponse.container 同源
  // 词汇，无派生公式），对该寻址轴收敛出的载体集做交集；空 = 全部副本
  // 容器。三轴通用（载体身份过滤不依赖 App 派生）；条目非空校验与
  // processes 同纪律（精确拒绝）。gateway 传形 = 重复键。
  repeated string containers = 11;
}

// StreamLogsResponse 一帧日志（workload 标注归属；时间 RFC3339；container
// 是载体归因标识——swarm 形态为 task ID，ADR-0040）。
message StreamLogsResponse {
  string workload_id = 1;
  string container = 2;
  string node = 3;
  string time = 4;
  bytes line = 5;
}

// ---- Metrics（ADR-0041）----

message QueryMetricsRequest {
  // query 是 PromQL（原样透传；平台管理员诊断面，服务端不做行级约束）。
  // 必填：空查询无从起查。
  string query = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // start/end 是时间窗（RFC3339；空 end = 现在，空 start = end 前 1h）。
  string start = 2;
  string end = 3;
  // step_seconds 是采样步长（0 = 缺省 15s）。
  int64 step_seconds = 4;
}

message QueryMetricsResponse {
  repeated MetricSeries series = 1;
}

message MetricSeries {
  map<string, string> labels = 1;
  repeated MetricPoint points = 2;
}

message MetricPoint {
  string time = 1;
  double value = 2;
}

// QueryScopedMetricsRequest 是租户图表面：调用方只给 scope（App、Database
// 或 Project 恰一）+ 指标白名单 + 时间窗，PromQL 由服务端固定模板构造
//（H8 设计文档 §5.1/§5.3）。
message QueryScopedMetricsRequest {
  // scope 互斥：app_id/database_id/project_id 恰一非空。
  option (buf.validate.message).cel = {
    id: "queryscopedmetrics.scope_exactly_one"
    message: "exactly one of app_id, database_id or project_id must be set"
    expression: "(this.app_id != '' ? 1 : 0) + (this.database_id != '' ? 1 : 0) + (this.project_id != '' ? 1 : 0) == 1"
  };
  // app_id/database_id/project_id 恰一非空（scope 互斥）。project scope 的
  // 指标白名单只有 cpu_cores/memory_working_set_bytes：project 汇总没有
  // 明确的 CPU 分母（cpu_percent 在受理面 E_INVALID_ARGUMENT），process
  // 维度也只在 app scope 存在。
  string app_id = 1;
  string database_id = 2;
  // metric 白名单：cpu_percent | cpu_cores | memory_working_set_bytes
  //（与告警规则 metric 词表同形；非法值在受理面 E_INVALID_ARGUMENT）。
  string metric = 3 [
    (buf.validate.field).cel = {
      id: "queryscopedmetrics.metric_vocab"
      message: "metric must be one of cpu_percent, cpu_cores, memory_working_set_bytes"
      expression: "this in ['cpu_percent', 'cpu_cores', 'memory_working_set_bytes']"
    }
  ];
  // process 仅 app scope 可用；小写 dns 形态（与 Process 名字符集同源）。
  string process = 4;
  // start/end 是 RFC3339；空 end = now，空 start = end 前 1h（与 raw 同）。
  string start = 5;
  string end = 6;
  // step_seconds 是请求步长；0 = 服务端按窗口自动，实际值会被钳制。
  int64 step_seconds = 7;
  // project_id 是 project scope 的聚合轴（本队行级授权；成员可查本队）。
  string project_id = 8;
}

message QueryScopedMetricsResponse {
  repeated MetricSeries series = 1;
  // truncated 表示命中序列数超过服务端上限，返回的是前 N 条。
  bool truncated = 2;
  // series_total 是截断前的命中序列数（未截断 = len(series)）。
  int32 series_total = 3;
}

// ---- Alerting（ADR-0041）----

message NotificationChannel {
  string id = 1;
  string name = 2;
  // kind: webhook | telegram（值域见 CONTEXT.md Notification Channel 词条）。
  string kind = 3;
  bool enabled = 4;
  // last_failure 是最近一次派发失败摘要（空 = 无失败/未派发过；配置载荷
  // 永不回显——只回 id/name/kind 形态，凭证单向）。
  string last_failure = 5;
  string created_at = 6;
}

message CreateNotificationChannelRequest {
  // name 是通道名（全局唯一；人类引用锚）——dns 标签形态（小写字母数字
  // 与连字符，首尾字母数字，≤63 字符）是可读 id base 与派生名安全的前提。
  // 正则字面与长度界是 entityid.NamePatternSource / MaxNameLen 的镜像
  //（proto 无法引用 Go 常量），字节一致由 entityid 包的 descriptor 对齐
  // 测试执法；空值报 required（本字段必填）。
  string name = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "string.dns_label"
      message: "must be a dns label (lowercase letters, digits, hyphens; start and end alphanumeric, e.g. \"web\" or \"nightly-backup\")"
      expression: "this.size() == 0 || (this.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && this.size() <= 63)"
    }
  ];
  // kind: webhook | telegram（值域见 CONTEXT.md Notification Channel 词条；
  // 值域执法在服务内——文案带收到的原值回显）。
  string kind = 2;
  // webhook 形态：url 是接收端点（可含凭证查询串——age 信封入库）。
  string url = 3;
  // telegram 形态：bot_token 与 chat_id（age 信封入库）。
  string bot_token = 4;
  string chat_id = 5;
}

message CreateNotificationChannelResponse {
  NotificationChannel channel = 1;
}

message TestNotificationChannelRequest {
  // channel_id 必填：目标通道行。
  string channel_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}

message TestNotificationChannelResponse {
  // delivered 是送达回执（false + error 文本 = 配置/网络面失败）。
  bool delivered = 1;
  string error = 2;
}

message ListNotificationChannelsRequest {}

message ListNotificationChannelsResponse {
  repeated NotificationChannel channels = 1;
}

message DeleteNotificationChannelRequest {
  // channel_id 必填：目标通道行。
  string channel_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}

message DeleteNotificationChannelResponse {}

message AlertRule {
  string id = 1;
  string app_id = 2;
  // metric: cpu_percent | memory_working_set_bytes（值域冻结）。
  string metric = 3;
  double threshold = 4;
  // for_seconds 是持续窗（连续越限 ≥ 本值才迁移 firing；0 = 立即；
  // 采样近似语义见 ADR-0041）。
  int64 for_seconds = 5;
  bool enabled = 6;
  // state: ok | firing（现行评估态）。
  string state = 7;
  string state_since = 8;
  string created_at = 9;
}

message CreateAlertRuleRequest {
  // app_id 必填：规则挂靠的 App（行级授权锚）。
  string app_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
  // metric: cpu_percent | memory_working_set_bytes（值域冻结；值域执法
  // 在服务内——文案带收到的原值回显）。
  string metric = 2;
  // threshold 是越限阈值（非负；0 = 任何达标观测即越限）。
  double threshold = 3 [
    (buf.validate.field).cel = {
      id: "num.non_negative"
      message: "must not be negative"
      expression: "this >= 0"
    }
  ];
  // for_seconds 是持续窗（连续越限 ≥ 本值才迁移 firing；0 = 立即；
  // 采样近似语义见 ADR-0041）。
  int64 for_seconds = 4;
}

message CreateAlertRuleResponse {
  AlertRule rule = 1;
}

message ListAlertRulesRequest {
  // app_id 过滤（空 = 全部）。
  string app_id = 1;
}

message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
}

message DeleteAlertRuleRequest {
  // rule_id 必填：目标规则行。
  string rule_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}

message DeleteAlertRuleResponse {}

message AlertState {
  string rule_id = 1;
  string app_id = 2;
  string metric = 3;
  string state = 4;
  string state_since = 5;
  // observed_value 是最近一次评估值（firing 判定依据；NaN = 无样本）。
  double observed_value = 6;
  // system 标记内置规则行（platform-offsite-backup；不可删）。
  bool system = 7;
}

message ListAlertStatesRequest {}

message ListAlertStatesResponse {
  repeated AlertState states = 1;
}
