syntax = "proto3";

// Telemetry 上下文（领域模型 §2）：Event 流与日志查询面（日志/指标采集
// 侧由 Logging/Metrics Capability 承载，本面是查询入口）。
package fleetly.telemetry.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/telemetry/v1;telemetryv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// EventsService：Outbox 读路径（F0.23 列表；F1.2 订阅面——gRPC 流 + SSE
//（票据换键）+ 断档 410 + 快照重同步基准；保留窗与断档口径见 ADR-0026）。
service EventsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = { get: "/v1/events" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "events" op: SCOPE_OP_READ }
    };
  }

  // StreamEvents 是订阅面（gRPC server-streaming；Console/Agent 的等待原语
  // 数据源）。follow=false 只重放保留窗随后收流；follow=true 持续跟随直至
  // 客户端取消。after_seq 落在保留窗外 → E_EVENTS_GONE（410，重同步）。
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse) {
    option (google.api.http) = { get: "/v1/events/stream" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "events" op: SCOPE_OP_READ }
    };
  }

  // GetEventStatus 是断档判定与快照重同步的基准面：earliest_seq 定保留窗
  // 起点（after_seq < earliest 即断档），last_seq 定重同步后的新游标。
  rpc GetEventStatus(GetEventStatusRequest) returns (GetEventStatusResponse) {
    option (google.api.http) = { get: "/v1/events/status" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "events" op: SCOPE_OP_READ }
    };
  }

  // IssueEventTicket 为 SSE 订阅路径换一次性短时票据（ADR-0026：浏览器
  // EventSource 不能设自定义头——Bearer 换秒级 TTL 单用途票据，SSE 以
  // query 参数携带；限订阅路径，泄漏面受控）。
  rpc IssueEventTicket(IssueEventTicketRequest) returns (IssueEventTicketResponse) {
    option (google.api.http) = { post: "/v1/events/ticket" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "events" op: SCOPE_OP_READ }
    };
  }
}

// LogsService：日志查询双径入口（ADR-0040）：无 text = Runtime 实时路径
//（follow/since/tail，集群面）；text = 持久化检索路径（VictoriaLogs
// 保留窗 + 全文过滤）。Logging 面停用时检索路径精确失败。
service LogsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse) {
    option (google.api.http) = { get: "/v1/logs" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "logs" op: SCOPE_OP_READ }
    };
  }
}

// MetricsService：指标查询面（ADR-0041）：PromQL 透传（Console F2.6 图表
// 的数据源；CLI 诊断面）。Metrics 面停用时精确失败。行级隔离由调用方
// 查询构造承载（App 域标签过滤）——存储是平台单租户。
service MetricsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse) {
    option (google.api.http) = { get: "/v1/metrics" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "metrics" op: SCOPE_OP_READ }
    };
  }
}

// AlertingService：阈值告警规则 + 通知通道（ADR-0041 决策 3/4）。通道是
// 平台级配置（channels 资源）；规则按 App 归属行级授权（alerts 资源）。
service AlertingService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // CreateNotificationChannel 登记一条通知通道（webhook/telegram；配置
  // age 信封入库——URL/token 只写不读）。
  rpc CreateNotificationChannel(CreateNotificationChannelRequest) returns (CreateNotificationChannelResponse) {
    option (google.api.http) = { post: "/v1/channels" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "channels" op: SCOPE_OP_WRITE }
    };
  }
  // TestNotificationChannel 即时发一条测试载荷（通道验收锚；配置错误
  // 原样上抛）。
  rpc TestNotificationChannel(TestNotificationChannelRequest) returns (TestNotificationChannelResponse) {
    option (google.api.http) = { post: "/v1/channels/{channel_id}/test" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "channels" op: SCOPE_OP_WRITE }
    };
  }
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse) {
    option (google.api.http) = { get: "/v1/channels" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "channels" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteNotificationChannel(DeleteNotificationChannelRequest) returns (DeleteNotificationChannelResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "channels" op: SCOPE_OP_WRITE }
    };
  }
  // CreateAlertRule 登记一条 per-App 阈值规则（评估在采集遍内原生完成）。
  rpc CreateAlertRule(CreateAlertRuleRequest) returns (CreateAlertRuleResponse) {
    option (google.api.http) = { post: "/v1/alerts/rules" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "alerts" op: SCOPE_OP_WRITE }
    };
  }
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse) {
    option (google.api.http) = { get: "/v1/alerts/rules" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "alerts" op: SCOPE_OP_READ }
    };
  }
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse) {
    option (google.api.http) = { delete: "/v1/alerts/rules/{rule_id}" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "alerts" op: SCOPE_OP_WRITE }
    };
  }
  // ListAlertStates 是现行告警状态面（含系统内置规则行）。
  rpc ListAlertStates(ListAlertStatesRequest) returns (ListAlertStatesResponse) {
    option (google.api.http) = { get: "/v1/alerts" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "alerts" op: SCOPE_OP_READ }
    };
  }
}

// Event 是 Outbox 行形态（单调 seq；payload 是 JSON 字节文本）。
message Event {
  int64 seq = 1;
  string name = 2;
  string aggregate = 3;
  string aggregate_id = 4;
  string payload = 5;
  string created_at = 6;
}

message ListEventsRequest {
  // after_seq 是游标（返回 seq 之后的事件，升序）。
  int64 after_seq = 1;
  int32 limit = 2;
}
message ListEventsResponse {
  repeated Event events = 1;
  int64 last_seq = 2;
}

message StreamEventsRequest {
  // after_seq 是游标（0 = 从保留窗最早开始；落在保留窗外 → 410）。
  int64 after_seq = 1;
  // follow 持续跟随新事件（直至取消）；false = 重放保留窗后收流。
  bool follow = 2;
}

message StreamEventsResponse {
  // event 是本帧事件（与 ListEvents 同一 Event 形态）。
  Event event = 1;
}

message GetEventStatusRequest {}

message GetEventStatusResponse {
  // earliest_seq 是保留窗内最早事件 seq（断档判定锚：0 = 空表/全在窗内）。
  int64 earliest_seq = 1;
  // last_seq 是当前最大 seq（快照重同步基准：重读列表后以它为新游标）。
  int64 last_seq = 2;
}

message IssueEventTicketRequest {}

message IssueEventTicketResponse {
  // ticket 是一次性短时票据（秒级 TTL、单用途、限 SSE 订阅路径）。
  string ticket = 1;
  // expires_in 是票据存活秒数。
  int32 expires_in = 2;
}

message StreamLogsRequest {
  string app_id = 1;
  string process = 2;
  // tail_lines 尾部行数（0 = 全量最近缓冲）；follow 持续跟随。
  int64 tail_lines = 3;
  bool follow = 4;
  // since/until 是时间窗（RFC3339；空 = 不限）。实时路径（无 text）窗口
  // 作用于最近缓冲；text 检索路径窗口作用于保留窗（ADR-0040 双径）。
  string since = 5;
  string until = 6;
  // text 是文本过滤（ADR-0040 检索路径）：非空时经持久化日志存储全保留窗
  // 匹配；与 follow 组合 = 实时尾随检索（≥5s 批汇延迟）。
  string text = 7;
}

// StreamLogsResponse 一帧日志（workload 标注归属；时间 RFC3339；container
// 是载体归因标识——swarm 形态为 task ID，ADR-0040）。
message StreamLogsResponse {
  string workload_id = 1;
  string container = 2;
  string node = 3;
  string time = 4;
  bytes line = 5;
}

// ---- Metrics（ADR-0041）----

message QueryMetricsRequest {
  // query 是 PromQL（透传；App 域过滤经 container_label_fleetly_ns_*
  // 序列标签——CLI/Console 侧构造）。
  string query = 1;
  // start/end 是时间窗（RFC3339；空 end = 现在，空 start = end 前 1h）。
  string start = 2;
  string end = 3;
  // step_seconds 是采样步长（0 = 缺省 15s）。
  int64 step_seconds = 4;
}

message QueryMetricsResponse {
  repeated MetricSeries series = 1;
}

message MetricSeries {
  map<string, string> labels = 1;
  repeated MetricPoint points = 2;
}

message MetricPoint {
  string time = 1;
  double value = 2;
}

// ---- Alerting（ADR-0041）----

message NotificationChannel {
  string id = 1;
  string name = 2;
  // kind: webhook | telegram（值域见 CONTEXT.md Notification Channel 词条）。
  string kind = 3;
  bool enabled = 4;
  // last_failure 是最近一次派发失败摘要（空 = 无失败/未派发过；配置载荷
  // 永不回显——只回 id/name/kind 形态，凭证单向）。
  string last_failure = 5;
  string created_at = 6;
}

message CreateNotificationChannelRequest {
  // name 是通道名（全局唯一；人类引用锚）。
  string name = 1;
  string kind = 2;
  // webhook 形态：url 是接收端点（可含凭证查询串——age 信封入库）。
  string url = 3;
  // telegram 形态：bot_token 与 chat_id（age 信封入库）。
  string bot_token = 4;
  string chat_id = 5;
}

message CreateNotificationChannelResponse {
  NotificationChannel channel = 1;
}

message TestNotificationChannelRequest {
  string channel_id = 1;
}

message TestNotificationChannelResponse {
  // delivered 是送达回执（false + error 文本 = 配置/网络面失败）。
  bool delivered = 1;
  string error = 2;
}

message ListNotificationChannelsRequest {}

message ListNotificationChannelsResponse {
  repeated NotificationChannel channels = 1;
}

message DeleteNotificationChannelRequest {
  string channel_id = 1;
}

message DeleteNotificationChannelResponse {}

message AlertRule {
  string id = 1;
  string app_id = 2;
  // metric: cpu_percent | memory_working_set_bytes（值域冻结）。
  string metric = 3;
  double threshold = 4;
  // for_seconds 是持续窗（连续越限 ≥ 本值才迁移 firing；0 = 立即；
  // 采样近似语义见 ADR-0041）。
  int64 for_seconds = 5;
  bool enabled = 6;
  // state: ok | firing（现行评估态）。
  string state = 7;
  string state_since = 8;
  string created_at = 9;
}

message CreateAlertRuleRequest {
  string app_id = 1;
  string metric = 2;
  double threshold = 3;
  int64 for_seconds = 4;
}

message CreateAlertRuleResponse {
  AlertRule rule = 1;
}

message ListAlertRulesRequest {
  // app_id 过滤（空 = 全部）。
  string app_id = 1;
}

message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
}

message DeleteAlertRuleRequest {
  string rule_id = 1;
}

message DeleteAlertRuleResponse {}

message AlertState {
  string rule_id = 1;
  string app_id = 2;
  string metric = 3;
  string state = 4;
  string state_since = 5;
  // observed_value 是最近一次评估值（firing 判定依据；NaN = 无样本）。
  double observed_value = 6;
  // system 标记内置规则行（platform-offsite-backup；不可删）。
  bool system = 7;
}

message ListAlertStatesRequest {}

message ListAlertStatesResponse {
  repeated AlertState states = 1;
}
