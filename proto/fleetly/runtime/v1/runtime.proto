syntax = "proto3";

// Runtime 上下文（领域模型 §2）：集群观测与节点运维面（Node/Enrollment）。
package fleetly.runtime.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/runtime/v1;runtimev1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

service NodesService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = { get: "/v1/nodes" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "nodes" op: SCOPE_OP_READ }
    };
  }
  // EnrollNode 输出工作节点加入材料（F0.20：节点零平台安装物）。活 join
  // token 等价集群成员权（不可逆），档位是 platform:admin（C3 收紧：
  // nodes:admin 只覆盖可逆运维面，不得白送集群钥匙）；rotate 先轮换
  // 全部 join token（泄漏处置）再返回新材料。
  rpc EnrollNode(EnrollNodeRequest) returns (EnrollNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/enroll" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "platform" op: SCOPE_OP_ADMIN }
    };
  }
  // 节点运维三动词（F0.19 RuntimeAdmin 面）：平台节点 ID 为锚；可逆的
  // 调度控制走 nodes write 档。
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node_id}/drain" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "nodes" op: SCOPE_OP_WRITE }
    };
  }
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node_id}/cordon" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "nodes" op: SCOPE_OP_WRITE }
    };
  }
  rpc UncordonNode(UncordonNodeRequest) returns (UncordonNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node_id}/uncordon" body: "*" };
    option (grpcapi.v1.method_auth) = {
      access: ACCESS_LEVEL_SERVER
      api_key_scope: { resource: "nodes" op: SCOPE_OP_WRITE }
    };
  }
}

// Node 是观测缓存行（非权威；节点 ID 永不复用）。
message Node {
  string platform_id = 1;
  string carrier_id = 2;
  string hostname = 3;
  string role = 4;
  bool available = 5;
  string first_seen_at = 6;
  string last_seen_at = 7;
}

message ListNodesRequest {
  // after_node_id 游标（上一页末条 platform_id；空 = 首页）。nodes 是
  // 观测缓存表（非权威），无 ULID 主键——游标轴 = platform_id 字典序
  // 升序（既有响应序不变；ADR-0026 after_* + limit 惯例）。
  string after_node_id = 1;
  int32 limit = 2;
}
message ListNodesResponse { repeated Node nodes = 1; }
message EnrollNodeRequest {
  // rotate 先轮换全部 join token（worker+manager；泄漏处置：旧材料即刻
  // 失效）再返回新材料。
  bool rotate = 1;
}
message EnrollNodeResponse {
  // join_command 是工作节点完整加入命令（swarm join 形态）。
  string join_command = 1;
}

// 节点运维动词以平台节点 ID 为锚（响应无数据面：结果即动作本身）。
message DrainNodeRequest {
  // node_id 是平台节点 ID（永不复用）。
  string node_id = 1;
}
message DrainNodeResponse {}
message CordonNodeRequest {
  string node_id = 1;
}
message CordonNodeResponse {}
message UncordonNodeRequest {
  string node_id = 1;
}
message UncordonNodeResponse {}
