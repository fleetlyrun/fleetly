syntax = "proto3";

// Runtime 上下文（领域模型 §2）：集群观测与节点运维面（Node/Enrollment）。
package fleetly.runtime.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/runtime/v1;runtimev1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/policy.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

service NodesService {
  option (grpcapi.v1.service) = { default_policy: { authenticated: true } };

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = { get: "/v1/nodes" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["nodes:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // ListNodeContainers 实时观测节点上的在跑容器（RuntimeNodeInspect 面：
  // 每 running task/pod 对应一个容器；快照语义——直读编排器任务列表，观测
  // 缓存不参与）。平台节点 ID 为锚（运维三动词同锚）。
  rpc ListNodeContainers(ListNodeContainersRequest) returns (ListNodeContainersResponse) {
    option (google.api.http) = { get: "/v1/nodes/{node_id}/containers" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["nodes:read"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // EnrollNode 是节点材料动词（F0.20：节点零平台安装物）。无参数 = 初始
  // join 材料（中继材料不再随初始 enrollment 产出——join token 退出 relay
  // 鉴权面，节点锚定后按节点定向铸造）。活 join token 等价集群成员权
  //（不可逆），档位是 platform:admin（C3 收紧：nodes:admin 只覆盖可逆运维
  // 面，不得白送集群钥匙）；rotate 先轮换全部 join token 并作废全部节点
  // relay 凭证（泄漏处置）再返回新材料。
  rpc EnrollNode(EnrollNodeRequest) returns (EnrollNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/enroll" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["platform:admin"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  // 节点运维三动词（F0.19 RuntimeAdmin 面）：平台节点 ID 为锚；可逆的
  // 调度控制走 nodes write 档。
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node_id}/drain" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["nodes:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node_id}/cordon" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["nodes:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
  rpc UncordonNode(UncordonNodeRequest) returns (UncordonNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node_id}/uncordon" body: "*" };
    option (grpcapi.v1.method) = {
      policy: { require: [{ kind: "scope" values: ["nodes:write"] }] }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

// Node 是观测缓存行（非权威；节点 ID 永不复用）。
message Node {
  string platform_id = 1;
  // seq 是锚定序（ADR-0070：id 后缀即此号；分页游标轴）。
  int64 seq = 10;
  string carrier_id = 2;
  string hostname = 3;
  string role = 4;
  bool available = 5;
  string first_seen_at = 6;
  string last_seen_at = 7;
  // relay_online 是节点中继在连状态（活体观测——exec 会话的路由前提，
  // ADR-0049；false = 该节点不可 exec，重跑 enroll 的中继装载脚本恢复）。
  bool relay_online = 8;
  // relay_version 是在连节点中继上报的平台版本（滞后中继照常受理——帧
  // 协议只增；升级后重跑中继装载脚本即刷新）。
  string relay_version = 9;
}

message ListNodesRequest {
  // after_node_seq 游标（上一页末条 seq；0 = 首页）。游标轴 = seq 锚定
  // 序升序（既有响应序不变；ADR-0026 after_* + limit 惯例）。
  int64 after_node_seq = 1;
  int32 limit = 2;
}
message ListNodesResponse { repeated Node nodes = 1; }

// ListNodeContainersRequest 以平台节点 ID 为锚（永不复用）。
message ListNodeContainersRequest {
  string node_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}

// NodeContainer 是节点上一行在跑容器观测。归属字段是编排器载体归属标记
// 的平台投影（Provider 私有标记；标记缺席的字段留空诚实呈现）；编排器
// 实例标识平台不解析——exec 受理与 logs containers 过滤消费同一锚
//（ADR-0067）。container 按 docker 本义使用（第三方专有词汇豁免，
// 2026-10-16 用户裁定）。
message NodeContainer {
  // instance 是编排器实例标识（swarm task ID / k3s pod 名）。
  string instance = 1;
  // workload_id 是归属 Workload ID（App 域 = appID-process 投影；Task/
  // Database/Browse 域 = 域主键投影）。
  string workload_id = 2;
  // domain 是归属域主体：app | task | database | browse（ADR-0025 决策 4；
  // App 域之外的域 app_id 留空——workload_id 即域主体）。
  string domain = 3;
  // team/project_id/app_id/process 是隔离域与 App 域归属投影。
  string team = 4;
  string project_id = 5;
  string app_id = 6;
  string process = 7;
  // image 是载体镜像投影（观测面，非权威声明——声明真源在 Spec/Revision）。
  string image = 8;
}
message ListNodeContainersResponse { repeated NodeContainer containers = 1; }
message EnrollNodeRequest {
  // rotate 轮换 worker+manager join token，并作废全部节点 relay 凭证；
  // 响应只含 join_command（relay_command 空）。与 node_id/revoke 互斥。
  bool rotate = 1;
  // node_id 非空 = 针对该已锚定平台的 relay 材料动作（与 rotate 互斥）：
  //   revoke=false：铸新 relay 凭证（旧凭证即刻失效）并返回 relay_command；
  //   revoke=true ：只吊销该节点 relay 凭证，响应两命令皆空。
  string node_id = 2;
  bool revoke = 3;
}
message EnrollNodeResponse {
  // join_command 是工作节点完整加入命令（仅 swarm 形态）。
  string join_command = 1;
  // relay_command 是节点中继装载脚本（针对 node_id 铸造；含该节点个体凭证，
  // 不再含 join token）。初始 enroll / rotate 时为空：先 join，再按节点取。
  string relay_command = 2;
}

// 节点运维动词以平台节点 ID 为锚（响应无数据面：结果即动作本身）。
message DrainNodeRequest {
  // node_id 是平台节点 ID（永不复用）——必填：运维动词的锚点。
  string node_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message DrainNodeResponse {}
message CordonNodeRequest {
  // node_id 必填：运维动词的锚点。
  string node_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message CordonNodeResponse {}
message UncordonNodeRequest {
  // node_id 必填：运维动词的锚点。
  string node_id = 1 [
    (buf.validate.field).cel = {
      id: "string.required"
      message: "must not be empty"
      expression: "this.size() > 0"
    }
  ];
}
message UncordonNodeResponse {}
