version: v2
# protovalidate 依赖随首个带 validate 注解的 proto 引入（N0 后续批次）。
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
  - buf.build/lynx-go/grpcapi
modules:
  - path: proto
# 书面豁免（N0 修复批 C4）：internal/config/config.proto 不在本门禁内——
# 它是 fleetlyd 的运行配置内部结构（非公共 API 契约），生成走 mise 的
# generate:config 任务（protoc 直出 internal/config/config.pb.go），与
# buf 的公共契约链（lint/breaking/gateway/openapi）不同轴。纳入 buf 需
# 先把生成物路径并入模块结构——随配置面进 config.proto 公共化的批次再议。
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # ADR-0047 一次性更名豁免：fleetly.edge.v1 整包迁移至 fleetly.proxy.v1
  #（删除 edge.proto、新增 proxy.proto，词条更名非契约破坏）。豁免仅此
  # 旧路径、不开全局口子；落地 origin/main 后本条目可移除。
  ignore:
    - proto/fleetly/edge/v1/edge.proto
  # ADR-0049 附录 B 一次性更名豁免（2026-10-08）：节点中继词汇收口——
  # Node.relay_agent_version→relay_version、EnrollNodeResponse.agent_command
  # →relay_command（字段号与类型不动，词汇更名非契约破坏）。豁免仅此两
  # 规则此一文件、不开全局口子；落地 origin/main 后本条目可移除。
  ignore_only:
    FIELD_SAME_NAME:
      - proto/fleetly/runtime/v1/runtime.proto
    FIELD_SAME_JSON_NAME:
      - proto/fleetly/runtime/v1/runtime.proto
