# release 轨道（交付流水线 docs/design/2026-09-17-delivery-pipeline.md §2.2
# release 段 / P6「安装脚本 + 二进制签名与校验和」/ §2.5 供应链；T2.24 M1）。
#
# 触发：push tag v* + workflow_dispatch（输入已存在的 tag，供预演）。
# 制品链（deploy/README.md「release 契约」的落地）：
#   1. build matrix  linux amd64+arm64，CGO_ENABLED=0，-trimpath + 版本注入
#      （-X main.version=<tag>）→ fleetly_<tag>_linux_<arch>.tar.gz
#      （tar 包根下 fleetlyd+fleetly；安装脚本不打进 tar——独立制品，契约
#      保持 install.sh 在 release 根）。
#   2. checksums.txt 全部制品 sha256（两个 tar + 三个安装脚本）。
#   3. SBOM：syft（anchore/sbom-action@v0.24.2）产 spdx-json——tar.gz 不是
#      syft 支持的源 scheme，按 arch 解包后扫目录（Go 二进制经 go-module
#      cataloger 带出依赖清单），证据等价。
#   4. cosign keyless 签名（id-token: write，GitHub OIDC）：
#      sign-blob --bundle → checksums.txt.sig（Sigstore bundle JSON，v3
#      唯一签名产物形态）+ 提取 checksums.txt.cert。双验证门：
#        a) --bundle checksums.txt.sig + install.sh 同款 identity 约束；
#        b) install.sh 命令面 + --certificate（install.sh 原命令缺
#           --certificate/--bundle，cosign ≥2.6 NOf 门直接报错——已实证；
#           b) 证明修 install.sh 一行即可验通，见 deploy/README.md 增补与
#           遗留问题）。
#   5. ghcr 镜像：deploy/Dockerfile.fleetlyd（多阶段，golang 构建层 + alpine
#      运行层，入口 fleetlyd）→ ghcr.io/fleetlyrun/fleetlyd:<tag>（linux/
#      amd64；arm64 运行形态走 tarball/安装器，见遗留）+ cosign sign 镜像
#      （keyless，按 digest 签）。
#   6. GitHub Release：gh release create 附全部制品 + notes 模板（引擎支持
#      矩阵 + 安装一条命令 + 验签指引）。
#
# 首发实跑归 T2.26（打 tag 验收）；本文件 T2.24 落地，本地仅做 YAML 解析与
# 命令面自查。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GHCR_IMAGE: ghcr.io/fleetlyrun/fleetlyd
  EXPECTED_SIGNER: ^https://github\.com/fleetlyrun/fleetly/
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # ─────────────────────────────────────────────── 1. 交叉编译 + 打包 ────
  build:
    name: build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          printf '%s' "$V" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}([-+][A-Za-z0-9.-]+)?$' ||
            { echo "::error::version '$V' is not a v-prefixed semver tag"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - name: cross build (CGO off, trimpath, version injected)
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          GOOS=linux GOARCH='${{ matrix.arch }}' CGO_ENABLED=0 \
            go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/out/fleetlyd" ./cmd/fleetlyd
          GOOS=linux GOARCH='${{ matrix.arch }}' CGO_ENABLED=0 \
            go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/out/fleetly" ./cmd/fleetly
      - name: version smoke (binary self-report)
        # amd64 可本机直跑自报版本；arm64 只验产物存在（交叉编译证明，
        # 运行 smoke 属 QEMU 成本，列遗留——交付 §M1 的 arm64 release smoke）。
        run: |
          test -s dist/out/fleetlyd && test -s dist/out/fleetly
          if [ '${{ matrix.arch }}' = 'amd64' ]; then
            [ "$(dist/out/fleetly version 2>/dev/null | awk '{print $2}')" = '${{ steps.ver.outputs.version }}' ]
          fi
      - name: pack tar.gz (archive root = fleetlyd+fleetly)
        run: |
          mkdir -p dist/pkg
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "dist/fleetly_${{ steps.ver.outputs.version }}_linux_${{ matrix.arch }}.tar.gz" \
            -C dist/out fleetlyd fleetly
          sha256sum "dist/fleetly_${{ steps.ver.outputs.version }}_linux_${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tar-linux-${{ matrix.arch }}
          path: dist/fleetly_*.tar.gz
          if-no-files-found: error

  # ───────────────────────────────────────────── 2. checksums + 安装脚本 ──
  checksums:
    name: checksums + installer scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-tar-linux-*
          merge-multiple: true
          path: dist
      - name: stage installer scripts (independent release assets, flat names)
        run: |
          sh -n deploy/install.sh && sh -n deploy/uninstall.sh && sh -n deploy/upgrade.sh
          cp deploy/install.sh deploy/uninstall.sh deploy/upgrade.sh dist/
      - name: generate checksums.txt (asset names = final release names)
        run: |
          cd dist
          sha256sum fleetly_*.tar.gz install.sh uninstall.sh upgrade.sh > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: |
            dist/checksums.txt
            dist/fleetly_*.tar.gz
            dist/install.sh
            dist/uninstall.sh
            dist/upgrade.sh
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────── 3. SBOM ──
  sbom:
    name: SBOM (syft spdx-json)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-tar-linux-*
          merge-multiple: true
          path: dist
      - name: extract per-arch tarballs (syft scans dirs, not raw tars)
        run: |
          cd dist
          for tarball in fleetly_*.tar.gz; do
            arch=${tarball##*linux_}; arch=${arch%.tar.gz}
            mkdir -p "sbom-src/$arch"
            tar -xzf "$tarball" -C "sbom-src/$arch"
          done
          ls -la sbom-src/*
      - name: sbom linux/amd64
        uses: anchore/sbom-action@v0.24.2
        with:
          artifact: dist/sbom-src/amd64
          format: spdx-json
          output-file: dist/fleetly_${{ steps.ver.outputs.version }}_linux_amd64.spdx.json
      - name: sbom linux/arm64
        uses: anchore/sbom-action@v0.24.2
        with:
          artifact: dist/sbom-src/arm64
          format: spdx-json
          output-file: dist/fleetly_${{ steps.ver.outputs.version }}_linux_arm64.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: dist/*.spdx.json
          if-no-files-found: error

  # ───────────────────────────────────────────── 4. cosign keyless 签名 ──
  sign:
    name: sign checksums (cosign keyless)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: checksums
    steps:
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: dist
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign checksums.txt (keyless; GitHub OIDC)
        run: |
          cd dist
          # cosign v3 keyless 的唯一签名产物形态是 Sigstore bundle（已本地
          # 实证：v3 无 --output-signature/--output-certificate，stdout 为
          # 空）。checksums.txt.sig = bundle JSON（install.sh 契约文件名；
          # 内嵌签名 + 证书 + Rekor 条目，自足可验）。
          cosign sign-blob --yes \
            --bundle checksums.txt.sig \
            checksums.txt
          # 从 bundle 提取签名证书（install.sh --certificate 形态用）。bundle 内
          # 是裸 base64(DER)——封装为规范 PEM（64 列折行），verify 与分发都要 PEM。
          jq -r '.verificationMaterial.x509CertificateChain.certificates[0]' \
            checksums.txt.sig | fold -w 64 \
            | { echo '-----BEGIN CERTIFICATE-----'; cat; echo '-----END CERTIFICATE-----'; } \
            > checksums.txt.cert
          test -s checksums.txt.cert
          grep -q 'BEGIN CERTIFICATE' checksums.txt.cert
      - name: dump bundle structure (debug)
        if: always()
        run: |
          cd dist
          echo '--- top-level keys ---'
          jq -r 'keys[]' checksums.txt.sig
          echo '--- verificationMaterial keys ---'
          jq -r '.verificationMaterial // {} | keys[]' checksums.txt.sig
          echo '--- x509 chain length + first 40 chars ---'
          jq -r '.verificationMaterial.x509CertificateChain.certificates // [] | length' checksums.txt.sig
          jq -r '.verificationMaterial.x509CertificateChain.certificates[0] // "NULL" | .[0:40]' checksums.txt.sig
          echo '--- messageSignature keys ---'
          jq -r '.messageSignature // {} | keys[]' checksums.txt.sig
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-signature-debug
          path: dist/checksums.txt.sig
          if-no-files-found: error
      - name: verify gate A — bundle form with install.sh identity constraints
        run: |
          cd dist
          cosign verify-blob \
            --bundle checksums.txt.sig \
            --certificate-identity-regexp "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            checksums.txt
      - name: verify gate B — install.sh command face + --certificate
        # install.sh 的 cosign 命令缺 --certificate/--bundle（cosign ≥2.6 的
        # NOf 门必拒，已实证）——本门证明：补上 --certificate 后 install.sh
        # 的命令面原样验通（identity regexp 与 issuer 与 install.sh 逐字一致）。
        run: |
          cd dist
          jq -r '.messageSignature.signature' checksums.txt.sig > detached.b64
          cosign verify-blob \
            --signature detached.b64 \
            --certificate checksums.txt.cert \
            --certificate-identity-regexp "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-signature
          path: |
            dist/checksums.txt.sig
            dist/checksums.txt.cert
          if-no-files-found: error

  # ────────────────────────────────────────────── 5. ghcr 镜像 + 签名 ────
  image:
    name: ghcr image + cosign sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.fleetlyd
          push: true
          build-args: |
            FLEETLY_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.version }}
          # v0.1 容器形态是「可选运行形态」：amd64 单平台（arm64 运行形态走
          # tarball/安装器）；多平台镜像（QEMU）列遗留。
          platforms: linux/amd64
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign sign image (keyless, by digest)
        run: |
          cosign sign --yes \
            '${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}'
      - name: cosign verify image gate
        run: |
          cosign verify \
            '${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}' \
            --certificate-identity-regexp "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER"

  # ────────────────────────────────────────────────── 6. GitHub Release ──
  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build, checksums, sbom, sign, image]
    steps:
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: collect release files (flat layout)
        run: |
          mkdir -p rel
          mv dist/fleetly_*.tar.gz rel/
          mv dist/checksums.txt dist/checksums.txt.sig dist/checksums.txt.cert rel/
          mv dist/install.sh dist/uninstall.sh dist/upgrade.sh rel/
          mv dist/fleetly_*.spdx.json rel/
          ls -la rel/
      - name: release notes (engine matrix + install + verification)
        run: |
          V='${{ steps.ver.outputs.version }}'
          cat > rel/notes.md <<NOTES
          ## fleetly $V

          ### 安装（一条命令）

          \`\`\`sh
          curl -fsSL https://fleetly.dev/install.sh | sudo sh -
          # 钉定本版本：
          curl -fsSL https://fleetly.dev/install.sh | sudo sh - --version $V
          \`\`\`

          支持平台：linux amd64 / arm64（干净 VPS，root，安装器自带引擎门禁）。

          ### 引擎支持矩阵（architecture §4.2）

          | Docker Engine | 状态 |
          |---|---|
          | >= 29.8.1 | 支持（门禁下限，硬门禁） |
          | 29.7.x | 上一受支持 minor（nightly V7 矩阵回归覆盖） |
          | < 29.7 | 不支持（安装器拒绝；29.x 有破坏史） |
          | nftables-only 后端 | 暂不支持 Swarm 节点（安装器拒绝并给修复提示） |

          ### 制品

          | 文件 | 说明 |
          |---|---|
          | \`fleetly_${V}_linux_<arch>.tar.gz\` | fleetlyd + fleetly（包根） |
          | \`checksums.txt\` | 全部制品 sha256（安装器必验） |
          | \`checksums.txt.sig\` | Sigstore bundle 签名（cosign keyless，GitHub OIDC） |
          | \`checksums.txt.cert\` | 签名证书（PEM） |
          | \`install.sh\` / \`uninstall.sh\` / \`upgrade.sh\` | 安装 / 卸载 / 平台自升级 |
          | \`*.spdx.json\` | SBOM（syft，SPDX JSON） |

          ### 完整性验证

          \`\`\`sh
          sha256sum -c <(grep 'fleetly_${V}_linux_amd64' checksums.txt)
          # checksums 签名（cosign >= 2.6 / 3.x，Sigstore bundle 形态）：
          cosign verify-blob --bundle checksums.txt.sig \\
            --certificate-identity-regexp '^https://github\\.com/fleetlyrun/fleetly/' \\
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
            checksums.txt
          \`\`\`

          镜像：\`${{ env.GHCR_IMAGE }}:$V\`（cosign keyless 签名，同 identity 约束；
          v0.1 容器形态为可选运行形态，主形态仍为宿主二进制 + systemd）。
          NOTES
      - name: create release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V='${{ steps.ver.outputs.version }}'
          gh release create "$V" --verify-tag \
            --title "fleetly $V" \
            --notes-file rel/notes.md
          gh release upload "$V" rel/fleetly_*.tar.gz rel/checksums.txt \
            rel/checksums.txt.sig rel/checksums.txt.cert \
            rel/install.sh rel/uninstall.sh rel/upgrade.sh \
            rel/*.spdx.json --clobber
