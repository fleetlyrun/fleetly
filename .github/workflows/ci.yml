name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + proto + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking 需要 origin/main 可解析。
          fetch-depth: 0

      # 工具链唯一来源：mise.toml（go/buf/golangci-lint 全钉版本，与本地
      # 完全一致；torchwood 同款模式）。
      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Buf lint
        run: buf lint

      - name: Buf breaking (proto contract drift)
        run: buf breaking --against '.git#branch=origin/main'

      - name: Format check (gofmt) + go vet
        run: mise run lint:go

      - name: golangci-lint
        run: mise run lint:golangci

      # codegen 漂移检查（buf generate / wire 同步）在本地门禁（mise run
      # generate:all + git diff）：CI 冷环境重跑生成受 tidy/网络影响会产生
      # 本地不复现的 diff（torchwood 2026-09-23 裁决沿用）。

      - name: Tests (race, three modules)
        run: go test -race ./... ./genproto/... ./sdk/go/...

  # Console（F2.6/ADR-0044）：类型再生成 + 构建 + 零漂移断言（src/api
  # 类型 + internal/console/dist 产物双钉）；node/pnpm 走 mise.toml 钉版
  #（与本地同源）。构建产物 committed 进仓（纪律同 genproto），漂移在此
  # 红即"改了 proto/前端没再生成"。
  console:
    name: Console (types + build drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            console/node_modules
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('console/pnpm-lock.yaml') }}

      - name: Console types + build (drift gate)
        run: mise run console:verify

  e2e:
    name: E2E (dind single-node smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images (network-stable smoke)
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27

      - name: dind smoke (deploy → succeeded → rollback → read paths)
        run: mise run e2e:dind

  # N0.1 P2-9：h2c / 双节点两件 e2e 进 CI（并行 job，镜像按脚本实际依赖
  # 预拉——dind 内不走外网，宿侧 image save | load 注入，与 smoke 同款）。
  e2e-h2c:
    name: E2E (dind managed traefik + h2c route)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull traefik:v3.5
          docker pull traefik/whoami:v1.10

      - name: h2c route e2e (managed traefik on the project network)
        run: mise run e2e:h2c

  e2e-twonode:
    name: E2E (dind two-node enroll + volume pinning)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27

      - name: two-node e2e (enroll join → dual-node deploy → volume pinning)
        run: mise run e2e:twonode

  # P1（优化方案提案 2026-10-03）：升级矩阵 CI 的单配对形态。旧版 =
  # HEAD~1 的 worktree 构建（fetch-depth ≥2 是前提）；三件负载零扰动断言
  # = ADR-0015 验收的 CI 化。tag 通道成型后切 latest-tag→HEAD 配对。
  e2e-upgrade:
    name: E2E (dind upgrade matrix HEAD~1 -> HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1（旧版二进制源）必须在 fetched 历史内。
          fetch-depth: 2

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27
          docker pull traefik:v3.5
          docker pull traefik/whoami:v1.10
          docker pull postgres:17-bookworm

      - name: upgrade matrix (route zero-fail + workload zero-restart + db zero-roll)
        run: mise run e2e:upgrade

  # F2.2（ADR-0039/0020）：恢复演练是 Backup 功能的验收必过项——四引擎
  # 创建→种子→备份→verify→恢复到新库→数据断言（pg/mysql/mongo 流式 +
  # redis 预置卷）+ Platform Backup 本地仓 roundtrip + F2.8 S3 离机腿
  # （silo 假端点：对象落桶 + restic 外置仓 + 消警，ADR-0042）。
  e2e-backup:
    name: E2E (dind backup drill, four engines + platform + s3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull dind base + silo (S3 fake endpoint)
        run: |
          docker pull docker:29-dind
          docker pull pgsty/silo:RELEASE.2026-09-16T00-00-00Z

      - name: backup drill (backup -> verify -> restore to new database -> data assertions)
        run: mise run e2e:backup
