name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + proto + test)
    runs-on: ubuntu-latest
    env:
      # R15-L4 守卫的基线：CI 上强制指定 origin/main——不可解析即红，不在
      # PR 面静默退化为"只看工作树"（本地未设时守卫按 origin/main > HEAD
      # 解析）。
      FLEETLY_CONSOLE_SYNC_BASE: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking 需要 origin/main 可解析。
          fetch-depth: 0

      # 工具链唯一来源：mise.toml（go/buf/golangci-lint 全钉版本，与本地
      # 完全一致；torchwood 同款模式）。
      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Buf lint
        run: buf lint

      - name: Buf breaking (proto contract drift)
        run: buf breaking --against '.git#branch=origin/main'

      - name: Format check (gofmt) + go vet
        run: mise run lint:go

      # 跨平台编译门禁（R09-L7）：Windows 是仓内声明的开发平台之二（生产
      # 部署 Linux-only）。只编译不测试——Unix-only 符号（signal/TTY/权限）
      # 漂移此前只在开发者本机 `go build` 时显形，CI 永不红。
      - name: Cross-compile (windows/amd64, build only)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

      - name: golangci-lint
        run: mise run lint:golangci

      # codegen 漂移检查（buf generate / wire 同步）由独立 codegen job 覆盖
      # （mise run generate:verify，与本地同款）。

      - name: Tests (race, three modules)
        run: go test -race ./... ./genproto/... ./sdk/go/...

  # 生成物零漂移门禁（R09-M1）：genproto/**、config.pb.go、wire_gen.go 是
  # 提交进仓的生成物（AGENTS.md「生成物纪律：手改即错」）；generate:verify
  # 再生成 + git diff 断言，与本地同款命令。独立 job 让"改了 proto 没再
  # 生成"在 CI 定位清楚，而不是只活在本地门禁里。
  codegen:
    name: Codegen (generated artifacts drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Generated artifacts (drift gate)
        run: mise run generate:verify

  # 换装 hermeticity 回归锚（R12-M5）：verify:hermetic 是 2026-10-11 换装
  # 事故的回归锚（工作树构建把未提交改动带进部署二进制），此前只活在本地
  # 门禁/runbook 的记忆里。成本 9s 级：git archive HEAD 快照双构建 +
  # sha256 一致 + 版本戳对账；与本地同命令。
  hermetic:
    name: Hermetic build channel (verify:hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Hermeticity probe (double build sha256 + commit stamp)
        run: mise run verify:hermetic

  # Console（F2.6/ADR-0044）：类型再生成 + 构建 + 零漂移断言（src/api
  # 类型 + internal/interfaces/console/dist 产物双钉）；node/pnpm 走 mise.toml 钉版
  #（与本地同源）。构建产物 committed 进仓（纪律同 genproto），漂移在此
  # 红即"改了 proto/前端没再生成"。
  console:
    name: Console (types + build drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            console/node_modules
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('console/pnpm-lock.yaml') }}

      - name: Console types + build (drift gate)
        run: mise run console:verify

  e2e:
    name: E2E (dind single-node smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images (network-stable smoke)
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27

      - name: dind smoke (deploy → succeeded → rollback → read paths)
        run: mise run e2e:dind

  # N0.1 P2-9：h2c / 双节点两件 e2e 进 CI（并行 job，镜像按脚本实际依赖
  # 预拉——dind 内不走外网，宿侧 image save | load 注入，与 smoke 同款）。
  e2e-h2c:
    name: E2E (dind managed traefik + h2c route)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull traefik:v3.5
          docker pull traefik/whoami:v1.10
          docker pull caddy:2.11-alpine

      - name: h2c route e2e (managed traefik on the project network)
        run: mise run e2e:h2c

  e2e-twonode:
    name: E2E (dind two-node enroll + volume pinning)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27
          docker pull busybox:1.37

      - name: two-node e2e (enroll join → dual-node deploy → volume pinning)
        run: mise run e2e:twonode

  # P1（优化方案提案 2026-10-03）：升级矩阵 CI 的单配对形态。旧版 =
  # HEAD~1 的 worktree 构建（fetch-depth ≥2 是前提）；三件负载零扰动断言
  # = ADR-0015 验收的 CI 化。tag 通道成型后切 latest-tag→HEAD 配对。
  e2e-upgrade:
    name: E2E (dind upgrade matrix HEAD~1 -> HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1（旧版二进制源）必须在 fetched 历史内。
          fetch-depth: 2

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27
          docker pull traefik:v3.5
          docker pull traefik/whoami:v1.10
          docker pull postgres:17-bookworm

      - name: upgrade matrix (route zero-fail + workload zero-restart + db zero-roll)
        run: mise run e2e:upgrade

  # F2.2（ADR-0039/0020）：恢复演练是 Backup 功能的验收必过项——四引擎
  # 创建→种子→备份→verify→恢复到新库→数据断言（pg/mysql/mongo 流式 +
  # redis 预置卷）+ Platform Backup 本地仓 roundtrip + F2.8 S3 离机腿
  # （silo 假端点：对象落桶 + restic 外置仓 + 消警，ADR-0042）。
  e2e-backup:
    name: E2E (dind backup drill, four engines + platform + s3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull dind base + silo (S3 fake endpoint)
        run: |
          docker pull docker:29-dind
          docker pull pgsty/silo:RELEASE.2026-09-16T00-00-00Z

      - name: backup drill (backup -> verify -> restore to new database -> data assertions)
        run: mise run e2e:backup

  # 挂账清偿批（2026-10-16 用户裁决）：template / browse / bluegreen 三腿
  # 进 CI（原 G20 对账白名单「时间预算本地常态跑」三条目随批删除）。镜像
  # 按脚本实际依赖预拉——dind 内不走外网，宿侧 image save | load 注入，
  # 与 smoke/h2c 同款。
  e2e-template:
    name: E2E (dind template catalog + instantiation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull traefik:v3.5
          docker pull traefik/whoami:v1.10
          docker pull nginx:1.27

      - name: template e2e (builtin catalog + refresh + instantiate full chain)
        run: mise run e2e:template

  e2e-browse:
    name: E2E (dind browse gateway + pgweb sessions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull traefik:v3.5
          docker pull sosedoff/pgweb:0.17.0
          docker pull postgres:17-bookworm

      - name: browse e2e (session lifecycle + gateway routes)
        run: mise run e2e:browse

  e2e-bluegreen:
    name: E2E (dind blue-green deploy dual-generation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull traefik:v3.5
          docker pull busybox:1.37

      - name: bluegreen e2e (blue-green strategy + generation cutover)
        run: mise run e2e:bluegreen

  # F4.1/ADR-0052：k3s 第二运行时两腿进 CI。snapshotter 走 fuse-overlayfs
  #（GH runner 的 dind 内同样拒 nested overlay——PR #1 实证 multiple-
  # lowerdir mount invalid argument，overlayfs 假设否决；fuse 用户态 CoW
  # 首容器秒级，--device /dev/fuse + 四 apk 预载 mount.fuse3 helper 由脚本
  # fuse 分支承载，ADR-0052 决策 8 补录）；k3s 资产 ~280MB（二进制 +
  # airgap tar）走 actions/cache。
  e2e-k3s:
    name: E2E (dind k3s runtime full chain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLEETLY_E2E_K3S_SNAPSHOTTER: fuse
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/fleetly-e2e
          key: k3s-e2e-${{ hashFiles('e2e/dind-k3s.sh') }}
          restore-keys: k3s-e2e-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27
          docker pull busybox:1.37
          docker pull traefik:v3.5.4

      - name: k3s full chain (deploy -> carriers -> rollback -> egress drill -> database PVC -> managed traefik route)
        run: mise run e2e:k3s

  e2e-runtimeswitch:
    name: E2E (dind runtime switch, scenario 3 acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLEETLY_E2E_K3S_SNAPSHOTTER: fuse
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/fleetly-e2e
          key: k3s-e2e-${{ hashFiles('e2e/dind-runtimeswitch.sh') }}
          restore-keys: k3s-e2e-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27
          docker pull traefik:v3.5.4

      - name: runtime switch e2e (swarm deploy/backup -> switch to k3s -> id preservation -> restore data loop)
        run: mise run e2e:runtimeswitch

  e2e-k3s-tw:
    name: E2E (dind k3s two-node, enrollment + cross-node exec)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLEETLY_E2E_K3S_SNAPSHOTTER: fuse
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/fleetly-e2e
          key: k3s-e2e-${{ hashFiles('e2e/dind-k3s-two-node.sh') }}
          restore-keys: k3s-e2e-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27
          docker pull busybox:1.37

      - name: k3s two-node e2e (enroll join -> both nodes relay_online -> volume-pinned worker pod -> cross-node exec)
        run: mise run e2e:k3s-tw

  e2e-k3s-ha:
    name: E2E (dind k3s HA, embedded etcd quorum + carrier zero-roll)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLEETLY_E2E_K3S_SNAPSHOTTER: fuse
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'genproto/go.sum', 'sdk/go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/fleetly-e2e
          key: k3s-e2e-${{ hashFiles('e2e/dind-k3s-ha.sh') }}
          restore-keys: k3s-e2e-

      - name: Pre-pull images
        run: |
          docker pull docker:29-dind
          docker pull nginx:1.27
          docker pull busybox:1.37

      - name: k3s HA e2e (3-server etcd quorum -> server1 outage zero-roll via kubelet autonomy -> recovery -> permanent server2 loss read-write green)
        run: mise run e2e:k3s-ha
