name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        # go.work 工作区模式下 ./... 只匹配主模块包；显式追加 sdk/go
        #（T0.3 起三 module：主仓 + genproto + sdk/go；genproto 无测试，
        # 作为主模块依赖经 replace 编译覆盖）。
        run: go test ./... ./sdk/go/... -race

  generate-sync:
    # wire 生成物同步检查：go generate 后工作区必须无差异。
    # GOWORK=off：wire v0.7.0 在 wire_gen.go 头部硬编码 `-mod=mod` 指令
    #（internal/wire/wire.go:270），该 flag 在 go.work 工作区模式非法
    #（-mod 仅允许 readonly/vendor），故生成步骤退回单 module 模式。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go generate
        run: go generate ./...
        env:
          GOWORK: "off"
      - name: check diff
        run: git diff --exit-code

  proto:
    # proto 契约门禁（T0.3，D21）：buf build/lint + buf breaking（FILE 规则，
    # 对 origin/main 比较）+ 生成物同步（buf generate 后 diff 必须为空——
    # genproto 产物已提交）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking 需 origin/main 可解析（torchwood 同款）。
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: v1.72.0
      - name: buf build
        run: buf build
      - name: buf lint
        run: buf lint
      - name: buf breaking
        # 首跑无基线处理：T0.3 引入 proto 之前 main 上没有任何 .proto，
        # buf breaking 对空基线直接报错（Module had no .proto files）。
        # 基线（origin/main）尚无 proto 时跳过本轮比较；首个契约 PR 合入
        # 后条件恒真，FILE 规则门禁自此实际生效。
        run: |
          if git ls-tree -r --name-only origin/main | grep -q '^proto/.*\.proto$'; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "baseline origin/main has no proto files (first contract PR); skip buf breaking"
          fi
      - name: buf generate
        run: buf generate
      - name: check generated diff
        run: git diff --exit-code

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    # T0.4 dind E2E 骨架（交付流水线 §2.2 PR 轨道第 5 项 / P2 / M0）：
    # docker:29.8.1-dind 容器内拉起 edgefleetd 冒烟（启动/健康检查/优雅关闭）。
    # 本 job 亦是 Spike B/C 与 nightly E2E 的底座：fixture 部署链（install →
    # 部署 fixture → 对账 → health gate → 路由 → 回滚 → 自升级）后续在此扩展。
    # 本地复跑见 e2e/README.md（与本地实跑同一条命令路径）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross build linux/amd64
        # CGO 关闭 → 静态可迁二进制，docker cp 进 Alpine 容器直接可执行。
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/edgefleetd ./cmd/edgefleetd
      - name: start dind container
        run: |
          docker run -d --name edgefleet-e2e-dind --privileged docker:29.8.1-dind
          # dind 内 dockerd 就绪门（60s）：smoke 本身不依赖 dockerd，但
          # 「特权 dind 可用」是 P2 的前提，骨架阶段顺带在此验证；后续
          # fixture 部署链（compose/Swarm 操作）依赖它。
          deadline=$(( $(date +%s) + 60 ))
          until docker exec edgefleet-e2e-dind docker info >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::dockerd inside dind not ready within 60s"
              docker logs edgefleet-e2e-dind --tail 50 || true
              exit 1
            fi
            sleep 2
          done
      - name: run smoke inside dind
        # 不用 docker cp：Engine 29.x 宿主 → 特权 dind 容器的 cp 会静默丢文件
        # （exit 0 但不落盘，Windows Desktop 29.7.2 与 CI Linux runner 双复现，
        # 见 e2e/README.md 已知问题）；统一走 exec+stdin 流式写入。
        run: |
          docker exec -i edgefleet-e2e-dind sh -c 'cat > /tmp/smoke.sh' < e2e/smoke.sh
          docker exec -i edgefleet-e2e-dind sh -c 'cat > /tmp/edgefleetd' < dist/edgefleetd
          docker exec edgefleet-e2e-dind sh -c 'chmod +x /tmp/edgefleetd && EDGEFLEETD_BIN=/tmp/edgefleetd sh /tmp/smoke.sh'
      - name: dump logs on failure
        if: failure()
        run: |
          docker exec edgefleet-e2e-dind sh -c 'tail -n 50 /tmp/edgefleetd-smoke.log 2>/dev/null || true' || true
          docker logs edgefleet-e2e-dind --tail 50 || true
      - name: cleanup
        if: always()
        run: docker rm -f edgefleet-e2e-dind
