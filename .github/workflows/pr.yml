name: ci

# F1（S20 交付/CI 修正）：全部 uses 钉 commit SHA，注释保留版本号便于人读
#（升级 action = 同时改 SHA 与版本注释）。SHA 于 2026-09-19 经 GitHub API
# /commits/<tag> 解析并经 tags 列表 / git ls-remote 交叉核验。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go test
        # go.work 工作区模式下 ./... 只匹配主模块包；显式追加 sdk/go
        #（T0.3 起三 module：主仓 + genproto + sdk/go；genproto 无测试，
        # 作为主模块依赖经 replace 编译覆盖）。
        run: go test ./... ./sdk/go/... -race

  generate-sync:
    # wire 生成物同步检查：go generate 后工作区必须无差异。
    # GOWORK=off：wire v0.7.0 在 wire_gen.go 头部硬编码 `-mod=mod` 指令
    #（internal/wire/wire.go:270），该 flag 在 go.work 工作区模式非法
    #（-mod 仅允许 readonly/vendor），故生成步骤退回单 module 模式。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go generate
        run: go generate ./...
        env:
          GOWORK: "off"
      - name: check diff
        run: git diff --exit-code

  proto:
    # proto 契约门禁（T0.3，D21）：buf build/lint + buf breaking（FILE 规则，
    # 对 origin/main 比较）+ 生成物同步（buf generate 后 diff 必须为空——
    # genproto 产物已提交）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # buf breaking 需 origin/main 可解析（torchwood 同款）。
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: v1.72.0
          # 带凭据调 api.github.com——匿名请求会撞 runner 共享 IP 的限流
          # （2026-09-19 proto 门实录：API rate limit exceeded）。
          github_token: ${{ github.token }}
      - name: buf build
        run: buf build
      - name: buf lint
        run: buf lint
      - name: buf breaking
        # 首跑无基线处理：T0.3 引入 proto 之前 main 上没有任何 .proto，
        # buf breaking 对空基线直接报错（Module had no .proto files）。
        # 基线（origin/main）尚无 proto 时跳过本轮比较；首个契约 PR 合入
        # 后条件恒真，FILE 规则门禁自此实际生效。
        run: |
          if git ls-tree -r --name-only origin/main | grep -q '^proto/.*\.proto$'; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "baseline origin/main has no proto files (first contract PR); skip buf breaking"
          fi
      - name: buf generate
        run: buf generate
      - name: check generated diff
        run: git diff --exit-code

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # F1：钉 v1.8.0（与 go-licenses/deadcode 同待遇，不追 @latest）——
        # 最新稳定线，go.mod 要求 go 1.26.0，与本仓 1.26.6 工具链匹配。
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  deadcode:
    # S16-C6（评审 2026-09-20 remediation-complete §4）：死代码门禁。
    # deadcode（RTA；钉 v0.49.0 = go.mod 既有 golang.org/x/tools 版本）分析
    # 主模块（go.work 下 ./... 只展开主模块；sdk/genproto 是对外消费面，
    # 不在分析域）。豁免清单 internal/testdata/deadcode-allow.txt：# 注释行
    # 忽略，其余每行一个固定子串（文件路径前缀或 "unreachable func:
    # <symbol>" 精确段）；输出路径统一正斜杠后 grep -v -F 过滤，残留非空
    # 即红——新增无人调用的符号必须显式清理或持理由入清单。
    # 注意：RTA 对经反射可达的导出方法（如 *state.Store 方法族）不报告，
    # 该盲区由评审纪律兜底；本门禁守住的是非反射面的无名腐烂。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: deadcode check
        run: |
          set -o pipefail
          go run golang.org/x/tools/cmd/deadcode@v0.49.0 ./... | tr '\\' '/' > deadcode.out
          grep -v '^#' internal/testdata/deadcode-allow.txt | grep -v '^$' > allow.patterns
          if grep -v -F -f allow.patterns deadcode.out | grep -q '^'; then
            echo '::error::deadcode 报告了未豁免的死代码（清理，或持理由更新 internal/testdata/deadcode-allow.txt）：'
            grep -v -F -f allow.patterns deadcode.out
            exit 1
          fi

  console:
    # T2.24 PR 轨道第 6 项（交付 §2.2）：console 门禁（typecheck+build / lint /
    # vitest）。build 脚本 = `tsc --noEmit && vite build`，typecheck 已含于 build。
    # pnpm-lock 冻结安装（--frozen-lockfile）；锁文件 lockfileVersion 9.0 →
    # pnpm 10 线。setup-node 的 pnpm 缓存要求 pnpm 先就位，故 action-setup 在前。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: pnpm gen:api (schema.d.ts 无漂移门禁，D4-②)
        # S17-D4-②（docs/design/2026-09-20-remediation-complete.md §5）：从
        # genproto/fleetly/server/v1/*.swagger.json 再生成 src/api/schema.d.ts，
        # 有 diff 即红——proto 变更后须重跑 `pnpm gen:api` 并提交产物，防止
        # console 手写/生成类型与 proto 漂移。
        run: |
          pnpm gen:api
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo '::error::src/api/schema.d.ts 与 genproto swagger 漂移：在 console/ 下跑 pnpm gen:api 并提交再生成产物'
            exit 1
          fi
      - name: pnpm build (tsc --noEmit + vite build)
        run: pnpm build
      - name: pnpm lint (eslint)
        run: pnpm lint
      - name: pnpm test (vitest run)
        run: pnpm test

  license-guard:
    # T2.24 PR 轨道第 4 项（交付 §2.2 / D5）：默认发行组件许可证守卫。
    # 白名单语义（清单外一律 fail，AGPL/DSAL/GPL/LGPL/SSPL/未知必阻）：
    #   {Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BSD-1-Clause,
    #    PostgreSQL, Python-2.0, Zlib, MPL-2.0, BlueOak-1.0.0}
    # 分类依据（2026-09-18 本机 go-licenses v2.0.1 全树实跑，153 行 report）：
    #   现有依赖树实际只出现 {MIT 60, Apache-2.0 59, BSD-3-Clause 27,
    #   BSD-2-Clause 1, MPL-2.0 1}——全部在白名单内；其余名单项是前瞻预留。
    #   负向对照：去掉 --ignore modernc.org/mathutil 后 check rc=1（Unknown 被
    #   拦），守卫确实咬合。
    # 豁免（--ignore 为纯路径前缀，见 go-licenses root.go "Package path
    # prefixes to be ignored"；被豁免包的传递依赖仍受检）：
    #   1. github.com/fleetlyrun/fleetly —— 本仓自有代码（根 LICENSE =
    #      Apache-2.0）；genproto/ 与 sdk/go/ 为同仓 replace 子模块目录，无
    #      独立 LICENSE 文件，分类器按模块根找不到文件而误报 Unknown，
    #      并非第三方依赖。
    #   2. modernc.org/mathutil —— 模块 zip 未随附 LICENSE 文件（go-licenses
    #      报 Unknown）；上游 gitlab.com/cznic/mathutil 仓库 LICENSE 为
    #      BSD-3-Clause（2026-09-18 原文核验：BSD 三条款再分发条款），
    #      在白名单语义内。
    # go.work 三模块分别扫：go.work 模式下 ./... 只展开主模块包，sdk/genproto
    # 的独立传递依赖需各自 GOWORK=off 扫描兜底（genproto 亦非零依赖——
    # protobuf 运行时等，照扫）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go-licenses check (root module)
        # 钉 v1.6.0（非 @latest/@v2.0.1，依据 2026-09-19 验收录证）：
        #   - go-licenses 自 v2.0.0 起模块路径为 github.com/google/go-licenses/v2，
        #     非后缀路径上 @v2.0.1 直接 invalid version（"go.mod has post-v2
        #     module path"），CI 必红；
        #   - 非后缀路径 @latest 解析到 v1.6.0（go list -m 实证）；
        #   - /v2@v2.0.1 在 go.work 模式下误报 in-toto 系 Did not find license
        #     （其自身依赖树混入扫描集），GOWORK=off 又解析不了 root 对 sdk/go
        #     的导入——v1.6.0 无此问题且为 T2.24 本地实证版本。
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses="$ALLOWED" --ignore github.com/fleetlyrun/fleetly --ignore modernc.org/mathutil
        env:
          ALLOWED: Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,0BSD,BSD-1-Clause,PostgreSQL,Python-2.0,Zlib,MPL-2.0,BlueOak-1.0.0
      - name: go-licenses check (sdk/go)
        run: cd sdk/go && GOWORK=off go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses="$ALLOWED" --ignore github.com/fleetlyrun/fleetly --ignore modernc.org/mathutil
        env:
          ALLOWED: Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,0BSD,BSD-1-Clause,PostgreSQL,Python-2.0,Zlib,MPL-2.0,BlueOak-1.0.0
      - name: go-licenses check (genproto)
        run: cd genproto && GOWORK=off go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses="$ALLOWED" --ignore github.com/fleetlyrun/fleetly --ignore modernc.org/mathutil
        env:
          ALLOWED: Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,0BSD,BSD-1-Clause,PostgreSQL,Python-2.0,Zlib,MPL-2.0,BlueOak-1.0.0

  e2e:
    # T0.4 dind E2E 骨架（交付流水线 §2.2 PR 轨道第 5 项 / P2 / M0）：
    # docker:29.8.1-dind 容器内拉起 fleetlyd 冒烟（启动/健康检查/优雅关闭）。
    # 本 job 亦是 Spike B/C 与 nightly E2E 的底座：fixture 部署链（install →
    # 部署 fixture → 对账 → health gate → 路由 → 回滚 → 自升级）后续在此扩展。
    # 本地复跑见 e2e/README.md（与本地实跑同一条命令路径）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: cross build linux/amd64
        # CGO 关闭 → 静态可迁二进制，docker cp 进 Alpine 容器直接可执行。
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/fleetlyd ./cmd/fleetlyd
      - name: start dind container
        run: |
          docker run -d --name fleetly-e2e-dind --privileged docker:29.8.1-dind
          # dind 内 dockerd 就绪门（60s）：smoke 本身不依赖 dockerd，但
          # 「特权 dind 可用」是 P2 的前提，骨架阶段顺带在此验证；后续
          # fixture 部署链（compose/Swarm 操作）依赖它。
          deadline=$(( $(date +%s) + 60 ))
          until docker exec fleetly-e2e-dind docker info >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::dockerd inside dind not ready within 60s"
              docker logs fleetly-e2e-dind --tail 50 || true
              exit 1
            fi
            sleep 2
          done
      - name: run smoke inside dind
        # 不用 docker cp：Engine 29.x 宿主 → 特权 dind 容器的 cp 会静默丢文件
        # （exit 0 但不落盘，Windows Desktop 29.7.2 与 CI Linux runner 双复现，
        # 见 e2e/README.md 已知问题）；统一走 exec+stdin 流式写入。
        run: |
          docker exec -i fleetly-e2e-dind sh -c 'cat > /tmp/smoke.sh' < e2e/smoke.sh
          docker exec -i fleetly-e2e-dind sh -c 'cat > /tmp/fleetlyd' < dist/fleetlyd
          docker exec fleetly-e2e-dind sh -c 'chmod +x /tmp/fleetlyd && FLEETLYD_BIN=/tmp/fleetlyd sh /tmp/smoke.sh'
      - name: dump logs on failure
        if: failure()
        run: |
          docker exec fleetly-e2e-dind sh -c 'tail -n 50 /tmp/fleetlyd-smoke.log 2>/dev/null || true' || true
          docker logs fleetly-e2e-dind --tail 50 || true
      - name: cleanup
        if: always()
        run: docker rm -f fleetly-e2e-dind

  deploy-scripts:
    # MG-E1（配对机制任务；架构评审 H6 + M9-4）：deploy/ 与 e2e/nightly/
    # root 执行脚本的 PR 轨道门禁。此前 8 个 job 零触碰 deploy/**，唯一的
    # 语法检查（sh -n）在 release.yml——root 执行的安装/升级脚本要等发版
    # 才被验证。两步均为纯 shell 自检，不引入第三方 action（供应链最小化）。
    # BOM 断言背景：BOM 前置于 shebang 时 execve 直接 ENOEXEC，而
    # sh xxx.sh 不受影响——dind 验收（sh 调用）测不出该缺陷
    # （2026-09-19 deploy/upgrade.sh 实录：UTF-8 BOM 随 release 制品分发）。
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: sh -n syntax check
        run: |
          fail=0
          for f in deploy/*.sh e2e/nightly/*.sh; do
            sh -n "$f" || { echo "::error file=$f::sh -n syntax check failed"; fail=1; }
          done
          exit "$fail"
      - name: no-BOM check
        run: |
          fail=0
          for f in deploy/*.sh e2e/nightly/*.sh; do
            b=$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$b" = "efbbbf" ]; then
              echo "::error file=$f::UTF-8 BOM (ef bb bf) before shebang -> execve ENOEXEC"
              fail=1
            fi
          done
          exit "$fail"
