# golangci-lint v2 配置（torchwood 全集：standard + bodyclose/gosec/noctx/
# sqlclosecheck，max-issues=0 不截断）。豁免清单从零开始：新代码必须过
# 全量门禁，禁止新增暂挂路径（torchwood J6-3 裁决沿用）。
version: "2"

run:
  timeout: 10m

# 关闭截断上限：默认 max-same-issues=3 会隐藏同类问题的真实数量，
# 且使结果随报告顺序漂移（门禁必须确定性）。
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - noctx
    - sqlclosecheck
  exclusions:
    paths:
      # 生成物不参与门禁（buf generate / protoc / wire）。
      - genproto/.*
      - internal/config/config\.pb\.go
      - internal/assembly/wire_gen\.go
      # 守卫测试自身含被扫描的禁词字面量（扫描器自指豁免）。
      - internal/guards/.*
