# source: self-authored for the B3a corpus gate (coverage: secrets 多服务共享引用——web/worker 同吃 db-password（database:pg name 覆盖），api 独享 api-token)
# license: self-authored for the fleetly corpus (dedicated to the public domain under CC0-1.0)
services:
  web:
    image: ghcr.io/acme/web:1
    ports: ["8080"]
    secrets:
      - db-password
      - source: api-token
  worker:
    image: busybox:1.37
    secrets: [db-password]
  api:
    image: ghcr.io/acme/api:1
    secrets: [api-token]
secrets:
  db-password:
    external: true
    name: "database:pg"
  api-token:
    external: true
