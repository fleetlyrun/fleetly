services:
  server:
    image: ghcr.io/acme/server:1
    labels:
      fleetly.databases: "alpha, beta ,alpha,,gamma"
    command:
      - sh
      - -c
      - 'migrate -database "${FLEETLY_DB_ALPHA_URL}?sslmode=disable" up'
  sidecar:
    image: busybox:1.36
