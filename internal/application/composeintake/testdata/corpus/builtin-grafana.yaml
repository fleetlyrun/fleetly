secrets:
    template-catalog-preview-admin_password:
        external: true
        name: template:catalog-preview:admin_password
services:
    grafana:
        environment:
            GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/template:catalog-preview:admin_password
            GF_SECURITY_ADMIN_USER: admin
