# source: https://github.com/docker/awesome-compose/blob/master/spring-postgres/compose.yaml (fetched 2026-10-31; build + file secret + 非 external 网/卷——多拒收面并存的真样本)
# license: CC0-1.0 (docker/awesome-compose repository license)
services:
  backend:
    build: backend
    ports:
      - 8080:8080
    environment:
      - POSTGRES_DB=example
    networks:
      - spring-postgres
  db:
    image: postgres
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - spring-postgres
    environment:
      - POSTGRES_DB=example
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt
networks:
  spring-postgres:
