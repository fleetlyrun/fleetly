# source: https://github.com/docker/awesome-compose/blob/master/nginx-golang/compose.yaml (fetched 2026-10-31; bind volumes + host ports + depends_on + build = fleetly 拒收面)
# license: CC0-1.0 (docker/awesome-compose repository license)
services:
  proxy:
    image: nginx
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - 80:80
    depends_on:
      - backend

  backend:
    build:
      context: backend
      target: builder
