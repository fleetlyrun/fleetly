syntax = "proto3";

// fleetlyd 配置结构（单一事实源）：lynx ConfigSource（YAML 文件 +
// FLEETLY_ 前缀环境变量，`.`→`_` 替换）解码到 AppConfig。生成方式见
// mise 任务 generate:config。
package fleetly.config.v1;

option go_package = "github.com/fleetlyrun/fleetly/internal/config";

message AppConfig {
  Server server = 1;
  Data data = 2;
  Engine engine = 3;
}

message Server {
  GRPC grpc = 1;
  HTTP http = 2;
}

message GRPC {
  // gRPC 监听地址（CLI 与 gateway 的上游）；空值回退默认 ":9080"。
  string addr = 1;
}

message HTTP {
  // REST gateway（grpc-gateway）监听地址；空值回退默认 ":9081"。
  string addr = 1;
}

message Data {
  // 数据根：SQLite、密封密钥等平台私有状态的落盘目录；
  // 空值回退默认 "./data"。
  string root = 1;
}

message Engine {
  // schedule_overlap_policy 是 Schedule 重叠策略（ADR-0018 A.3 修订 /
  // ADR-0017 附录 A.4）："skip"（默认——上一拍 Run 未终态时跳过本拍）或
  // "fire"（照常拍，允许并行拍）；空值回退 "skip"；非法值启动失败
  //（fail-fast，不静默回退）。env 形态 FLEETLY_ENGINE_SCHEDULE_OVERLAP_POLICY。
  string schedule_overlap_policy = 1;
}
