syntax = "proto3";

// fleetlyd 配置结构（单一事实源）：lynx ConfigSource（YAML 文件 +
// FLEETLY_ 前缀环境变量，`.`→`_` 替换）解码到 AppConfig。生成方式见
// mise 任务 generate:config。
package fleetly.config.v1;

option go_package = "github.com/fleetlyrun/fleetly/internal/config";

message AppConfig {
  Server server = 1;
  Data data = 2;
  Engine engine = 3;
  // 受管镜像仓库面（ADR-0036）：引用地址可配置，空值 = 停用（现状）。
  Registry registry = 4;
  // Platform Backup 面（F2.2，ADR-0039）：restic 快照节拍/保留/外置仓。
  PlatformBackup platform_backup = 5;
  // Logging 面（F2.4，ADR-0040）：受管 VictoriaLogs 检索端点与保留窗。
  Logging logging = 6;
}

// PlatformBackup 是控制面导出（CONTEXT.md 词条）的配置面：本地仓恒在
//（数据根内，ADR-0020 同机诚实边界），s3 在场 = 追加外置仓（restic 原生
// S3 backend；捎带 backups/ 目录离机——F2.8 ObjectStore s3 前的离机路径）。
message PlatformBackup {
  // interval_secs 是快照节拍（空值回退 86400 = 24h）。
  int64 interval_secs = 1;
  // retention_secs 是保留窗（空值回退 604800 = 7d；restic forget
  // --keep-within 同口径）。
  int64 retention_secs = 2;
  // s3 是外置仓配置；缺席 = 仅本地仓（"同机备份非灾备"诚实边界）。
  PlatformBackupS3 s3 = 3;
}

message PlatformBackupS3 {
  // endpoint 是 S3 兼容端点（含端口，如 s3.amazonaws.com 或自宿 RustFS）。
  string endpoint = 1;
  string bucket = 2;
  // prefix 是仓内路径前缀（空 = 桶根）。
  string prefix = 3;
  string access_key_id = 4;
  string secret_access_key = 5;
}

message Server {
  GRPC grpc = 1;
  HTTP http = 2;
  // Edge config 拉取端点（traefik HTTP provider 的控制面侧监听，ADR-0036）。
  EdgeConfig edge_config = 3;
}

message GRPC {
  // gRPC 监听地址（CLI 与 gateway 的上游）；空值回退默认 ":9080"。
  string addr = 1;
}

message HTTP {
  // REST gateway（grpc-gateway）监听地址；空值回退默认 ":9081"。
  string addr = 1;
}

message EdgeConfig {
  // Edge config 拉取端点（traefik HTTP provider 的控制面侧）监听地址；
  // 空值回退默认 ":9082"。该端点无认证（traefik HTTP provider 不支持
  // 凭证的既知形态），公网可达 = 任意人可改写全量路由——钉内网/VPC
  // 地址或以防火墙封公网（ADR-0036）。
  string addr = 1;
  // 拉取端点共享令牌（ADR-0036 N2 兑现）：非空时端点要求
  // X-Fleetly-Edge-Token 头常量时间比对（traefik 经
  // --providers.http.headers 同头携带），空 = 无认证现状（收窄是显式
  // 动作，升级零扰动）。多租户启用前的必选项。
  string auth_token = 2;
}

message Registry {
  // 受管仓库引用地址（含端口，如 10.124.0.3:5000）：镜像引用与 dockerd
  // --insecure-registry 的同一真源；空值 = 受管仓库停用（build 源部署
  // 在 prepare 精确失败）。与旧通道 env FLEETLY_REGISTRY_ADDR 同键，
  // config 值优先（ADR-0036）。env 形态 FLEETLY_REGISTRY_ADDR。
  string addr = 1;
}

// Logging 是受管日志面配置（ADR-0040）：addr 空 = Logging 面停用
//（logs 回退 Runtime 实时路径、build 日志回退环形缓冲——升级零扰动）。
message Logging {
  // 受管 VictoriaLogs 检索/采集端点（含端口，如 10.124.0.3:9428，
  // routing mesh 发布地址）；install.sh 与 registry.addr 同源物化。
  string addr = 1;
  // retention_days 是保留窗天数（空值回退 30；VL -retentionPeriod 同口径）。
  int64 retention_days = 2;
}

message Data {
  // 数据根：SQLite、密封密钥等平台私有状态的落盘目录；
  // 空值回退默认 "./data"。
  string root = 1;
}

message Engine {
  // schedule_overlap_policy 是 Schedule 重叠策略（ADR-0018 A.3 修订 /
  // ADR-0017 附录 A.4）："skip"（默认——上一拍 Run 未终态时跳过本拍）或
  // "fire"（照常拍，允许并行拍）；空值回退 "skip"；非法值启动失败
  //（fail-fast，不静默回退）。env 形态 FLEETLY_ENGINE_SCHEDULE_OVERLAP_POLICY。
  string schedule_overlap_policy = 1;
}
