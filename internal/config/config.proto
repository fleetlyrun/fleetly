syntax = "proto3";

// fleetlyd 配置结构（单一事实源）：lynx ConfigSource（YAML 文件 +
// FLEETLY_ 前缀环境变量，`.`→`_` 替换）解码到 AppConfig。生成方式见
// mise 任务 generate:config。
package fleetly.config.v1;

option go_package = "github.com/fleetlyrun/fleetly/internal/config";

message AppConfig {
  Server server = 1;
  Data data = 2;
  Engine engine = 3;
  // 受管镜像仓库面（ADR-0036）：引用地址可配置，空值 = 停用（现状）。
  Registry registry = 4;
  // Platform Backup 面（F2.2，ADR-0039）：restic 快照节拍/保留/外置仓。
  PlatformBackup platform_backup = 5;
  // Logging 面（F2.4，ADR-0040）：受管 VictoriaLogs 检索端点与保留窗。
  Logging logging = 6;
  // Metrics 面（F2.5，ADR-0041）：受管 VictoriaMetrics 端点与保留窗。
  Metrics metrics = 7;
  // 数据浏览器面（F3.6，ADR-0051）：host_suffix 空 = 面停用（BrowseDatabase
  // 精确拒绝，升级零扰动）。
  Browse browse = 8;
  // Runtime 面（F4.1，ADR-0052）：Runtime Provider 选择——整集群声明迁移
  //（per-部署双 Runtime 否决）；缺省 "swarm"（升级零扰动）。
  Runtime runtime = 9;
}

// PlatformBackup 是控制面导出（CONTEXT.md 词条）的配置面：本地仓恒在
//（数据根内，ADR-0020 同机诚实边界），s3 在场 = 追加外置仓（restic 原生
// S3 backend；捎带 backups/ 目录离机——F2.8 ObjectStore s3 前的离机路径）。
message PlatformBackup {
  // interval_secs 是快照节拍（空值回退 86400 = 24h）。
  int64 interval_secs = 1;
  // retention_secs 是保留窗（空值回退 604800 = 7d；restic forget
  // --keep-within 同口径）。
  int64 retention_secs = 2;
  // s3 是外置仓配置；缺席 = 仅本地仓（"同机备份非灾备"诚实边界）。
  PlatformBackupS3 s3 = 3;
}

message PlatformBackupS3 {
  // endpoint 是 S3 兼容端点（含端口，如 s3.amazonaws.com 或自宿 RustFS）。
  string endpoint = 1;
  string bucket = 2;
  // prefix 是仓内路径前缀（空 = 桶根）。
  string prefix = 3;
  string access_key_id = 4;
  string secret_access_key = 5;
}

message Server {
  GRPC grpc = 1;
  HTTP http = 2;
  // Proxy config 拉取端点（traefik HTTP provider 的控制面侧监听，ADR-0036）。
  ProxyConfig proxy_config = 3;
  // App 模板目录刷新源（F3.3，ADR-0050 决策 4）：base URL（清单拼
  // /catalog.json）；空 = 刷新停用（内嵌目录即全部——冷启动/离线形态）。
  // env 形态 FLEETLY_SERVER_TEMPLATES_CATALOG_URL。
  string templates_catalog_url = 4;
}

message GRPC {
  // gRPC 监听地址（CLI 与 gateway 的上游）；空值回退默认 ":9080"。
  string addr = 1;
}

message HTTP {
  // REST gateway（grpc-gateway）监听地址；空值回退默认 ":9081"。
  string addr = 1;
}

message ProxyConfig {
  // Proxy config 拉取端点（traefik HTTP provider 的控制面侧）监听地址；
  // 空值回退默认 ":9082"。该端点无认证（traefik HTTP provider 不支持
  // 凭证的既知形态），公网可达 = 任意人可改写全量路由——钉内网/VPC
  // 地址或以防火墙封公网（ADR-0036）。
  string addr = 1;
  // 拉取端点共享令牌（ADR-0036 N2 兑现）：非空时端点要求
  // X-Fleetly-Proxy-Token 头常量时间比对（traefik 经
  // --providers.http.headers 同头携带），空 = 无认证现状（收窄是显式
  // 动作，升级零扰动）。多租户启用前的必选项。
  string auth_token = 2;
}

message Registry {
  // 受管仓库引用地址（含端口，如 10.124.0.3:5000）：镜像引用与 dockerd
  // --insecure-registry 的同一真源；空值 = 受管仓库停用（build 源部署
  // 在 prepare 精确失败）。与旧通道 env FLEETLY_REGISTRY_ADDR 同键，
  // config 值优先（ADR-0036）。env 形态 FLEETLY_REGISTRY_ADDR。
  string addr = 1;
}

// Logging 是受管日志面配置（ADR-0040）：addr 空 = Logging 面停用
//（logs 回退 Runtime 实时路径、build 日志回退环形缓冲——升级零扰动）。
message Logging {
  // 受管 VictoriaLogs 检索/采集端点（含端口，如 10.124.0.3:9428，
  // routing mesh 发布地址）；install.sh 与 registry.addr 同源物化。
  string addr = 1;
  // retention_days 是保留窗天数（空值回退 30；VL -retentionPeriod 同口径）。
  int64 retention_days = 2;
}

// Metrics 是受管指标面配置（ADR-0041）：addr 空 = Metrics 面停用
//（零采集/零告警、查询精确失败——升级零扰动）。
message Metrics {
  // 受管 VictoriaMetrics 端点（含端口，如 10.124.0.3:8428，routing mesh
  // 发布地址）；install.sh 与 registry.addr 同源物化。
  string addr = 1;
  // retention_days 是保留窗天数（空值回退 30；VM -retentionPeriod 同口径）。
  int64 retention_days = 2;
}

// Browse 是数据浏览器面配置（ADR-0051）：host_suffix 空即整面停用——收窄是
// 显式动作，不静默降级（registry.addr 同文化）。
message Browse {
  // host_suffix 是 browse-<session id>. 的后缀域（如 dev.fleetly.run；泛解析
  // 或 sslip 形态均可）。空 = BrowseDatabase 拒绝（E_BROWSE_DISABLED）。env
  // 形态 FLEETLY_BROWSE_HOST_SUFFIX。
  string host_suffix = 1;
  // gateway_url 是容器可达的 REST gateway 基址（如 http://10.124.0.3:9081）：
  // entry 兑换入口与 ForwardAuth authorize 的寻址源（traefik configEndpoint
  // 同文化——traefik 容器能拉到的地址即正确地址）。env 形态
  // FLEETLY_BROWSE_GATEWAY_URL。
  string gateway_url = 2;
  // tls 是会话路由的 TLS 模式："none"（缺省，明文 :80）或 "auto"（LE per-host
  // SAN，需公网解析）；空值回退 "none"。env 形态 FLEETLY_BROWSE_TLS。
  string tls = 3;
}

// Runtime 是 Runtime Capability 配置面（ADR-0052 决策 1）：Provider 名
// 装配期经注册表 Build 选定；未注册名启动 fail-fast（Build 报错并列出
// 在册候选）。
message Runtime {
  // provider 是 Runtime Provider 名（在册：swarm、k3s）；空值回退 "swarm"。
  // env 形态 FLEETLY_RUNTIME_PROVIDER。
  string provider = 1;
  // k3s 是 k3s Provider 专属连接面。
  RuntimeK3s k3s = 2;
}

// RuntimeK3s 是 k3s Provider 连接面（kubeconfig 即全部——apiserver 地址
// 与凭证都在文件内；e2e 形态 fleetlyd 与 k3s 同容器即达）。
message RuntimeK3s {
  // kubeconfig 是 kubeconfig 文件路径；空值回退 "/etc/rancher/k3s/k3s.yaml"
  //（k3s 缺省路径）。env 形态 FLEETLY_RUNTIME_K3S_KUBECONFIG。
  string kubeconfig = 1;
}

message Data {
  // 数据根：SQLite、密封密钥等平台私有状态的落盘目录；
  // 空值回退默认 "./data"。
  string root = 1;
}

message Engine {
  // schedule_overlap_policy 是 Schedule 重叠策略（ADR-0018 A.3 修订 /
  // ADR-0017 附录 A.4）："skip"（默认——上一拍 Run 未终态时跳过本拍）或
  // "fire"（照常拍，允许并行拍）；空值回退 "skip"；非法值启动失败
  //（fail-fast，不静默回退）。env 形态 FLEETLY_ENGINE_SCHEDULE_OVERLAP_POLICY。
  string schedule_overlap_policy = 1;
}
