version: v2
plugins:
  # 版本与 mise [tools] 钉版一致（N0.1 P1-4：remote/local 两通道同版本，
  # pb.go 链字节一致；openapiv2 的 $ref 渲染差见 buf.gen.local.yaml 头注）。
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: genproto
    opt:
      - paths=source_relative

  - remote: buf.build/grpc-ecosystem/gateway:v2.27.4
    out: genproto
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.6.0
    out: genproto
    opt:
      - paths=source_relative

  # 字段名使用 proto 声明（snake_case），与运行时 marshaler（gateway.NewMarshaler
  # UseProtoNames:true）及 CLI --json 同策略保持一致，防 Console 验收
  # camelCase/snake_case 割裂。disable_default_errors 关闭生成器自带的
  # rpcStatus 默认错误注入；default 错误响应（fleetly.shared.v1.ErrorResponse）
  # 由各 proto 文件级 openapiv2_swagger 的 responses.default 声明。
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.27.3
    out: genproto
    opt:
      - json_names_for_fields=false
      - disable_default_errors=true
